name: UQCF-GEM source-escape original evidence archive
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths: ['.github/workflows/uqcf-gem-c3-source-escape-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-source-escape-original-archive
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  preserve-originals:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive_commit: ${{ steps.publish.outputs.archive_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape-tools
      - name: Audit and preserve the completed original run without rerunning science
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ResearchHistory/UQCF-GEM/research/physical-bridge/evidence
          python3 "$ROOT/source-escape-tools/collect_source_escape.py" "$ROOT/source-escape" --collect
      - name: Preserve the diagnosed sparse-staging failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys,urllib.request
          root=pathlib.Path('ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape')
          sys.path.insert(0,str(root))
          from collect_source_escape import SafeRedirect
          url='https://api.github.com/repos/proteinfoldingengine/WetLabEngine/actions/jobs/114376882630/logs'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(SafeRedirect()).open(req,timeout=180) as r: raw=r.read()
          text=raw.decode('utf-8-sig')
          for marker in ('7e1d79fd79170ba10cd227186138ad2c861a6564','PASS_ORIGINAL_EVIDENCE_AUDIT_NOT_NEW_SCIENCE','outside of your sparse-checkout definition','Cleaning up orphan processes'):
              if marker not in text: raise SystemExit('Incomplete original staging failure log')
          (root/'retained_failure/archive-staging-failure.log').write_bytes(raw)
          note={'run_id':38107795218,'job_id':114376882630,'source_url':url,'log_sha256':hashlib.sha256(raw).hexdigest(),'cause':'git add rejected the newly generated archive outside the sparse checkout; collection and original-evidence audit had passed','repair':'git add --sparse -- the explicitly bounded evidence directory','scientific_source_changed':False,'scientific_tests_rerun':False,'original_attempt_packet_artifact':11689834911,'original_attempt_packet_sha256':'cf72129874a93fee45f9135735831d900f37800e6c399b2bd3a990905a5af1a6','note':'The failed staging job produced a complete packet artifact but no Git publication. Its log and digest are retained; the four scientific original ZIPs are independently preserved unchanged.'}
          (root/'retained_failure/archive-staging-failure.json').write_text(json.dumps(note,indent=2,sort_keys=True)+'\n')
          manifest=json.loads((root/'readback_manifest.json').read_text())
          for name in ('retained_failure/archive-staging-failure.log','retained_failure/archive-staging-failure.json'):
              data=(root/name).read_bytes()
              manifest['files'][name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          (root/'readback_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish evidence only with fast-forward protection
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/uqcf-overlapping-guard-exchange
          ROOT=ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape
          LIVE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$LIVE" = "$GITHUB_SHA"
          git add --sparse -- "$ROOT"
          git config user.name 'UQCF-GEM evidence archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve source-escape original Actions evidence and reconcile recorded failures'
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'archive_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-permanent-original-packet
          path: ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape/
          compression-level: 0
          if-no-files-found: error
  immutable-readback:
    needs: preserve-originals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve-originals.outputs.archive_commit }}
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape
      - name: Independent immutable Git-byte readback and offline packet audit
        env:
          ARCHIVE_COMMIT: ${{ needs.preserve-originals.outputs.archive_commit }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape
          python3 "$ROOT/collect_source_escape.py" "$ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          sha=os.environ['ARCHIVE_COMMIT']
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=sha:
              raise SystemExit('Wrong immutable archive checkout')
          root='ResearchHistory/UQCF-GEM/research/physical-bridge/evidence/source-escape/'
          m=json.loads(pathlib.Path(root+'readback_manifest.json').read_text())
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',sha,'--',root],text=True).splitlines()
          expected=set(m['files'])|{'readback_manifest.json'}
          if {n[len(root):] for n in names}!=expected:
              raise SystemExit('Published file set differs from archive manifest')
          rows={}
          for n in sorted(expected):
              raw=subprocess.check_output(['git','show',sha+':'+root+n])
              row={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
              if n in m['files'] and row!=m['files'][n]:
                  raise SystemExit('Immutable content mismatch: '+n)
              if pathlib.Path(root+n).read_bytes()!=raw:
                  raise SystemExit('Working copy differs: '+n)
              rows[n]=row
          out={'status':'PASS_IMMUTABLE_ARCHIVE_READBACK','archive_commit':sha,'scientific_commit':m['scientific_commit'],'run_id':m['run_id'],'files':rows,'file_count':len(rows),'note':'All stored Git bytes checked; no scientific rerun or future closeout certification.'}
          pathlib.Path('immutable-readback.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='files'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-immutable-archive-readback
          path: immutable-readback.json
          if-no-files-found: error
