name: Verify joint readings and source-matched receiver-local writes
on:
  push:
    branches: [gpt/geometry-depth-two-proof]
    paths:
      - '.github/workflows/uqcf-fixed-pair-fidelity.yml'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/*fixed_pair*.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/FIXED_PAIR_FIDELITY.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/*receiver_turn*.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/RECEIVER_TURN.md'
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths
  HIST: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  P: ResearchHistory/UQCF-GEM/foundational-closure-verification
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &science_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/*.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/FIXED_PAIR*.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/fixed_pair*
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/RECEIVER_TURN*.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/receiver_turn*
      - &history_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
      - &setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay both native readers, matched source cuts and the positive-grade tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          mkdir replay
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > replay/install.log
          python "$SCI/check_fixed_pair.py" review_sources replay | tee replay/producer.log
          python "$SCI/verify_fixed_pair.py" replay | tee replay/independent.log
          python "$SCI/check_fixed_pair_match.py" review_sources replay | tee replay/matched.log
          python "$SCI/verify_fixed_pair_match.py" replay | tee replay/matched_independent.log
          python "$SCI/check_receiver_turn.py" review_sources replay | tee replay/receiver.log
          python "$SCI/verify_receiver_turn.py" replay | tee replay/receiver_independent.log
          cmp "$SCI/fixed_pair_matched.json.xz" replay/fixed_pair_matched.json.xz
          cmp "$SCI/fixed_pair_universe.json.xz" replay/fixed_pair_universe.json.xz
          cmp "$SCI/fixed_pair_certificate.json" replay/fixed_pair_certificate.json
          cmp "$SCI/receiver_turn_universe.json.xz" replay/receiver_turn_universe.json.xz
          cmp "$SCI/receiver_turn_certificate.json" replay/receiver_turn_certificate.json
          cp "$SCI"/{FIXED_PAIR*.md,*fixed_pair*.py,RECEIVER_TURN*.md,*receiver_turn*.py} replay/
          git rev-parse HEAD > replay/science-head.txt
          git -C review_sources rev-parse HEAD > replay/historical-head.txt
          (cd replay && sha256sum *.py *.md *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: receiver-turn-replay
          path: replay
          if-no-files-found: error
  argument-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *science_checkout
      - *history_checkout
      - name: Independently challenge the frozen argument
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_receiver_turn.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: receiver-turn-review
          path: review_evidence
          if-no-files-found: error
  foundational-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/
            /ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/
            /ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce the inherited foundational tests and complete certificate family
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIST"
          mkdir -p foundation
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > foundation/install.log
          git rev-parse HEAD > foundation/inherited-head.txt
          echo "$GITHUB_SHA" > foundation/workflow-head.txt
          python --version > foundation/python-version.txt
          (cd "$P" && python tests/test_fcv.py) 2>&1 | tee foundation/tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit) 2>&1 | tee foundation/parent-tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent && python -m unittest -v && python gate.py) 2>&1 | tee foundation/historical.log
          cp ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/result.json "$P/evidence/REPRODUCED_1615F.json"
          (cd "$P" && python produce_certificates.py) 2>&1 | tee foundation/producer.log
          (cd "$P" && python verify_certificates.py) 2>&1 | tee foundation/verifier.log
          cp "$P"/evidence/{PRODUCTION,VERIFICATION,TEST_RECEIPT,REPRODUCED_1615F}.json "$P/evidence/certificates.json.xz" foundation/
          test "$(xz -dc foundation/certificates.json.xz | sha256sum | cut -d' ' -f1)" = 21357bdc79429f9d4214024b125e75693609a2538a08a57037978b191ab432c6
          (cd foundation && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: receiver-turn-foundation
          path: foundation
          if-no-files-found: error
  publication:
    needs: [replay, argument-review, foundational-regression]
    if: ${{ always() && needs.replay.result == 'success' && needs.foundational-regression.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *science_checkout
      - *history_checkout
      - *setup_python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: receiver-turn-replay
          path: replay
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: receiver-turn-foundation
          path: foundation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: receiver-turn-review
          path: review_evidence
      - name: Reproduce scientific bytes and read back the exact external review status
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          (cd replay && sha256sum -c SHA256SUMS)
          (cd foundation && sha256sum -c SHA256SUMS)
          mkdir publication
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > publication/install.log
          python "$SCI/check_fixed_pair.py" review_sources publication | tee publication/fresh.log
          python "$SCI/verify_fixed_pair.py" publication | tee publication/independent.log
          python "$SCI/check_fixed_pair_match.py" review_sources publication | tee publication/matched.log
          python "$SCI/verify_fixed_pair_match.py" publication | tee publication/matched_independent.log
          python "$SCI/check_receiver_turn.py" review_sources publication | tee publication/receiver.log
          python "$SCI/verify_receiver_turn.py" publication | tee publication/receiver_independent.log
          cmp replay/fixed_pair_matched.json.xz publication/fixed_pair_matched.json.xz
          cmp replay/fixed_pair_universe.json.xz publication/fixed_pair_universe.json.xz
          cmp replay/fixed_pair_certificate.json publication/fixed_pair_certificate.json
          cmp replay/receiver_turn_certificate.json publication/receiver_turn_certificate.json
          cmp replay/receiver_turn_universe.json.xz publication/receiver_turn_universe.json.xz
          python "$SCI/review_receiver_turn.py" audit review_evidence
          cp review_evidence/publication_audit.json foundation/VERIFICATION.json publication/
          echo "$UQCF_WORKFLOW_SHA" > publication/workflow-head.txt
          (cd publication && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: receiver-turn-publication
          path: publication
          if-no-files-found: error
