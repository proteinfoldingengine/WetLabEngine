name: UQCF v16.27 increment attribution closure
on:
  push:
    branches: [research/v16.27-increment-attribution-closure]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v16.27-increment-attribution-closure/
          python test_gate.py
          python engine.py | tee result.json
          python - <<'PY'
          import json,verify
          d=json.load(open('result.json'));print(verify.verify_document(d,4))
          PY
      - name: Inherited v16.26 regression
        run: python ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/test_gate.py
