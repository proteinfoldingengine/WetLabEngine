name: Review source-cleared ternary receiver record
on:
  push:
    branches: [gpt/four-chart-exact-surface]
    paths:
      - ".github/workflows/uqcf-ternary-receiver-review.yml"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle/review_ternary_preparation.py"
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  CTRL: ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle
  DEMO: ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface
jobs:
  replay-review-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle/TERNARY_PREPARATION.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle/ternary_preparation.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle/ternary_preparation_evidence.json
            /ResearchHistory/UQCF-GEM/research/physical-bridge/archived_native_receiver_cycle/review_ternary_preparation.py
            /ResearchHistory/UQCF-GEM/demos/v16.50-recursive-binary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface/
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay original certificate and source-cleared controls
        run: |
          set -euo pipefail
          mkdir evidence
          PYTHONHASHSEED=91 python -B "$CTRL/ternary_preparation.py" "$DEMO" > evidence/replay.json
          cmp "$CTRL/ternary_preparation_evidence.json" evidence/replay.json
          PYTHONHASHSEED=17 python -B "$CTRL/ternary_preparation.py" "$DEMO" | cmp - evidence/replay.json
      - name: Obtain independent review of complete scoped argument
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -B "$CTRL/review_ternary_preparation.py" review evidence
      - name: Audit request, response and deterministic evidence
        run: |
          set -euo pipefail
          python -B "$CTRL/review_ternary_preparation.py" audit evidence | tee evidence/audit.log
          cp "$CTRL"/{TERNARY_PREPARATION.md,ternary_preparation.py,ternary_preparation_evidence.json,review_ternary_preparation.py} evidence/
          (cd evidence && sha256sum *.md *.py *.json *.txt *.log > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ternary-receiver-review
          path: evidence
          if-no-files-found: error
