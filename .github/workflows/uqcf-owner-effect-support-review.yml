name: Owner-effect support boundary independent review
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - '.github/workflows/uqcf-owner-effect-support-review.yml'
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.sha }}
concurrency:
  group: owner-effect-support-review
  cancel-in-progress: false
jobs:
  verification:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/owner_effect_support_boundary
            ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/recoverable_pruning_ledger
            ResearchHistory/UQCF-GEM/v15/v15.08
            ResearchHistory/UQCF-GEM/v15/v15.10
            ResearchHistory/UQCF-GEM/v15/v15.11
            ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Frozen proof integrity, independent exact controls and unchanged inherited stack
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_effect_support_review.py verify evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-effect-support-verification-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  review:
    if: github.run_attempt == 1
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/owner_effect_support_boundary
            ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/recoverable_pruning_ledger
            ResearchHistory/UQCF-GEM/v15/v15.08
            ResearchHistory/UQCF-GEM/v15/v15.10
            ResearchHistory/UQCF-GEM/v15/v15.11
            ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-effect-support-verification-1
          path: previous
      - name: Independent whole-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_effect_support_review.py review reviewed previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-effect-support-review-1
          path: reviewed
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  publication:
    if: always() && ((needs.verification.result == 'success' && needs.review.result == 'success') || github.run_attempt > 1)
    needs: [verification, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/owner_effect_support_boundary
            ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/recoverable_pruning_ledger
            ResearchHistory/UQCF-GEM/v15/v15.08
            ResearchHistory/UQCF-GEM/v15/v15.10
            ResearchHistory/UQCF-GEM/v15/v15.11
            ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-effect-support-verification-1
          path: previous
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-effect-support-review-1
          path: reviewed
      - name: Fresh reproduction, raw review parsing and immutable source readback
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_effect_support_review.py publication published previous reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-effect-support-publication-${{ github.run_attempt }}
          path: published
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  archive:
    if: always()
    needs: [verification, review, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/owner_effect_support_boundary
            ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/recoverable_pruning_ledger
            ResearchHistory/UQCF-GEM/v15/v15.08
            ResearchHistory/UQCF-GEM/v15/v15.10
            ResearchHistory/UQCF-GEM/v15/v15.11
            ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download and validate original ZIPs and completed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_effect_support_archive.py
      - name: Preserve evidence on authorized research branch
        env:
          REVIEW_BRANCH: research/uqcf-overlapping-guard-exchange
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name proteinfolding-gpt
          git config user.email proteinfolding-gpt@users.noreply.github.com
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/owner_effect_support_boundary/evidence
          git commit -m "Archive owner-effect-support review run $GITHUB_RUN_ID"
          git push origin "HEAD:$REVIEW_BRANCH"
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python .github/scripts/uqcf_owner_effect_support_archive.py readback FETCH_HEAD
