name: UQCF observation_effect draft 3 freeze review (grokbot)

on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_effect_review/RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_effect_review/FREEZE.md'
      - '.github/scripts/uqcf_obs_effect_*.py'
      - '.github/workflows/uqcf-gem-obs-effect-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uqcf-obs-effect-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: python -m pip install --no-cache-dir sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5
      - name: Producer (sympy exact)
        run: mkdir -p obs_effect_verify && python .github/scripts/uqcf_obs_effect_producer.py obs_effect_verify/producer.json
      - name: Checker (independent numpy/Fraction algorithm, bounded evidence, rejecting controls)
        run: python .github/scripts/uqcf_obs_effect_checker.py obs_effect_verify/checker.json
      - name: Fresh producer reproduction (deterministic bytes)
        run: python .github/scripts/uqcf_obs_effect_producer.py obs_effect_verify/producer_repro.json && cmp obs_effect_verify/producer.json obs_effect_verify/producer_repro.json
      - name: Comparator and tampering controls
        run: python .github/scripts/uqcf_obs_effect_compare.py obs_effect_verify/producer.json obs_effect_verify/checker.json obs_effect_verify/compare.json
      - name: Environment record
        if: always()
        run: |
          python -c "import sys,numpy,sympy,json;json.dump({'python':sys.version,'numpy':numpy.__version__,'sympy':sympy.__version__,'sha':'${{ github.sha }}','workflow_sha':'${{ github.workflow_sha }}'},open('obs_effect_verify/env.json','w'))"
          sha256sum obs_effect_verify/* > obs_effect_verify/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: obs-effect-verify-${{ github.run_attempt }}
          path: obs_effect_verify
          if-no-files-found: error
          retention-days: 90

  argument-review:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: obs-effect-verify-${{ github.run_attempt }}
          path: obs_effect_verify
      - name: Fresh independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_obs_effect_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: obs-effect-review-${{ github.run_attempt }}
          path: obs_effect_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    needs: [verify, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: obs-effect-verify-${{ github.run_attempt }}
          path: obs_effect_verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: obs-effect-review-${{ github.run_attempt }}
          path: obs_effect_review
      - name: Independent immutable GitHub readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/uqcf_obs_effect_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: obs-effect-publication-${{ github.run_attempt }}
          path: obs_effect_publication
          if-no-files-found: error
          retention-days: 90
