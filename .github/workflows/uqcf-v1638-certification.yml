name: UQCF v16.38 prospective certification
on:
  push:
    branches: [research/v16.38-six-vertex-barriers, research/v16.34-fiber-component-invariant]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/**', 'ResearchHistory/UQCF-GEM/AGENTS.md', '.github/workflows/uqcf-v1638-certification.yml', 'docs/superpowers/plans/2026-09-30-v1638-certification.md']
permissions: {contents: read}
concurrency:
  group: v1638-${{ github.ref }}
  cancel-in-progress: false
jobs:
  science:
    if: github.ref_name == 'research/v16.38-six-vertex-barriers'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Rejecting controls and historical RED preservation
        run: |
          set -euo pipefail
          mkdir -p out/v1638/logs
          D=ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers
          if python ResearchHistory/UQCF-GEM/demos/v16.37-certified-closure/test_historical_contract.py > out/v1638/logs/historical-red.log 2>&1; then exit 1; fi
          grep -q "AssertionError: ('HISTORICAL_LABEL_LOSS', (3, 2, 3), (3, 1, 3))" out/v1638/logs/historical-red.log
          python "$D/test_extension.py" 2>&1 | tee out/v1638/logs/tests.log
      - name: Complete prospective retained science and independent verification
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/run_campaign.py out/v1638/scientific 2>&1 | tee out/v1638/logs/science.log
      - name: Full inherited foundational stack
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/run_inherited.py 2>&1 | tee out/v1638/logs/inherited.log
      - name: Package exact source and evidence
        if: always()
        run: python ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/evidence.py package out/v1638
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1638-science-${{ github.sha }}
          path: out/v1638
          if-no-files-found: error
  publication:
    needs: science
    if: github.ref_name == 'research/v16.38-six-vertex-barriers'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Download scientific artifact and verify API digest
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/publication.py download "$GITHUB_RUN_ID" out/download
      - name: Fresh publication reproduction and all tests
        run: |
          set -euo pipefail
          D=ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers
          mkdir -p out/reproduction/logs
          python "$D/evidence.py" verify out/download/science
          python "$D/test_extension.py" 2>&1 | tee out/reproduction/logs/tests.log
          python "$D/run_campaign.py" out/reproduction/scientific 2>&1 | tee out/reproduction/logs/science.log
          python "$D/run_inherited.py" 2>&1 | tee out/reproduction/logs/inherited.log
          python "$D/publication.py" equal out/download/science/scientific out/reproduction/scientific
          PHASE=publication python "$D/evidence.py" package out/reproduction
      - name: Commit durable publication and verify remote head
        run: |
          set -euo pipefail
          D=ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers
          mkdir -p "$D/evidence"
          cp -a out/download/. "$D/evidence/"
          cp -a out/reproduction "$D/evidence/reproduction"
          python "$D/publication.py" finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$D"
          git commit -m 'publish v16.38 full verified science and fresh reproduction evidence'
          git push origin HEAD:research/v16.38-six-vertex-barriers
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/research/v16.38-six-vertex-barriers | cut -f1)"
          python "$D/publication.py" verify
          git rev-parse HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1638-publication-${{ github.sha }}
          path: |
            out/reproduction
            ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/MANIFEST.json
            ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers/REPORT.md
          if-no-files-found: error
  post_merge:
    if: github.ref_name == 'research/v16.34-fiber-component-invariant'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Verify actual merge, durable hashes, scientific replay and inherited stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          D=ResearchHistory/UQCF-GEM/demos/v16.38-six-vertex-barriers
          mkdir -p out/merge/logs
          python "$D/publication.py" verify 2>&1 | tee out/merge/logs/manifest.log
          python "$D/test_extension.py" 2>&1 | tee out/merge/logs/tests.log
          python "$D/run_campaign.py" out/merge/scientific 2>&1 | tee out/merge/logs/science.log
          python "$D/publication.py" equal "$D/evidence/science/scientific" out/merge/scientific
          python "$D/run_inherited.py" 2>&1 | tee out/merge/logs/inherited.log
          PHASE=post_merge python "$D/evidence.py" package out/merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1638-post-merge-${{ github.sha }}
          path: out/merge
          if-no-files-found: error
