name: Review order-independent receiver gain
on:
  push:
    branches: [gpt/uqcf-marked-branch-origin]
    paths:
      - ".github/workflows/uqcf-order-free-star-receiver.yml"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/receiver_event_order/order_free_star_receiver/**"
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/receiver_event_order/order_free_star_receiver
  HIST: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
  P: ResearchHistory/UQCF-GEM/foundational-closure-verification
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  foundational-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/
            /ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/
            /ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce inherited foundational tests and certificates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIST"
          mkdir -p foundation
          python -m pip install sympy==1.13.3 mpmath==1.3.0 numpy==1.26.4 > foundation/install.log
          git rev-parse HEAD > foundation/inherited-head.txt
          echo "$GITHUB_SHA" > foundation/workflow-head.txt
          python --version > foundation/python-version.txt
          (cd "$P" && python tests/test_fcv.py) 2>&1 | tee foundation/tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit) 2>&1 | tee foundation/parent-tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent && python -m unittest -v && python gate.py) 2>&1 | tee foundation/historical.log
          cp ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/result.json "$P/evidence/REPRODUCED_1615F.json"
          (cd "$P" && python produce_certificates.py) 2>&1 | tee foundation/producer.log
          (cd "$P" && python verify_certificates.py) 2>&1 | tee foundation/verifier.log
          cp "$P"/evidence/{PRODUCTION,VERIFICATION,TEST_RECEIPT,REPRODUCED_1615F}.json "$P/evidence/certificates.json.xz" foundation/
          test "$(xz -dc foundation/certificates.json.xz | sha256sum | cut -d' ' -f1)" = 21357bdc79429f9d4214024b125e75693609a2538a08a57037978b191ab432c6
          (cd foundation && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: order-free-star-foundation
          path: foundation
          if-no-files-found: error

  replay-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/receiver_event_order/order_free_star_receiver/
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/demos/v16.43-star-fiber-classification/*.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.43-star-fiber-classification/evidence/science/scientific/CERTIFICATE.json.gz
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
      - name: Install historical P1 dependencies
        run: python3 -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Check matched source cuts, first gains and original archived paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          mkdir evidence
          export PYTHONHASHSEED=8
          DEMO=review_sources/ResearchHistory/UQCF-GEM/demos
          test "$(git hash-object "$DEMO/v16.43-star-fiber-classification/evidence/science/scientific/CERTIFICATE.json.gz")" = b226fdef7d908f1f0186060ebf408eb0db823418
          python3 -B "$SCI/census.py" > evidence/census.json
          cmp "$SCI/census.json" evidence/census.json
          python3 -B "$SCI/extension.py" > evidence/extension.json
          cmp "$SCI/extension.json" evidence/extension.json
          python3 -B "$SCI/trace.py" "$DEMO" > evidence/trace.json
          cmp "$SCI/trace.json" evidence/trace.json
          python3 -B "$SCI/verify.py" "$DEMO" > evidence/verification.json
          cmp "$SCI/verification.json" evidence/verification.json
          python3 -B "$SCI/verify.py" "$DEMO" archive > evidence/archive.json
      - name: Request raw independent argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -B "$SCI/review.py" review evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: order-free-star-review
          path: evidence
          if-no-files-found: error
  publication-audit:
    needs: [replay-and-review, foundational-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/receiver_event_order/order_free_star_receiver/
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/demos/v16.43-star-fiber-classification/*.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.43-star-fiber-classification/evidence/science/scientific/CERTIFICATE.json.gz
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
      - name: Install historical P1 dependencies
        run: python3 -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: order-free-star-review
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: order-free-star-foundation
          path: foundation
      - name: Read back the review and reconstruct the exact computation
        run: |
          set -euo pipefail
          (cd foundation && sha256sum -c SHA256SUMS)
          python3 -B "$SCI/review.py" audit evidence >/dev/null
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          mkdir publication
          export PYTHONHASHSEED=71
          DEMO=review_sources/ResearchHistory/UQCF-GEM/demos
          test "$(git hash-object "$DEMO/v16.43-star-fiber-classification/evidence/science/scientific/CERTIFICATE.json.gz")" = b226fdef7d908f1f0186060ebf408eb0db823418
          python3 -B "$SCI/census.py" > publication/census.json
          cmp "$SCI/census.json" publication/census.json
          python3 -B "$SCI/extension.py" > publication/extension.json
          cmp "$SCI/extension.json" publication/extension.json
          python3 -B "$SCI/trace.py" "$DEMO" > publication/trace.json
          cmp "$SCI/trace.json" publication/trace.json
          python3 -B "$SCI/verify.py" "$DEMO" > publication/verification.json
          cmp "$SCI/verification.json" publication/verification.json
          python3 -B "$SCI/verify.py" "$DEMO" archive > publication/archive.json
          for f in census extension trace verification archive; do cmp "publication/$f.json" "evidence/$f.json"; done
          cp "$SCI"/{RESULT.md,SCOPE.md,LOCAL_SCOPE.md,GAIN_SCOPE.md,census.py,extension.py,trace.py,verify.py,review.py} publication/
          cp evidence/{review.txt,receipt.json,response.json,publication_audit.json} publication/
          cp foundation/SHA256SUMS publication/foundation-checksums.txt
          (cd publication && sha256sum *.json *.py *.md review.txt foundation-checksums.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: order-free-star-publication
          path: publication
          if-no-files-found: error
