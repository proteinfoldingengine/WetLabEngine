name: UQCF v15.45 task5 source firewall
on:
  push:
    branches:
      - research/v15.45-curvature-factorization-spectral-boundary
permissions:
  contents: read
jobs:
  task5:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Task 5 focused tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary
          python -m unittest -v test_source_firewall
          python -m compileall -q source_firewall.py test_source_firewall.py
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TASK5_VERIFIED_HEAD $GITHUB_SHA"
