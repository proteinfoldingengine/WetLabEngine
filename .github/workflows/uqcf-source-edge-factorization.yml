name: UQCF source-edge factorization
on:
  push:
    branches: [research/v15.56-source-edge-factorization]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/**'
      - '.github/workflows/uqcf-source-edge-factorization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-edge-factorization-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
defaults:
  run:
    shell: bash
jobs:
  factorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Record exact source head
        run: git rev-parse HEAD > ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/checkout_sha.txt
      - name: Preserve source snapshot before execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-edge-source-${{ github.sha }}
          path: ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/
          if-no-files-found: error
      - name: New fail-closed tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization
        run: python -m unittest -v test_gate 2>&1 | tee unittest.log
      - name: Existing complete demo regression suite
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
        run: python -m unittest discover -v 2>&1 | tee source-edge-factorization/regression.log
      - name: Measure all frozen source directions and verify saved artifacts
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization
        run: |
          python gate.py --output output | tee measurement.log
          python gate.py --verify output | tee verification.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-edge-evidence-${{ github.sha }}
          path: |
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/output/
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/*.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/checkout_sha.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-edge-factorization/PREREGISTRATION.md
          if-no-files-found: error
