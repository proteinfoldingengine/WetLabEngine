name: UQCF v16.25 pruning refinement closure
on:
  push:
    branches: [research/v16.25-pruning-refinement-closure]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Current tests and complete exact campaign
        run: |
          set -euo pipefail
          cd "$P"
          python test_gate.py 2>&1 | tee current-tests.log
          python engine.py 2>&1 | tee producer.log
          python verify.py 2>&1 | tee verifier.log
      - name: Inherited exact regressions
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          (cd ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure && python -m unittest discover -v)
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit)
      - name: Bind execution and source
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$P/evidence"
          printf '{"GITHUB_SHA":"%s","GITHUB_RUN_ID":"%s","GITHUB_RUN_ATTEMPT":"%s","python":"3.11"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$P/evidence/EXECUTION.json"
          sha256sum "$P/engine.py" "$P/verify.py" "$P/test_gate.py" "$P/PREREGISTRATION.md" "$P/TYPE_AND_PROOF.md" > "$P/evidence/SOURCE_SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1625-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/evidence
            ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/*.log
