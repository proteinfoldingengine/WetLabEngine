name: UQCF receiver_identification draft 1 freeze review (grokbot)

on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_review/RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_review/FREEZE.md'
      - '.github/scripts/uqcf_rid_*.py'
      - '.github/workflows/uqcf-gem-rid-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uqcf-rid-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: python -m pip install --no-cache-dir sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5
      - name: Producer (pure-Python exact Fractions, exhaustive universe)
        run: mkdir -p rid_verify && python .github/scripts/uqcf_rid_producer.py rid_verify/producer.json
      - name: Checker (independent numpy matrix/bitmask algorithm, bounded evidence, rejecting controls)
        run: python .github/scripts/uqcf_rid_checker.py rid_verify/checker.json
      - name: Fresh producer reproduction (deterministic bytes)
        run: python .github/scripts/uqcf_rid_producer.py rid_verify/producer_repro.json && cmp rid_verify/producer.json rid_verify/producer_repro.json
      - name: Comparator and tampering controls
        run: python .github/scripts/uqcf_rid_compare.py rid_verify/producer.json rid_verify/checker.json rid_verify/compare.json
      - name: Environment record
        if: always()
        run: |
          python -c "import sys,numpy,sympy,json;json.dump({'python':sys.version,'numpy':numpy.__version__,'sympy':sympy.__version__,'sha':'${{ github.sha }}','workflow_sha':'${{ github.workflow_sha }}'},open('rid_verify/env.json','w'))"
          sha256sum rid_verify/* > rid_verify/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid-verify-${{ github.run_attempt }}
          path: rid_verify
          if-no-files-found: error
          retention-days: 90

  argument-review:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid-verify-${{ github.run_attempt }}
          path: rid_verify
      - name: Fresh independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_rid_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid-review-${{ github.run_attempt }}
          path: rid_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    needs: [verify, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid-verify-${{ github.run_attempt }}
          path: rid_verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid-review-${{ github.run_attempt }}
          path: rid_review
      - name: Independent immutable GitHub readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/uqcf_rid_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid-publication-${{ github.run_attempt }}
          path: rid_publication
          if-no-files-found: error
          retention-days: 90
