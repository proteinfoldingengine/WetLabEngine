name: UQCF incidence-to-grade realization review
on:
  push:
    branches: [gpt/two-feature-receiver-signal]
    paths:
      - '.github/scripts/uqcf_incidence_grade_*.py'
      - '.github/workflows/uqcf-incidence-grade-review.yml'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-incidence-grade-review
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/incidence_grade_realization
      - name: Verify frozen proof, full source identities and exact excerpts
        run: python3 .github/scripts/uqcf_incidence_grade_review.py integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incidence-grade-integrity-${{ github.run_attempt }}
          path: incidence_grade_review
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/incidence_grade_realization
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: incidence-grade-integrity-${{ github.run_attempt }}
          path: incidence_grade_review
      - name: Independent full-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_incidence_grade_review.py review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incidence-grade-review-${{ github.run_attempt }}
          path: incidence_grade_review
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: [integrity, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: incidence-grade-review-${{ github.run_attempt }}
          path: incidence_grade_review
      - name: Separate immutable source and raw-response audit
        run: python3 .github/scripts/uqcf_incidence_grade_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incidence-grade-publication-${{ github.run_attempt }}
          path: incidence_grade_publication
          if-no-files-found: error
          retention-days: 90


