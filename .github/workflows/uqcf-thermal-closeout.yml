name: UQCF bounded thermal closeout
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  thermal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: '.github

          ResearchHistory/UQCF-GEM/foundational-closure-verification

          ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction

          ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence

          ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_joint_source_audit

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/record_access

          ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/thermal_bath_purity_test

          '
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - run: python -m pip install numpy==2.5.4 sympy==1.14.0 mpmath==1.3.0
    - run: python .github/scripts/uqcf_thermal_closeout.py verify thermal_initial
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: thermal-initial-${{ github.run_attempt }}
        path: thermal_initial
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
  inherited:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: '.github

          ResearchHistory/UQCF-GEM/foundational-closure-verification

          ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction

          ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence

          ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_joint_source_audit

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/record_access

          ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/thermal_bath_purity_test

          '
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
    - run: python .github/scripts/test_uqcf_owner_integration.py
    - run: python .github/scripts/uqcf_owner_integration.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: thermal-inherited-${{ github.run_attempt }}
        path: owner_integration_audit
        if-no-files-found: error
        retention-days: 90
  review:
    needs:
    - thermal
    - inherited
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: '.github

          ResearchHistory/UQCF-GEM/foundational-closure-verification

          ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction

          ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence

          ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_joint_source_audit

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/record_access

          ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/thermal_bath_purity_test

          '
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: thermal-initial-${{ github.run_attempt }}
        path: thermal_initial
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: thermal-inherited-${{ github.run_attempt }}
        path: inherited_initial
    - run: python .github/scripts/uqcf_thermal_closeout.py review thermal_review thermal_initial
        inherited_initial
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: thermal-review-${{ github.run_attempt }}
        path: thermal_review
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
  publication:
    needs:
    - thermal
    - inherited
    - review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: '.github

          ResearchHistory/UQCF-GEM/foundational-closure-verification

          ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction

          ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence

          ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope

          ResearchHistory/UQCF-GEM/research/physical-bridge/native_joint_source_audit

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/record_access

          ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution

          ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/thermal_bath_purity_test

          '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: thermal-initial-${{ github.run_attempt }}
        path: thermal_initial
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: thermal-inherited-${{ github.run_attempt }}
        path: inherited_initial
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: thermal-review-${{ github.run_attempt }}
        path: thermal_review
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
    - run: python .github/scripts/test_uqcf_owner_integration.py
    - run: python .github/scripts/uqcf_owner_integration.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - run: python -m pip install numpy==2.5.4 sympy==1.14.0 mpmath==1.3.0
    - run: python .github/scripts/uqcf_thermal_closeout.py publish thermal_publication
        thermal_initial inherited_initial thermal_review
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: thermal-publication-${{ github.run_attempt }}
        path: thermal_publication
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: thermal-publication-inherited-${{ github.run_attempt }}
        path: owner_integration_audit
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - gpt/thermal-bath-closeout
    paths:
    - .github/scripts/uqcf_thermal_closeout.py
    - .github/workflows/uqcf-thermal-closeout.yml
    - ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/thermal_bath_purity_test/closeout/FREEZE.json
