name: UQCF v16.23 durable publication and fresh verification
on:
  push:
    branches: [research/v16.23-overlap-descent]
    paths: ['.github/workflows/uqcf-v1623-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uqcf-v1623-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Verify all original archives and freshly reproduce full evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$P/publish.py"
      - name: Publish only verified research evidence and check remote commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json" "$P/RUN_REGISTRY.json" "$P/PUBLICATION_SHA256SUMS"
          git diff --cached --check -- "$P/PUBLICATION_EVIDENCE.json" "$P/RUN_REGISTRY.json" "$P/PUBLICATION_SHA256SUMS"
          git commit -m 'v16.23 publish complete verified evidence [skip ci]'
          published=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/research/v16.23-overlap-descent | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/v16.23-overlap-descent
          remote=$(git ls-remote origin refs/heads/research/v16.23-overlap-descent | cut -f1)
          test "$remote" = "$published"
          python "$P/publish.py" --verify
          git diff --exit-code HEAD -- "$P" ResearchHistory/UQCF-GEM/V16_23_REPORT.md
          PUBLISHED_SHA="$published" python - <<'PY'
          import json,os,pathlib
          r={'version':'16.23','published_commit':os.environ['PUBLISHED_SHA'],'publication_run':os.environ['GITHUB_RUN_ID'],'remote_ref_verified':True,'committed_file_hashes_verified':True,'no_main_merge':True}
          pathlib.Path('v1623-publication-receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1623-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            v1623-publication-receipt.json
            ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/evidence
            ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PUBLICATION_EVIDENCE.json
            ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/RUN_REGISTRY.json
            ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PUBLICATION_SHA256SUMS
