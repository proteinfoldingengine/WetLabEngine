name: Gen3 HB2 TPO audit

on:
  push:
    branches: [gen3-historical-backbone-reconstruction-v1]
    paths:
      - '.github/workflows/gen3-hb2-tpo-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install --quiet numpy pandas scipy
      - name: Fetch frozen historical dataset
        run: |
          git clone --quiet https://github.com/proteinfoldingengine/UQCF-GEM.git /tmp/UQCF-GEM
          git -C /tmp/UQCF-GEM checkout --quiet f37669d0695554d051c4754c837b4ba1a8161276
      - name: Run preregistered predictive audit
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from scipy.stats import spearmanr
          from pathlib import Path

          p=Path('/tmp/UQCF-GEM/deep_scan_results/1QYS/deep_scan_results_1QYS_v3_ranked.csv')
          df=pd.read_csv(p)
          cols=['initial_Rg','initial_Betti1','final_RMSD','torsion_entropy','torsion_rms_dist']
          d=df[cols].replace([np.inf,-np.inf],np.nan).dropna().copy()

          def sp(x,y):
              r,pv=spearmanr(d[x],d[y])
              return {'rho':float(r),'p':float(pv)}

          X=np.column_stack([np.ones(len(d)),d['initial_Rg'].to_numpy(),d['initial_Betti1'].to_numpy()])
          y=d['final_RMSD'].to_numpy()
          beta=np.linalg.lstsq(X,y,rcond=None)[0]
          yres=y-X@beta
          partial={}
          for m in ['torsion_entropy','torsion_rms_dist']:
              z=d[m].to_numpy()
              bz=np.linalg.lstsq(X,z,rcond=None)[0]
              zres=z-X@bz
              r,pv=spearmanr(zres,yres)
              partial[m]={'rho':float(r),'p':float(pv)}

          quart={}
          for m in ['torsion_entropy','torsion_rms_dist']:
              q1=d[m].quantile(.25); q3=d[m].quantile(.75)
              low=d.loc[d[m]<=q1,'final_RMSD']; high=d.loc[d[m]>=q3,'final_RMSD']
              quart[m]={'q1':float(q1),'q3':float(q3),'low_n':int(len(low)),'high_n':int(len(high)),
                        'low_mean_final_RMSD':float(low.mean()),'high_mean_final_RMSD':float(high.mean()),
                        'low_median_final_RMSD':float(low.median()),'high_median_final_RMSD':float(high.median())}

          out={'dataset_rows':int(len(df)),'finite_rows':int(len(d)),
               'spearman':{m:sp(m,'final_RMSD') for m in ['torsion_entropy','torsion_rms_dist','initial_Rg','initial_Betti1']},
               'adjusted_residual_spearman':partial,'quartiles':quart}
          Path('hb2_tpo_audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hb2-tpo-audit
          path: hb2_tpo_audit.json
