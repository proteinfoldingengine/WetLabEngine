name: Saved Atrium AUC independent audit
on:
  push:
    branches: [gpt/saved-auc-audit-20261114]
    paths:
      - '.github/workflows/uqcf-saved-auc-review.yml'
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.sha }}
concurrency:
  group: uqcf-saved-auc-review
  cancel-in-progress: false
jobs:
  verification:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/saved_auc_audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Review transport rejecting controls
        run: |
          mkdir -p verified
          python .github/scripts/uqcf_saved_auc_tests.py > verified/plumbing.log 2>&1
          cat verified/plumbing.log
      - name: Immutable saved-data verification only
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_saved_auc_review.py verification verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-auc-verification-1
          path: verified
          if-no-files-found: error
          retention-days: 90
  review:
    if: github.run_attempt == 1
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/saved_auc_audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: saved-auc-verification-1
          path: verified
      - name: One independent adversarial whole-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_saved_auc_review.py review reviewed verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-auc-review-1
          path: reviewed
          if-no-files-found: error
          retention-days: 90
  publication:
    if: always() && (needs.review.result == 'success' || github.run_attempt > 1)
    needs: [verification, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/saved_auc_audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: saved-auc-verification-1
          path: verified
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: saved-auc-review-1
          path: reviewed
      - name: Fresh fixed-data reproduction and separate immutable raw-evidence audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_saved_auc_review.py publication published verified reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-auc-publication-${{ github.run_attempt }}
          path: published
          if-no-files-found: error
          retention-days: 90
