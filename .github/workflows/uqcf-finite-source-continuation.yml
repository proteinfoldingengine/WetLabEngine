name: UQCF v16.03 finite source continuation
on:
  push:
    branches: [research/v16.03-finite-source-continuation]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation/**'
      - '.github/workflows/uqcf-finite-source-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uqcf-v1603-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - name: Regression controls
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          git rev-parse HEAD > execution_head.txt
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation
          python -m unittest -v test_gate 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-controls-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation/test.log
  measure:
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate: [13,16,22,25,27,29,37,39,46,50,66,77]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - name: Frozen candidate measurement
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          git rev-parse HEAD > execution_head.txt
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation
          python gate.py --candidate ${{ matrix.candidate }} 2>&1 | tee measurement-${{ matrix.candidate }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-${{ matrix.candidate }}-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation/result-*.json.gz
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation/measurement-*.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/finite-source-continuation/SHA256SUMS-*
