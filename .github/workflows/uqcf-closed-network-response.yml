name: UQCF v16.14 closed-network response
on:
  push:
    branches: [research/v16.14-closed-network-response]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/closed-network-response/**'
      - '.github/workflows/uqcf-closed-network-response.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - name: Controls and audit
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          git rev-parse HEAD > execution_head.txt
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/closed-network-response
          python -m unittest -v 2>&1 | tee test.log
          (cd ../local-gauge-content && python -m unittest -v) 2>&1 | tee parent-test.log
          python gate.py 2>&1 | tee audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-network-response-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/closed-network-response/*.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/closed-network-response/result.json
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/closed-network-response/SHA256SUMS
