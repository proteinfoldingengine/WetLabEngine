name: UQCF v15.11 Ontology Continuity

on:
  push:
    branches:
      - main
      - research/v15.11-ontology-continuity-reconciliation
    paths:
      - 'ResearchHistory/UQCF-GEM/v15/v15.11/**'
      - 'ResearchHistory/UQCF-GEM/v15/v15.10/**'
      - 'ResearchHistory/UQCF-GEM/STATUS.md'
      - '.github/workflows/uqcf-v1511-ontology-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Record exact checked head
        run: git rev-parse HEAD
      - name: Run twenty reconstructed ontology controls
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.11
        run: python -m unittest -v test_continuity.py
      - name: Verify frozen summary and committed source excerpts
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.11
        run: python ontology_continuity_audit.py --check
      - name: Confirm original v15.10 module is unchanged
        run: |
          test "$(git hash-object ResearchHistory/UQCF-GEM/v15/v15.10/pruning_order_emergent_time_audit.py)" = '0a738db9089379d862fe4c3ebbe17b9c1732993a'
      - name: Rerun preserved v15.10 checker without broadening its scope
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.10
        run: python CHECKER.py
      - name: Compile v15.11 source and tests
        run: python -m compileall -q ResearchHistory/UQCF-GEM/v15/v15.11
