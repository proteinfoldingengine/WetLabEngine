name: Verify V1718 at the retained-P1 interface
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-v1718-p1-interface.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1718_p1_interface.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1718_complete.py
      - name: Replay exact cyclic interface
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_v1718_p1_interface.py" > handoff/replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1718-p1-interface-replay
          path: handoff/replay.json
          if-no-files-found: error

  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_P1_INTERFACE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1718_p1_interface.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_v1718_p1_interface.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH_REVIEW.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_LOOP_REVERSIBILITY.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_LOOP_REVERSIBILITY_RESULT.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1718_complete.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1718-p1-interface-replay
          path: handoff
      - name: Independently review the complete corollary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_v1718_p1_interface.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1718-p1-interface-review
          path: review_evidence
          if-no-files-found: error

  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_P1_INTERFACE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1718_p1_interface.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_v1718_p1_interface.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH_REVIEW.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_LOOP_REVERSIBILITY.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1718_LOOP_REVERSIBILITY_RESULT.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1718_complete.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1718-p1-interface-replay
          path: earlier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1718-p1-interface-review
          path: review_evidence
      - name: Reproduce bytes and audit the raw review
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_v1718_p1_interface.py" > handoff/replay.json
          cmp handoff/replay.json earlier/replay.json
          python3 "$SCI/review_v1718_p1_interface.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1718-p1-interface-publication
          path: |
            handoff/replay.json
            review_evidence/publication_audit.json
          if-no-files-found: error
