name: UQCF v15.47 functoriality
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.47-cross-domain-representation-functoriality/**'
      - '.github/workflows/uqcf-v1547-functoriality.yml'
permissions:
  contents: read
jobs:
  functoriality:
    runs-on: ubuntu-24.04
    env: {PYTHONHASHSEED: '0'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Complete v15.47 and inherited v15.46 suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import sys,unittest
          a=Path('ResearchHistory/UQCF-GEM/demos/v15.47-cross-domain-representation-functoriality').resolve()
          b=Path('ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility').resolve()
          sys.path[:0]=[str(a),str(b),str(b/'exploratory')]
          names=['test_functor_contract','test_functor_candidates','test_functor_classes','test_verify_functoriality','test_gate']
          suite=unittest.defaultTestLoader.loadTestsFromNames(names); n=suite.countTestCases()
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          if r.testsRun!=n or not r.wasSuccessful() or r.skipped or r.expectedFailures or r.unexpectedSuccesses: raise SystemExit('v1547_test_failure')
          print('V1547_TEST_COUNT',r.testsRun)
          PY
          cd ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          PYTHONPATH="$PWD/exploratory:$PYTHONPATH" python -m unittest -q test_evidence_preflight test_native_record_trace test_native_record_search test_stage_c_contract test_stage_c_representations test_stage_c_nonuniqueness test_stage_c_verify test_stage_c_gate test_typing_probe
      - name: Replay v15.47 result
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.47-cross-domain-representation-functoriality').resolve()
          sys.path.insert(0,str(d))
          import functor_contract as fc,functor_candidates as ca,functor_classes as cl,verify_functoriality as vf,gate
          root=d.parents[3]; c=fc.load_contract(root); cs=ca.enumerate_candidates(c); classes=cl.surviving_classes(c,cs); v=vf.verify(c,cs,classes); r=gate.adjudicate(c,classes,v)
          assert gate.canonical_bytes(r)==(d/'docs/RESULTS.json').read_bytes()
          print('V1547_RESULT_REPLAY_PASS')
          PY
          python -m compileall -q ResearchHistory/UQCF-GEM/demos/v15.47-cross-domain-representation-functoriality
      - name: Exact-head preservation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.44-intrinsic-curvature-interpretation)" = d37f88b98d38aad864e22146ad7dcd2d00f89cd4
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary)" = 775e5549303c1276d3458ec34b553a604436bf0f
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "V1547_VERIFIED_HEAD $GITHUB_SHA"
