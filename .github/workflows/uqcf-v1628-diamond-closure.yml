name: UQCF v16.28 diamond attribution closure
on:
  push:
    branches: [research/v16.28-diamond-attribution-closure]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/**'
      - '.github/workflows/uqcf-v1628-diamond-closure.yml'
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Complete exact equivalence, witnesses, rejecting controls and inherited regressions
        run: python "$P/run_campaign.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1628-${{ github.sha }}
          if-no-files-found: error
          path: ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/evidence
