name: Verify retained writer context across identical pruning events
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-native-writer-phase.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_native_writer_phase.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/evidence/science-artifact.chunks/ARCHIVE.json
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/cover.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/ARCHIVE.json
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/feasibility.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/verifier.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00000.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00001.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00002.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00003.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00004.part
      - name: Replay both historical campaigns and reconstruct the matched events
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          mkdir -p handoff
          python3 "$SCI/check_native_writer_phase.py" handoff > handoff/replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-writer-phase-replay
          path: handoff
          if-no-files-found: error


  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/NATIVE_WRITER_PHASE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/NATIVE_WRITER_PHASE_CHECK_PLAN.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_native_writer_phase.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_native_writer_phase.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-writer-phase-replay
          path: handoff
      - name: Request worked checks for each mathematical claim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_native_writer_phase.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-writer-phase-review
          path: review_evidence
          if-no-files-found: error


  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_native_writer_phase.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/evidence/science-artifact.chunks/ARCHIVE.json
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/cover.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/ARCHIVE.json
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/feasibility.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/verifier.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00000.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00001.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00002.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00003.part
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/evidence/science-artifact.chunks/00004.part
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/NATIVE_WRITER_PHASE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/NATIVE_WRITER_PHASE_CHECK_PLAN.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_native_writer_phase.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-writer-phase-replay
          path: earlier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-writer-phase-review
          path: review_evidence
      - name: Verify the exact replay bytes and read back the independent review
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          mkdir -p handoff
          python3 "$SCI/check_native_writer_phase.py" handoff > handoff/replay.json
          diff -r earlier handoff
          python3 "$SCI/review_native_writer_phase.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-writer-phase-publication
          path: |
            handoff/replay.json
            review_evidence/publication_audit.json
          if-no-files-found: error
