name: UQCF v16.24 durable publication and fresh verification
on:
  push:
    branches: [research/v16.24-consistency-order]
    paths: ['.github/workflows/uqcf-v1624-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uqcf-v1624-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Preserve original evidence and reproduce complete scientific bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$P/evidence"
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import subprocess,json,hashlib,zipfile,io,lzma,os,re
          p=Path(os.environ['P']).resolve();repo=Path.cwd();e=p/'evidence'
          runs=[
            dict(role='wiring-red',run=36583580004,sha='1335532db55062af83fbe2bfd875c18eecb7d490',artifact=11040492589,bytes=13771,digest='0dd183b6cba84cfbdd6f78de037f82df749db77788c7dc8108c600bd163ed78b',conclusion='failure'),
            dict(role='initial-green',run=36584333728,sha='f838bd86596db5884a9d3b33f245b127c55f56c8',artifact=11040383829,bytes=111322,digest='e46b9fb761e058cbfe7fe7d88b4499c2bb55b157e1db26d4dccde44b51f05081',conclusion='success'),
            dict(role='validation-red',run=36584604280,sha='3e50f0fb4930502214bc43ed91ee1fc96596a7aa',artifact=11040853393,bytes=22121,digest='0ee1d66982c09e6769954bdde898a102660e113490ef611c2cafc155080e3d6c',conclusion='failure'),
            dict(role='final-green',run=36585110111,sha='19c7069bad79ff361d612f742ad5e79dbfef1dc6',artifact=11041500838,bytes=113076,digest='a878d78b351b27547ba67c23db6f824fab8691bc38cbe6cb5f2ee873a79e2211',conclusion='success')]
          def need(ok,msg):
            if not ok:raise ValueError(msg)
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def api(endpoint,logs=False):
            need(endpoint.startswith('actions/'),'invalid publication endpoint')
            args=['gh','api']+(['--allow-escape-sequences'] if logs else [])+['repos/proteinfoldingengine/WetLabEngine/'+endpoint]
            return subprocess.check_output(args)
          def unzip(raw):
            z=zipfile.ZipFile(io.BytesIO(raw));names=z.namelist()
            need(len(names)==len(set(names)) and z.testzip() is None,'ZIP integrity')
            need(all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts for n in names),'unsafe archive path')
            return {n:z.read(n) for n in names if not n.endswith('/')}
          (e/'archives').mkdir(exist_ok=True);(e/'history').mkdir(exist_ok=True)
          originals={}
          for run in runs:
            raw=api('actions/artifacts/'+str(run['artifact'])+'/zip')
            need(len(raw)==run['bytes'] and sha(raw)==run['digest'],'original archive hash/size')
            (e/'archives'/(run['role']+'.zip')).write_bytes(raw)
            data=unzip(raw);need('EXECUTION.json' in data and 'SHA256SUMS' in data,'incomplete original archive')
            execution=json.loads(data['EXECUTION.json'])
            need(execution['GITHUB_SHA']==run['sha'] and execution['GITHUB_RUN_ID']==str(run['run']) and execution['GITHUB_RUN_ATTEMPT']=='1','original execution binding')
            for line in data['SHA256SUMS'].decode().splitlines():
              digest,name=line.split(maxsplit=1);need(name in data and sha(data[name])==digest,'original member hash: '+name)
            originals[run['role']]=data
            runraw=api('actions/runs/'+str(run['run']));jobraw=api('actions/runs/'+str(run['run'])+'/jobs')
            meta=json.loads(runraw);jobs=json.loads(jobraw)['jobs']
            need(meta['head_sha']==run['sha'] and meta['run_attempt']==1 and meta['conclusion']==run['conclusion'],'original run state')
            need(len(jobs)==1 and jobs[0]['conclusion']==run['conclusion'],'original job state')
            run['job']=jobs[0]['id'];run['attempt']=1
            for suffix,blob in [('run.json',runraw),('jobs.json',jobraw),('job.log',api('actions/jobs/'+str(run['job'])+'/logs',logs=True))]:
              (e/'history'/(run['role']+'-'+suffix)).write_bytes(blob)
          final=originals['final-green'];initial=originals['initial-green']
          scientific=['certificates.json.xz','VERIFICATION.json','TEST_RECEIPT.json','PRODUCTION.json']
          for name in scientific:need(final[name]==initial[name],'scientific data changed with input-validation repair: '+name)
          rawcert=lzma.decompress(final['certificates.json.xz'])
          need(len(rawcert)==6426004 and sha(rawcert)=='d5354333bab67ee84bcd8e1a108d93ff6767d6f37e0fa8842af139a0cf60ee6b','complete raw certificate')
          need(sha(final['VERIFICATION.json'])=='379e0d777867d07f78f271c254e9418e5d88550ec33cef4555eac53147e5bcad','original verification binding')
          source=unzip(final['source.zip'])
          for name,blob in source.items():
            need((repo/name).is_file() and (repo/name).read_bytes()==blob,'scientific source changed since final GREEN: '+name)
          for name,blob in final.items():
            need('/' not in name,'unexpected nonflat scientific archive')
            target='ORIGINAL_SHA256SUMS' if name=='SHA256SUMS' else name
            (e/target).write_bytes(blob)
          need(all(line.split('\t')[1]=='0' for line in final['exit_codes.tsv'].decode().splitlines()),'original scientific command failed')
          commands=[
            ('tests',p,['python','test_gate.py'],28),('validation',p,['python','test_validation.py'],2),
            ('v1623',p.parent/'v16.23-overlap-descent',['python','test_gate.py'],22),
            ('v1623-schema',p.parent/'v16.23-overlap-descent',['python','test_schema.py'],3),
            ('v1622',p.parent/'v16.22-response-selection-closure',['python','-m','unittest','discover','-v'],20),
            ('v1621',p.parents[1]/'foundational-closure-verification',['python','tests/test_fcv.py'],22),
            ('exact-parent',p.parent/'v15.56-response-selector-obstruction',['python','-m','unittest','-v','test_pruning_consistency_audit'],15),
            ('producer',p,['python','engine.py'],None),('verifier',p,['python','verify.py'],None)]
          fresh=[]
          for name,cwd,args,count in commands:
            log=e/('publication-'+name+'.log')
            with log.open('wb') as stream:result=subprocess.run(args,cwd=cwd,stdout=stream,stderr=subprocess.STDOUT)
            record={'name':name,'command':args,'cwd':str(cwd.relative_to(repo)),'exit_code':result.returncode}
            if count is not None:
              seen=[int(n) for n in re.findall(r'Ran (\d+) tests?',log.read_text())]
              record['tests']=seen;need(seen==[count],'wrong fresh test coverage: '+name)
            fresh.append(record)
            (e/'PUBLICATION_COMMANDS.json').write_text(json.dumps(fresh,indent=2)+'\n')
            need(result.returncode==0,'fresh execution failed: '+name)
          for name in scientific:need((e/name).read_bytes()==final[name],'fresh scientific bytes differ: '+name)
          verification=json.loads(final['VERIFICATION.json']);hist={}
          for key,entry in verification['by_instance'].items():
            if key.endswith('|original'):
              for order,count in entry['order_histogram'].items():hist[order]=hist.get(order,0)+count
          evidence={'version':'16.24','scientific_execution_sha':runs[-1]['sha'],'scientific_run':runs[-1]['run'],
            'scientific_job':runs[-1]['job'],'scientific_attempt':1,'original_runs':runs,
            'publication_workflow_head':os.environ['GITHUB_SHA'],'publication_run':os.environ['GITHUB_RUN_ID'],
            'publication_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'fresh_commands':fresh,'fresh_scientific_bytes_equal':True,
            'initial_and_final_scientific_bytes_equal':True,'source_snapshot_matched':True,
            'test_counts':{'new':30,'inherited':82,'total':112},'coverage':{k:v for k,v in verification.items() if k!='by_instance'},
            'cover_order_histogram':hist,'raw_certificate_bytes':len(rawcert),'raw_certificate_sha256':sha(rawcert),
            'xz_certificate_sha256':sha(final['certificates.json.xz']),'verification_sha256':sha(final['VERIFICATION.json']),
            'review':'self-reviewed; algorithmically independent verifier; no separate reviewer',
            'scope':'formal nonnegative rational retained sources; research/v16.24-consistency-order; no main merge'}
          (p/'RUN_REGISTRY.json').write_text(json.dumps(runs,indent=2)+'\n')
          (p/'PUBLICATION_EVIDENCE.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          files=sorted(x for x in p.rglob('*') if x.is_file() and '__pycache__' not in x.parts and x.name!='PUBLICATION_SHA256SUMS')
          extra=[p.parents[1]/'V16_24_REPORT.md',repo/'.github/workflows/uqcf-v1624-consistency-order.yml',repo/'.github/workflows/uqcf-v1624-publication.yml']
          (p/'PUBLICATION_SHA256SUMS').write_text(''.join(sha(x.read_bytes())+'  '+os.path.relpath(x,p)+'\n' for x in files+extra))
          print(json.dumps({k:v for k,v in evidence.items() if k not in ('fresh_commands','original_runs')},sort_keys=True))
          PY
      - name: Commit only verified research evidence and confirm published ref
        run: |
          set -euo pipefail
          (cd "$P" && sha256sum -c PUBLICATION_SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS" "$P/RUN_REGISTRY.json"
          git diff --cached --check -- "$P/PUBLICATION_EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS" "$P/RUN_REGISTRY.json"
          python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(n.startswith(os.environ['P']+'/') for n in names), names
          PY
          remote=$(git ls-remote origin refs/heads/research/v16.24-consistency-order | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git commit -m 'v16.24 publish complete independently verified evidence [skip ci]'
          published=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/research/v16.24-consistency-order
          remote=$(git ls-remote origin refs/heads/research/v16.24-consistency-order | cut -f1)
          test "$remote" = "$published"
          git diff HEAD --exit-code -- "$P" ResearchHistory/UQCF-GEM/V16_24_REPORT.md
          (cd "$P" && sha256sum -c PUBLICATION_SHA256SUMS)
          PUBLISHED_SHA="$published" python - <<'PY'
          import json,os,pathlib
          r={'published_commit':os.environ['PUBLISHED_SHA'],'publication_workflow_head':os.environ['GITHUB_SHA'],
             'publication_run':os.environ['GITHUB_RUN_ID'],'remote_ref_verified':True,'committed_hashes_verified':True,
             'scope':'research/v16.24-consistency-order; not main'}
          pathlib.Path('v1624-publication-receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1624-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            v1624-publication-receipt.json
            ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/evidence
            ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/PUBLICATION_EVIDENCE.json
            ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/RUN_REGISTRY.json
            ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/PUBLICATION_SHA256SUMS
