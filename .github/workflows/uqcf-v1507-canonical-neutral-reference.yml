name: UQCF v15.07 Canonical Neutral Reference

on:
  push:
    branches:
      - research/v15.07-canonical-neutral-reference
    paths:
      - 'ResearchHistory/UQCF-GEM/v15/v15.07/**'
      - 'ResearchHistory/UQCF-GEM/v15/v15.06/**'
      - 'ResearchHistory/UQCF-GEM/v15/v15.05/**'
      - 'ResearchHistory/UQCF-GEM/v15/v15.04/**'
      - 'ResearchHistory/UQCF-GEM/v13/v13.11/**'
      - 'ResearchHistory/UQCF-GEM/v13/v13.02/**'
      - '.github/workflows/uqcf-v1507-canonical-neutral-reference.yml'
      - 'ResearchHistory/UQCF-GEM/STATUS.md'
      - 'ResearchHistory/UQCF-GEM/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.07
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Run v15.07 checker
        run: python CHECKER.py
