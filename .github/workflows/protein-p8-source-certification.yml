name: Protein P8 Patch622-624 Source Certification

on:
  push:
    branches:
      - research/protein-p8-patch622-624-reopen
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P8/recovered_patch622/**'
      - 'ResearchHistory/UQCF-GEM/protein/P8/recovered_patch624/**'
      - 'ResearchHistory/UQCF-GEM/protein/P8/P8_RECOVERED_SOURCE_MANIFEST.json'
      - 'ResearchHistory/UQCF-GEM/protein/P8/P8A_SOURCE_CERTIFICATION_CONTRACT.md'
      - 'ResearchHistory/UQCF-GEM/protein/P8/p8_source_certification.py'
      - 'ResearchHistory/UQCF-GEM/protein/P8/test_p8_source_certification.py'
      - '.github/workflows/protein-p8-source-certification.yml'
  pull_request:
    branches:
      - research/protein-p7-early-backbone-controller-survival
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P8/recovered_patch622/**'
      - 'ResearchHistory/UQCF-GEM/protein/P8/recovered_patch624/**'
      - 'ResearchHistory/UQCF-GEM/protein/P8/P8_RECOVERED_SOURCE_MANIFEST.json'
      - 'ResearchHistory/UQCF-GEM/protein/P8/P8A_SOURCE_CERTIFICATION_CONTRACT.md'
      - 'ResearchHistory/UQCF-GEM/protein/P8/p8_source_certification.py'
      - 'ResearchHistory/UQCF-GEM/protein/P8/test_p8_source_certification.py'
      - '.github/workflows/protein-p8-source-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/protein/P8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded source-audit dependencies
        run: |
          python -m pip install --quiet numpy==1.26.4 pyyaml==6.0.2
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile recovered source
        run: python -m py_compile recovered_patch622/*.py recovered_patch624/*.py p8_source_certification.py test_p8_source_certification.py
      - name: Run source-certification tests
        run: python -m unittest -v test_p8_source_certification.py
      - name: Generate authoritative source result
        run: python p8_source_certification.py > P8_SOURCE_CERTIFICATION_RESULT.json
      - name: Verify frozen verdict
        run: |
          python - <<'PY'
          import json
          d=json.load(open('P8_SOURCE_CERTIFICATION_RESULT.json'))
          assert all(d['conditions'].values())
          assert d['verdict']=='REOPEN_RULE_SATISFIED_DISTINCT_HISTORICAL_MECHANISM_SOURCE_LEVEL'
          assert d['p622']['phase_step0']=='Compaction'
          assert d['p622']['phase_step98']=='Compaction'
          assert d['p622']['phase_step99']=='LockIn'
          assert d['p622']['transition_steps']==[99]
          assert d['p622']['lockin_minus_compaction']==['contact_springs','screened_electrostatics']
          assert d['p624']['lockin_minus_compaction']==['contact_springs','screened_electrostatics','torsional_incoherence_penalty']
          assert d['raw_historical_execution_log_recovered'] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: protein-p8-source-certification
          path: |
            ResearchHistory/UQCF-GEM/protein/P8/P8_SOURCE_CERTIFICATION_RESULT.json
            ResearchHistory/UQCF-GEM/protein/P8/P8_RECOVERED_SOURCE_MANIFEST.json
            ResearchHistory/UQCF-GEM/protein/P8/P8A_SOURCE_CERTIFICATION_CONTRACT.md
          retention-days: 90
