name: UQCF PR129 merge audit durable publication
on:
  push:
    branches: [research/uqcf-pr129-merge-audit]
    paths:
      - '.github/scripts/uqcf_pr129_merge_archive.py'
      - '.github/workflows/uqcf-pr129-merge-archive.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: uqcf-pr129-merge-archive
  cancel-in-progress: false
jobs:
  archive-and-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify and retain original artifacts and job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_pr129_merge_archive.py
      - name: Publish additive evidence to the isolated audit branch and read it back
        run: |
          set -euo pipefail
          BRANCH=research/uqcf-pr129-merge-audit
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/run-41367189521
          git commit -m 'research: archive exact PR129 merge audit and original run evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/run-41367189521')
          manifest=json.loads((p/'ARCHIVE_MANIFEST.json').read_text())
          for rel, record in manifest.items():
              raw=subprocess.check_output(['git','show','FETCH_HEAD:'+str(p/rel)])
              assert len(raw)==record['bytes'] and hashlib.sha256(raw).hexdigest()==record['sha256'],rel
          result={'status':'PASS','published_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'files_read_back':len(manifest),'science_sha':'084617b4c392b8955f0a19d2c2b2c02dfa8d9d91',
                  'native_bridge_status':'NOT_DERIVED'}
          pathlib.Path('publication-readback.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr129-merge-durable-publication-${{ github.run_attempt }}
          path: |
            publication-readback.json
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/run-41367189521/DOWNLOAD_AUDIT.json
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/run-41367189521/ARCHIVE_MANIFEST.json
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/run-41367189521/archive-failure.json
          if-no-files-found: error
          retention-days: 90
