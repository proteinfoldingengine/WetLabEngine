name: UQCF-GEM source-escape gate
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/source_escape/producer.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/source_escape/independent.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/source_escape/test_escape.py'
      - '.github/scripts/c3_source_escape_review.py'
      - '.github/workflows/uqcf-gem-c3-source-escape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Exact source-escape gate verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          mkdir source_escape_verification
          python3 -m unittest discover -s "$ROOT/source_escape" -p test_escape.py -v 2>&1 | tee source_escape_verification/contracts.log
          python3 "$ROOT/source_escape/producer.py" source_escape_verification/certificate.json | tee source_escape_verification/counts.json
          python3 "$ROOT/source_escape/independent.py" source_escape_verification/certificate.json source_escape_verification/independent.json | tee source_escape_verification/independent.log
          for SPEC in 'cover_static test_cover_static.py' 'nonuniform_reserve test_nonuniform.py' 'weak_trace test_weak.py' 'fingerprint_lock test_fingerprint.py' 'private_cover test_private.py' 'moving_cover test_moving.py' 'saturated_handover test_saturated.py' 'slack_handover test_slack.py' 'handover_graph test_handover.py' 'anchored_release test_anchored.py' 'local_progress test_progress.py' 'capacity_gap test_capacity.py' 'saturated_transfer test_transfer.py' 'label_release test_release.py' 'footprint test_footprint.py' 'fixed_family test_fixed_family.py'; do
            read -r DIR PATTERN <<< "$SPEC"
            python3 -m unittest discover -s "$ROOT/$DIR" -p "$PATTERN" -v 2>&1 | tee "source_escape_verification/inherited_$DIR.log"
          done
          printf 'scientific_sha=%s\nworkflow_sha=%s\n' "$GITHUB_SHA" "$GITHUB_SHA" > source_escape_verification/provenance.txt
          cp "$ROOT/COUPLED_C3_SOURCE_ESCAPE_RESULT.md" source_escape_verification/frozen_proof_scope.md
          sha256sum source_escape_verification/certificate.json.identities.jsonl.gz > source_escape_verification/identities.sha256
          cp "$ROOT/source_escape/producer.py" "$ROOT/source_escape/independent.py" "$ROOT/source_escape/test_escape.py" "$ROOT/source_escape/red.log" source_escape_verification/
          sha256sum source_escape_verification/certificate.json > source_escape_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-verification
          path: source_escape_verification/
  fresh-reproduction:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@v4
        with:
          name: c3-source-escape-verification
          path: source_escape_fresh
      - name: Fresh complete producer and independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/source_escape/producer.py" /tmp/fresh.json
          cmp /tmp/fresh.json source_escape_fresh/certificate.json
          cmp /tmp/fresh.json.identities.jsonl.gz source_escape_fresh/certificate.json.identities.jsonl.gz
          python3 "$ROOT/source_escape/independent.py" /tmp/fresh.json source_escape_fresh/fresh_independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-fresh-reproduction
          path: source_escape_fresh/
  mathematical-review:
    needs: fresh-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-source-escape-fresh-reproduction
          path: source_escape_verification
      - name: Adversarial Gemini mathematical review of exact event commit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_source_escape_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-mathematical-review
          path: source_escape_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-source-escape-fresh-reproduction
          path: source_escape_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-source-escape-mathematical-review
          path: source_escape_review
      - name: Exact provenance and fresh independent publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/source_escape/producer.py" /tmp/publication.json
          cmp /tmp/publication.json source_escape_verification/certificate.json
          cmp /tmp/publication.json.identities.jsonl.gz source_escape_verification/certificate.json.identities.jsonl.gz
          python3 "$ROOT/source_escape/independent.py" /tmp/publication.json /tmp/publication_independent.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path('source_escape_review/manifest.json').read_text())
          assert manifest['research_commit']==manifest['workflow_commit']==os.environ['GITHUB_SHA']
          for name,digest in manifest['input_sha256'].items():
              path=pathlib.Path('source_escape_verification')/name[9:] if name.startswith('EVIDENCE/') else pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          raw=pathlib.Path('source_escape_review/review.txt').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==manifest['response_sha256']
          expected=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n"
          assert pathlib.Path('source_escape_verification/provenance.txt').read_text()==expected
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(manifest['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':manifest['response_sha256']}
          pathlib.Path('source_escape_gate.json').write_text(json.dumps(gate,indent=2)+'\n');print(json.dumps(gate))
          PY
      - name: Separate Gemini publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_source_escape_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-source-escape-publication-audit
          path: |
            source_escape_publication/
            source_escape_gate.json
