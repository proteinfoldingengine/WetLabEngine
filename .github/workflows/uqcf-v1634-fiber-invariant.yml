name: UQCF v16.34 fiber component invariant
on:
  push:
    branches: [research/v16.34-fiber-component-invariant]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Complete v16.34
        run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v16.34-fiber-component-invariant/
          python test_gate.py
          python producer.py
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'));print(verifier.verify_document(d));print(d['stats']);print(d['verdict'])
          PY
      - name: inherited v16.33-v16.31
        run: |
          python ResearchHistory/UQCF-GEM/demos/v16.33-consistency-quotient-kernel/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
