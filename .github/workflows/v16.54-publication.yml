name: v16.54 complete evidence aggregation
on:
  push:
    branches: [research/v16.54-parent-support-connectivity]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/PUBLISH_REQUEST.json']
permissions: {contents: read, actions: read}
concurrency:
  group: v1654-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Bind request and aggregate complete original evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          base='ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/'
          request=json.loads(Path(base+'PUBLISH_REQUEST.json').read_text())
          assert set(request)=={'target_run','target_attempt','target_head','source_parent'}
          assert type(request['target_run']) is int and request['target_run']>0
          assert type(request['target_attempt']) is int and request['target_attempt']>0
          for key in ('target_head','source_parent'):assert re.fullmatch('[0-9a-f]{40}',request[key])
          parent=request['source_parent'];head=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','show','-s','--format=%P',head],text=True).strip()==parent
          assert subprocess.check_output(['git','diff','--name-only',parent,head],text=True).splitlines()==[base+'PUBLISH_REQUEST.json']
          subprocess.run(['git','merge-base','--is-ancestor',request['target_head'],parent],check=True)
          subprocess.run([sys.executable,base+'publication.py',str(request['target_run']),str(request['target_attempt']),request['target_head'],'out/aggregate'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1654-aggregate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: out/aggregate
          if-no-files-found: error
