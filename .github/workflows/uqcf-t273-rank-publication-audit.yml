name: UQCF T-273 rank review publication audit
on:
  push:
    branches: [research/uqcf-t273-rank-refinement-review]
    paths:
      - '.github/workflows/uqcf-t273-rank-publication-audit.yml'
      - '.github/scripts/uqcf_t273_rank_publication_audit.py'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-t273-rank-publication-audit
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify committed review, source binding and immutable readback
        run: python3 -B .github/scripts/uqcf_t273_rank_publication_audit.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t273-rank-verification-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
  publication:
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t273-rank-verification-${{ github.run_attempt }}
          path: previous
      - name: Fresh publication replay and byte comparison
        run: python3 -B .github/scripts/uqcf_t273_rank_publication_audit.py evidence previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t273-rank-publication-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
