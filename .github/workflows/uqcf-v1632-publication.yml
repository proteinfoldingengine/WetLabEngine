name: UQCF v16.32 durable publication
on:
  push:
    branches: [research/v16.32-retained-state-reconstruction]
    paths: ['.github/workflows/uqcf-v1632-publication.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write, actions: read}
    env: {P: ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Fresh reproduce
        run: |
          set -euo pipefail
          cd "$P"
          python test_gate.py
          python producer.py
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'));r=verifier.verify_document(d);assert r['verdict']=='NONINJECTIVE';verifier.verify_collision(d['collisions'][0]);print(r)
          PY
          cd "$GITHUB_WORKSPACE"
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
      - name: Commit publication evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ['P']);d=json.loads((p/'PRODUCTION.json').read_text())
          e={'version':'16.32','publication_run':os.environ['GITHUB_RUN_ID'],'publication_head':os.environ['GITHUB_SHA'],'scientific_run':36651291089,'scientific_sha':'fbe644e31ab92713b5449e788a435c97936a8241','fresh_reproduction':True,'verdict':d['verdict'],'intervals':d['intervals'],'states':d['states'],'closed_collisions':d['closed_collisions'],'digest':d['digest'],'review':'self-review; exact independent witness verifier'}
          (p/'PUBLICATION_EVIDENCE.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/PRODUCTION.json" "$P/PUBLICATION_EVIDENCE.json"
          git commit -m 'v16.32 publish verified reconstruction evidence [skip ci]'
          git push origin HEAD:refs/heads/research/v16.32-retained-state-reconstruction
