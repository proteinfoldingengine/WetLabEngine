name: UQCF T-235 pair-delivery reduction
on:
  push:
    branches: [grok/derivation-pass-t235]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/pair_delivery_reduction/*.py'
      - '.github/workflows/uqcf-pair-delivery-reduction.yml'
      - '.github/scripts/uqcf_pair_delivery_review.py'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  STAGE: ResearchHistory/UQCF-GEM/research/physical-bridge/pair_delivery_reduction
concurrency:
  group: uqcf-pair-delivery-reduction
  cancel-in-progress: false
jobs:
  inherited-fcv-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Inherited foundational stack (REPRODUCE.md)
        run: |
          set -euo pipefail
          P=ResearchHistory/UQCF-GEM/foundational-closure-verification
          (cd "$P" && python tests/test_fcv.py)
          (cd "$P" && sha256sum -c PUBLICATION_SHA256SUMS)
          (cd "$P" && python verify_certificates.py)
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit)
          echo "workflow_sha=$UQCF_WORKFLOW_SHA science_sha=$GITHUB_SHA"
  produce:
    needs: inherited-fcv-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Producer (sympy)
        run: |
          set -euo pipefail
          mkdir -p produced
          python -B "$STAGE/produce.py" > produced/certificate.json
          python -c "import sys,sympy;print(sys.version);print('sympy',sympy.__version__)" > produced/environment.txt
          (cd produced && sha256sum certificate.json environment.txt | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pair-delivery-produced-${{ github.run_attempt }}
          path: produced
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pair-delivery-produced-${{ github.run_attempt }}
          path: produced
      - name: Independent verifier (stdlib only, no sympy installed) and rejecting controls
        run: |
          set -euo pipefail
          (cd produced && sha256sum -c SHA256SUMS)
          mkdir -p verified
          python -B "$STAGE/verify.py" produced/certificate.json "$STAGE/produce.py" > verified/verification.json
          (cd "$STAGE" && python -B test_controls.py "$GITHUB_WORKSPACE/produced/certificate.json" produce.py) > verified/controls.json
          cat verified/verification.json verified/controls.json
          (cd verified && sha256sum verification.json controls.json | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pair-delivery-verified-${{ github.run_attempt }}
          path: verified
          if-no-files-found: error
          retention-days: 90
  publication:
    needs: [produce, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pair-delivery-produced-${{ github.run_attempt }}
          path: produced
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pair-delivery-verified-${{ github.run_attempt }}
          path: verified
      - name: Fresh reproduction, byte comparison and evidence bundle
        run: |
          set -euo pipefail
          (cd produced && sha256sum -c SHA256SUMS)
          (cd verified && sha256sum -c SHA256SUMS)
          python -B "$STAGE/produce.py" > fresh_certificate.json
          cmp fresh_certificate.json produced/certificate.json
          python -B "$STAGE/verify.py" fresh_certificate.json "$STAGE/produce.py" > fresh_verification.json
          cmp fresh_verification.json verified/verification.json
          mkdir -p evidence
          cp produced/certificate.json produced/environment.txt verified/verification.json verified/controls.json evidence/
          python - <<'PY'
          import hashlib, json, os
          d = 'evidence'
          files = {n: hashlib.sha256(open(os.path.join(d, n), 'rb').read()).hexdigest() for n in sorted(os.listdir(d))}
          pub = {'status': 'REPRODUCED', 'fresh_certificate_byte_identical': True, 'fresh_verification_byte_identical': True,
                 'workflow_sha': os.environ['UQCF_WORKFLOW_SHA'], 'science_sha': os.environ['GITHUB_SHA'],
                 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'files': files}
          open(os.path.join(d, 'publication.json'), 'w').write(json.dumps(pub, indent=1, sort_keys=True) + '\n')
          PY
          (cd evidence && sha256sum * | grep -v ' SHA256SUMS$' > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pair-delivery-evidence-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: publication
    if: contains(github.event.head_commit.message, '[gemini-review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pair-delivery-evidence-${{ github.run_attempt }}
          path: evidence
      - name: Single Gemini argument review (one request, no retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -B .github/scripts/uqcf_pair_delivery_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pair-delivery-review-${{ github.run_attempt }}
          path: pair_delivery_review
          if-no-files-found: error
          retention-days: 90
