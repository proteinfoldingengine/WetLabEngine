name: Inspect previous grade review and test the fixed-edge metric
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-routed-grade-inspect.yml']
permissions:
  contents: read
env:
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  read-first-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
      - name: Read the exact red review and replay archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$SCI/read_first_grade_review.py"
  metric-and-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /Tmp/TOE/v498_retained_geometry_formal_report_package/v498_retained_geometry_proof.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/evidence/science/scientific/CERTIFICATE.json.gz
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compare actual V498 function and independent rational edge calculation
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pandas==2.2.3' 'matplotlib==3.10.3' 'networkx==3.4.2' 'scikit-learn==1.6.1'
          python "$SCI/check_historical_metric.py" > metric.json
          echo "METRIC_RECEIPT_B64=$(base64 -w0 metric.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metric-and-context
          path: metric.json
          if-no-files-found: error
