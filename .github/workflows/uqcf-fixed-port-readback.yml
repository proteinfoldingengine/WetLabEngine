name: Trace a computed route to the same remote child
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-fixed-port-readback.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  chain-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/graph_producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/star_normalize.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/evidence/science/scientific/CERTIFICATE.json.gz
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py

            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - name: Reproduce two original paths and direct child calls
        run: |
          python3 -m pip install --disable-pip-version-check sympy==1.14.0
          python3 "$SCI/check_routed_chain.py" > chain.json
          echo "CHAIN_RECEIPT_B64=$(base64 -w0 chain.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-child-replay
          path: chain.json
          if-no-files-found: error
  chain-review:
    needs: chain-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/graph_producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/star_normalize.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/evidence/science/scientific/CERTIFICATE.json.gz
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py

            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - name: Challenge scope and historical child calls
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_routed_chain.py" review chain_review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chain-child-review
          path: chain_review
          if-no-files-found: error
  chain-publication:
    needs: chain-review
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/graph_producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/star_normalize.py
            /ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/evidence/science/scientific/CERTIFICATE.json.gz
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py

            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chain-child-review
          path: chain_review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chain-child-replay
          path: earlier
      - name: Reproduce the trace and check the raw independent review
        run: |
          python3 -m pip install --disable-pip-version-check sympy==1.14.0
          python3 "$SCI/check_routed_chain.py" > chain.json
          cmp chain.json earlier/chain.json
          python3 "$SCI/review_routed_chain.py" audit chain_review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-child-publication
          path: chain_review/publication_audit.json
          if-no-files-found: error
  export-evidence:
    needs: chain-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
      - name: Verify both reviews against GitHub digests and export the original archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$SCI/export_child_archives.py"
