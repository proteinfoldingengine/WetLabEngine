name: Reproduce retained records and read back both original reviews
on:
  push:
    branches: [gpt/retained-records-after-loop]
    paths:
      - ".github/workflows/uqcf-retained-records-readback.yml"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/retained_records_after_loop_review/verify_readback.py"
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/retained_records_after_loop
  REV: ResearchHistory/UQCF-GEM/research/physical-bridge/retained_records_after_loop_review
  PRIOR: ResearchHistory/UQCF-GEM/research/physical-bridge/joint_withdrawal_constraint_loops
  HIST: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
  DEMOS: review_sources/ResearchHistory/UQCF-GEM/demos
  P: ResearchHistory/UQCF-GEM/foundational-closure-verification
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  foundational-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/
            /ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/
            /ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce inherited foundational tests and certificates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIST"
          mkdir -p foundation
          python -m pip install sympy==1.13.3 mpmath==1.3.0 numpy==1.26.4 > foundation/install.log
          git rev-parse HEAD > foundation/inherited-head.txt
          echo "$GITHUB_SHA" > foundation/workflow-head.txt
          python --version > foundation/python-version.txt
          (cd "$P" && python tests/test_fcv.py) 2>&1 | tee foundation/tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit) 2>&1 | tee foundation/parent-tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent && python -m unittest -v && python gate.py) 2>&1 | tee foundation/historical.log
          cp ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/result.json "$P/evidence/REPRODUCED_1615F.json"
          (cd "$P" && python produce_certificates.py) 2>&1 | tee foundation/producer.log
          (cd "$P" && python verify_certificates.py) 2>&1 | tee foundation/verifier.log
          cp "$P"/evidence/{PRODUCTION,VERIFICATION,TEST_RECEIPT,REPRODUCED_1615F}.json "$P/evidence/certificates.json.xz" foundation/
          test "$(xz -dc foundation/certificates.json.xz | sha256sum | cut -d' ' -f1)" = 21357bdc79429f9d4214024b125e75693609a2538a08a57037978b191ab432c6
          (cd foundation && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-readback-foundation
          path: foundation
          if-no-files-found: error


  replay-and-verify-frozen-reviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/retained_records_after_loop/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/retained_records_after_loop_review/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/joint_withdrawal_constraint_loops/native.json
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/evidence/PRODUCTION.json
            /ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/evidence/FULL_CERTIFICATES.json.xz
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce both calculations against frozen source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          mkdir evidence
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > evidence/install.log
          PYTHONHASHSEED=91 python -B "$SCI/replay.py" "$DEMOS" "$PRIOR" evidence/records.json.xz > evidence/results.json
          cmp "$SCI/results.json" evidence/results.json
          cmp "$SCI/records.json.xz" evidence/records.json.xz
          PYTHONHASHSEED=91 python -B "$SCI/verify.py" evidence/records.json.xz "$PRIOR" > evidence/verification.json
          cmp "$SCI/verification.json" evidence/verification.json
          python -B "$SCI/archive_order.py" "$DEMOS" > evidence/archive_order.json
          cmp "$SCI/archive_order.json" evidence/archive_order.json
      - name: Verify the two original independent responses and repeat the scientific replay
        run: |
          set -euo pipefail
          python -B "$REV/verify_readback.py" "$PWD" "$SCI" "$REV" evidence > evidence/model_readback.json
          cp "$REV/verify_readback.py" evidence/
          PYTHONHASHSEED=17 python -B "$SCI/replay.py" "$DEMOS" "$PRIOR" fresh.xz | cmp - evidence/results.json
          cmp fresh.xz evidence/records.json.xz
          PYTHONHASHSEED=17 python -B "$SCI/verify.py" fresh.xz "$PRIOR" | cmp - evidence/verification.json
          PYTHONHASHSEED=17 python -B "$SCI/archive_order.py" "$DEMOS" | cmp - evidence/archive_order.json
          cp "$SCI"/{RESULT.md,SCOPE.md,ARCHIVE_SCOPE.md,ORDER_SCOPE.md,replay.py,verify.py,archive_order.py,review.py} evidence/
          (cd evidence && sha256sum *.md *.py *.json *.txt *.log *.xz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-readback-proof
          path: evidence
          if-no-files-found: error
