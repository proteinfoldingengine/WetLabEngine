name: UQCF-GEM C3 shared-witness publication audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uqcf-gem-c3-shared-witness-publication-audit.yml'
      - '.github/scripts/c3_shared_witness_publication_audit.py'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v4
        with:
          ref: fd5103473926d12553240c275b3d4fe3cb50154b
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Validate original evidence and perform separate publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/c3_shared_witness_publication_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-shared-witness-publication-audit
          path: shared_witness_publication_audit/
          retention-days: 30
