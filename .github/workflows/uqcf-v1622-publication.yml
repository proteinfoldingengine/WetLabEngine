name: UQCF v16.22 durable publication and fresh verification
on:
  push:
    branches: [research/v16.22-response-selection-closure]
    paths: ['.github/workflows/uqcf-v1622-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Preserve all original runs and reproduce the complete certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$P/publish.py" --stage
      - name: Publish verified files without rewriting history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json" "$P/PARENT_BINDING.json" "$P/PUBLICATION_SHA256SUMS"
          git diff --cached --check -- "$P/PUBLICATION_EVIDENCE.json" "$P/PARENT_BINDING.json" "$P/PUBLICATION_SHA256SUMS"
          git commit -m 'v16.22 publish complete verified evidence [skip ci]'
          published=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/research/v16.22-response-selection-closure | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/v16.22-response-selection-closure
          remote=$(git ls-remote origin refs/heads/research/v16.22-response-selection-closure | cut -f1)
          test "$remote" = "$published"
          python "$P/publish.py" --verify
          git diff HEAD --exit-code -- "$P/engine.py" "$P/verify.py" "$P/test_gate.py" "$P/test_schema.py" "$P/PROOFS.md" "$P/evidence" "$P/PUBLICATION_SHA256SUMS"
          printf '{"published_commit":"%s","publication_run":"%s","remote_ref_verified":true}\n' "$published" "$GITHUB_RUN_ID" > v1622-publication-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1622-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            v1622-publication-receipt.json
            ResearchHistory/UQCF-GEM/V16_22_REPORT.md
            ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure
