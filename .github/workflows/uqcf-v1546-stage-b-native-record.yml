name: UQCF v15.46 Stage B native record trace
on:
  push:
    branches:
      - research/v15.46-primitive-joint-source-admissibility
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility/**'
      - '.github/workflows/uqcf-v1546-stage-b-native-record.yml'
permissions:
  contents: read
jobs:
  native-record-trace:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Stage B focused trace tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python -m unittest -v test_native_record_trace
