name: UQCF v15.46 Stage B native record trace
on:
  push:
    branches:
      - research/v15.46-primitive-joint-source-admissibility
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility/**'
      - '.github/workflows/uqcf-v1546-stage-b-native-record.yml'
permissions:
  contents: read
jobs:
  native-record-trace:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Complete current v15.46 test set
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          D=ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python - <<'PY'
          from pathlib import Path
          import sys, unittest
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility').resolve()
          sys.path[:0]=[str(d),str(d/'exploratory')]
          names=['test_evidence_preflight','test_typing_probe','test_native_record_trace']
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          assert suite.countTestCases()==35
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          if r.testsRun!=35 or not r.wasSuccessful() or r.skipped or r.expectedFailures or r.unexpectedSuccesses:
              raise SystemExit('v1546_stage_b_test_failure_or_incomplete_coverage')
          print('V1546_STAGE_B_TEST_COUNT',r.testsRun)
          PY
      - name: Replay Stage B and prior evidence
        run: |
          set -euo pipefail
          D=ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python - <<'PY'
          from pathlib import Path
          import gzip, json, runpy, sys
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility').resolve()
          sys.path.insert(0,str(d))
          import native_record_trace as nrt
          root=d.parents[3]
          raw=nrt.canonical_bytes(nrt.trace_candidate(root))
          assert raw==(d/'docs/STAGE_B_RESULTS.json').read_bytes()
          module=runpy.run_path(str(d/'exploratory/proof_checks.py'))
          result=module['run']()
          assert result['checks_passed']==195
          assert (json.dumps(result,sort_keys=True,indent=2)+'\n').encode('ascii') == gzip.decompress((d/'exploratory/EXPLORATORY_CHECKS.json.gz').read_bytes())
          module=runpy.run_path(str(d/'exploratory/typing_probe.py'))
          assert (json.dumps(module['run'](),sort_keys=True,indent=2)+'\n').encode('ascii') == (d/'exploratory/TYPING_PROBE_RESULTS.json').read_bytes()
          print('V1546_STAGE_B_AND_PRIOR_REPLAYS_PASS')
          PY
          python -m compileall -q "$D"
      - name: Preserve predecessors and exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.44-intrinsic-curvature-interpretation)" = d37f88b98d38aad864e22146ad7dcd2d00f89cd4
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary)" = 775e5549303c1276d3458ec34b553a604436bf0f
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "V1546_STAGE_B_VERIFIED_HEAD $GITHUB_SHA"
