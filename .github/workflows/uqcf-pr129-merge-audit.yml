name: UQCF PR129 actual merge integration audit
on:
  push:
    branches: [research/uqcf-pr129-merge-audit]
    paths:
      - '.github/scripts/uqcf_pr129_merge_audit.py'
      - '.github/workflows/uqcf-pr129-merge-audit.yml'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.sha }}
concurrency:
  group: uqcf-pr129-merge-audit
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 084617b4c392b8955f0a19d2c2b2c02dfa8d9d91
          path: science
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/demos/v15.29-provenance-faithfulness
            ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Exact merge, complete inherited stack and scientific byte replay
        run: python controller/.github/scripts/uqcf_pr129_merge_audit.py science evidence
      - name: Include frozen audit contract and workflow
        if: always()
        run: |
          mkdir -p audit-controller
          cp controller/.github/scripts/uqcf_pr129_merge_audit.py audit-controller/
          cp controller/.github/workflows/uqcf-pr129-merge-audit.yml audit-controller/
          cp controller/ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/PLAN.md audit-controller/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr129-merge-verification-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr129-merge-verification-controller-${{ github.run_attempt }}
          path: audit-controller
          if-no-files-found: error
          retention-days: 90
  publication:
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 084617b4c392b8955f0a19d2c2b2c02dfa8d9d91
          path: science
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/demos/v15.29-provenance-faithfulness
            ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr129-merge-verification-${{ github.run_attempt }}
          path: previous
      - name: Exact merge, complete inherited stack and scientific byte replay
        run: python controller/.github/scripts/uqcf_pr129_merge_audit.py science evidence previous
      - name: Include frozen audit contract and workflow
        if: always()
        run: |
          mkdir -p audit-controller
          cp controller/.github/scripts/uqcf_pr129_merge_audit.py audit-controller/
          cp controller/.github/workflows/uqcf-pr129-merge-audit.yml audit-controller/
          cp controller/ResearchHistory/UQCF-GEM/research/physical-bridge/review_audits/pr129_merge/PLAN.md audit-controller/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr129-merge-publication-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr129-merge-publication-controller-${{ github.run_attempt }}
          path: audit-controller
          if-no-files-found: error
          retention-days: 90
