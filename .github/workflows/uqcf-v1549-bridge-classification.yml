name: UQCF v15.49 bridge classification
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.49-cross-domain-recoverability-bridge-classification/**'
      - '.github/workflows/uqcf-v1549-bridge-classification.yml'
permissions: {contents: read}
jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.49-cross-domain-recoverability-bridge-classification
          python -m unittest -v test_bridge_contract test_verify_bridge_typing test_gate
