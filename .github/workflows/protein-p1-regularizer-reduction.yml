name: Protein P1 Regularizer Reduction

on:
  push:
    branches:
      - research/protein-p1-v9-regularizer-reduction
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P1/**'
      - '.github/workflows/protein-p1-regularizer-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/protein/P1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy==1.26.4
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run P1 contract tests
        run: python -m unittest -v test_p1_contract.py
