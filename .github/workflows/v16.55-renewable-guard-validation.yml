name: v16.55 complete renewable guard domains
on:
  push:
    branches: [research/v16.55-renewable-guard-repair, research/v16.34-fiber-component-invariant]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/CAMPAIGN_REQUEST.json', 'ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/MERGE_CONTRACT.json']
permissions: {contents: read, actions: read}
concurrency: {group: v1655-complete-campaign, cancel-in-progress: false}
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - name: Full rejecting and construction controls
        run: |
          mkdir -p out/controls
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p=subprocess.run(['python','-m','unittest','discover','-s','ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/tests','-v'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          Path('out/controls/tests.log').write_text(p.stdout);print(p.stdout)
          q=subprocess.run(['python','-m','unittest','discover','-s','.github/scripts/tests','-p','test_v1655*.py','-v'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          Path('out/controls/mechanical-tests.log').write_text(q.stdout);print(q.stdout)
          raise SystemExit(p.returncode or q.returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-full-controls-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/controls, if-no-files-found: error}
  domains:
    needs: controls
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/campaign.py shard "$SHARD" out/domain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-primary-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  reproduction:
    needs: domains
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/campaign.py shard "$SHARD" out/domain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-reproduction-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  inherited-development:
    needs: reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/development.py all out/development
        env: {PREREGISTRATION_SHA: a189546887e8744092deebecbdf73076b66ec044}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-development-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/development, if-no-files-found: error}
  inherited-domains:
    needs: inherited-development
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/campaign.py all "$SHARD" out/domain
        env: {PREREGISTRATION_SHA: a189546887e8744092deebecbdf73076b66ec044}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-domain-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  inherited-foundation:
    needs: inherited-domains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: |
          python ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/run.py phase out/inherited
          python ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/run.py package out/inherited v1655-inherited
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-foundation-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/inherited, if-no-files-found: error}
  audit-primary:
    needs: domains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python .github/scripts/v1655_actual_merge_audit.py primary out/actual-merge-primary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-actual-merge-primary-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/actual-merge-primary, if-no-files-found: error}
  audit-reproduction:
    needs: reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python .github/scripts/v1655_actual_merge_audit.py reproduction out/actual-merge-reproduction
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-actual-merge-reproduction-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/actual-merge-reproduction, if-no-files-found: error}
  audit-inherited:
    needs: inherited-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python .github/scripts/v1655_actual_merge_audit.py inherited out/actual-merge-inherited
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-actual-merge-inherited-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/actual-merge-inherited, if-no-files-found: error}
  aggregate:
    needs: [audit-primary, audit-reproduction, audit-inherited]
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - name: Join verified components and reconstruct originals once
        run: |
          python - <<'PY'
          import os,re,subprocess,sys,shutil
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[0-9]+',attempt)
          destination=Path('ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/evidence/actual-merge')/('run-'+run+'-attempt-'+attempt)
          receipt=Path('out/actual-merge-receipt');receipt.mkdir(parents=True)
          p=subprocess.run([sys.executable,'.github/scripts/v1655_actual_merge_audit.py','package',str(destination)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (receipt/'join.log').write_text(p.stdout);print(p.stdout)
          for path in destination.glob('*.json'):
              shutil.copyfile(path,receipt/path.name)
          if p.returncode:raise SystemExit(p.returncode)
          (receipt/'DESTINATION.txt').write_text(str(destination)+'\n')
          PY
      - name: Commit only replay evidence to a fresh isolated branch
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[0-9]+',attempt)
          branch='research/v16.55-actual-merge-evidence-'+run+'-'+attempt
          receipt=Path('out/actual-merge-receipt')
          destination=(receipt/'DESTINATION.txt').read_text().strip()
          assert destination=='ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/evidence/actual-merge/run-'+run+'-attempt-'+attempt
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert json.loads((Path(destination)/'STATUS.json').read_text())['numbered_certification']=='PENDING_ACTUAL_MERGE_WHOLE_EVIDENCE_REVIEW'
          subprocess.run(['git','checkout','-b',branch],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',destination],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changed and all(path.startswith(destination+'/') for path in changed)
          subprocess.run(['git','commit','-m','evidence(v16.55): preserve actual-merge originals once with verified manifests'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert subprocess.check_output(['git','show','-s','--format=%P',sha],text=True).strip()==os.environ['GITHUB_SHA']
          subprocess.run(['git','push','--force-with-lease=refs/heads/'+branch+':','origin','HEAD:refs/heads/'+branch],check=True)
          (receipt/'PUBLISHED_COMMIT.json').write_text(json.dumps({'branch':branch,'commit':sha,'source_parent':os.environ['GITHUB_SHA'],'destination':destination,'files':len(changed)},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-actual-merge-publication-receipt-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/actual-merge-receipt, if-no-files-found: error}
