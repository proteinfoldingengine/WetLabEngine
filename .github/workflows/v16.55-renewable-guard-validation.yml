name: v16.55 complete renewable guard domains
on:
  push:
    branches: [research/v16.55-renewable-guard-repair, research/v16.34-fiber-component-invariant]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/CAMPAIGN_REQUEST.json', 'ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/MERGE_CONTRACT.json']
permissions: {contents: read, actions: read}
concurrency: {group: v1655-complete-campaign, cancel-in-progress: false}
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - name: Full rejecting and construction controls
        run: |
          mkdir -p out/controls
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p=subprocess.run(['python','-m','unittest','discover','-s','ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/tests','-v'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          Path('out/controls/tests.log').write_text(p.stdout);print(p.stdout);raise SystemExit(p.returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-full-controls-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/controls, if-no-files-found: error}
  domains:
    needs: controls
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/campaign.py shard "$SHARD" out/domain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-primary-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  reproduction:
    needs: domains
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/campaign.py shard "$SHARD" out/domain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-reproduction-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  inherited-development:
    needs: reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/development.py all out/development
        env: {PREREGISTRATION_SHA: a189546887e8744092deebecbdf73076b66ec044}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-development-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/development, if-no-files-found: error}
  inherited-domains:
    needs: inherited-development
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {SHARD: '${{ matrix.shard }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.54-parent-support-connectivity/campaign.py all "$SHARD" out/domain
        env: {PREREGISTRATION_SHA: a189546887e8744092deebecbdf73076b66ec044}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-domain-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/domain, if-no-files-found: error}
  inherited-foundation:
    needs: inherited-domains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: |
          python ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/run.py phase out/inherited
          python ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/run.py package out/inherited v1655-inherited
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-inherited-foundation-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/inherited, if-no-files-found: error}
  aggregate:
    needs: inherited-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/transport.py
      - run: python ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/publication.py out/publication
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1655-original-archive-audit-${{ github.sha }}-attempt-${{ github.run_attempt }}', path: out/publication, if-no-files-found: error}
