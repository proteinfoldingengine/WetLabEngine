name: UQCF v16.36 pair completeness closure
on:
  push:
    branches: [research/v16.36-pair-completeness-closure]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: cd ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/ && python test_gate.py
