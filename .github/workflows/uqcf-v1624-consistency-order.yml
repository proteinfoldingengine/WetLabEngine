name: UQCF v16.24 consistency order
on:
  push:
    branches: [research/v16.24-consistency-order]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/*.py'
      - '.github/workflows/uqcf-v1624-consistency-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Rejecting tests, inherited regressions and exact campaign
        run: |
          set -euo pipefail
          cd "$P"
          mkdir -p evidence
          run() { local name="$1"; shift; set +e; "$@" > "evidence/$name.log" 2>&1; local code=$?; set -e; cat "evidence/$name.log"; printf '%s\t%s\n' "$name" "$code" >> evidence/exit_codes.tsv; return "$code"; }
          run tests python test_gate.py
          run validation python test_validation.py
          run v1623 bash -c 'cd ../v16.23-overlap-descent && python test_gate.py && python test_schema.py'
          run v1622 bash -c 'cd ../v16.22-response-selection-closure && python -m unittest discover -v'
          run v1621 bash -c 'cd ../../foundational-closure-verification && python tests/test_fcv.py'
          run exact-parent bash -c 'cd ../v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit'
          run producer python engine.py
          run verifier python verify.py
      - name: Preserve source and actual execution metadata
        if: always()
        run: |
          mkdir -p "$P/evidence"
          python - <<'PY'
          import pathlib,os,subprocess,json,hashlib,zipfile
          p=pathlib.Path(os.environ['P']);out=p/'evidence'
          data={k:os.environ.get(k) for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB']}
          data['python']=subprocess.check_output(['python','--version'],text=True).strip()
          data['dependencies']=subprocess.check_output(['python','-m','pip','freeze'],text=True).splitlines()
          (out/'EXECUTION.json').write_text(json.dumps(data,indent=2)+'\n')
          tracked=subprocess.check_output(['git','ls-files',str(p),'.github/workflows/uqcf-v1624-consistency-order.yml'],text=True).splitlines()
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in tracked:z.write(name,name)
          files=sorted(x for x in out.iterdir() if x.is_file() and x.name!='SHA256SUMS')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(x.read_bytes()).hexdigest()+'  '+x.name+'\n' for x in files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1624-${{ github.sha }}
          path: ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/evidence
          if-no-files-found: error
