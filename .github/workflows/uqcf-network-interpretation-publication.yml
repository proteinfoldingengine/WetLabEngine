name: UQCF v16.15 publish and verify evidence
on:
  push:
    branches: [research/v16.15-network-interpretation]
    paths:
      - '.github/workflows/uqcf-network-interpretation-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uqcf-v1615-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      P: ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - name: Retrieve original evidence without changing scientific source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$P/evidence"
          gh api repos/proteinfoldingengine/WetLabEngine/actions/artifacts/11006352186/zip > "$P/evidence/original-actions-artifact.zip"
          gh api --allow-escape-sequences repos/proteinfoldingengine/WetLabEngine/actions/jobs/109201934269/logs > "$P/evidence/green-job.log"
          python "$P/publish_evidence.py" > "$RUNNER_TEMP/original-check.json"
      - name: Reproduce all scientific fields and stage durable evidence
        run: |
          set -euo pipefail
          cd "$P"
          mv publish_evidence.py "$RUNNER_TEMP/publish_evidence.py"
          set +e
          python -m unittest -v publication_tests > evidence/publication-red.log 2>&1
          red_status=$?
          set -e
          mv "$RUNNER_TEMP/publish_evidence.py" publish_evidence.py
          test "$red_status" -ne 0
          grep -q 'publication verifier absent: expected RED' evidence/publication-red.log
          python -m unittest -v 2>&1 | tee evidence/reproduction-test.log
          (cd ../closed-network-response && python -m unittest -v) 2>&1 | tee evidence/reproduction-parent-test.log
          python -m unittest -v publication_tests 2>&1 | tee evidence/publication-tests.log
          python gate.py 2>&1 | tee evidence/reproduction-audit.log
          python publish_evidence.py --stage | tee "$RUNNER_TEMP/staging-check.json"
          python publish_evidence.py --verify | tee "$RUNNER_TEMP/publication-check.json"
      - name: Publish only the verified evidence, without force pushing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/result.json.xz" "$P/SUMMARY.json" "$P/EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS"
          git diff --cached --check -- "$P/SUMMARY.json" "$P/EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS"
          git commit -m 'Publish complete v16.15 findings, original evidence and exact reproduction receipt'
          published=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/research/v16.15-network-interpretation | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/v16.15-network-interpretation
          remote=$(git ls-remote origin refs/heads/research/v16.15-network-interpretation | cut -f1)
          test "$remote" = "$published"
          git diff HEAD --exit-code -- "$P/publish_evidence.py" "$P/publication_tests.py" "$P/RESULTS.md" "$P/result.json.xz" "$P/evidence" "$P/EVIDENCE.json" "$P/SUMMARY.json" "$P/PUBLICATION_SHA256SUMS"
          python "$P/publish_evidence.py" --verify
          PUBLISHED_SHA="$published" python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'all_valid': True, 'published_commit': os.environ['PUBLISHED_SHA'],
                     'workflow_head': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'remote_ref_verified': True, 'committed_file_checksums_verified': True,
                     'all_scientific_fields_reproduced_exactly': True,
                     'scope': 'research/v16.15-network-interpretation; not main'}
          Path('v1615-publication-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1615-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            v1615-publication-receipt.json
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/evidence
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/result.json.xz
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/RESULTS.md
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/EVIDENCE.json
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/SUMMARY.json
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/network-interpretation/PUBLICATION_SHA256SUMS
