name: v16.51 ternary interface campaign
on:
  push:
    branches: [research/v16.51-ternary-interface]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface/**', '.github/workflows/v16.51-ternary-interface.yml']
permissions: {contents: read}
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: |
          mkdir -p out/development
          python ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface/test_gate.py > out/development/controls.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1651-development-${{ github.sha }}', path: out/development, if-no-files-found: error}
