name: UQCF v16.37 prospective certification
on:
  push:
    branches: [research/v16.37-certified-closure]
permissions: {contents: read}
concurrency:
  group: v1637-${{ github.ref }}
  cancel-in-progress: false
jobs:
  science:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Rejecting controls and historical RED preservation
        run: |
          set -euo pipefail
          mkdir -p out/v1637/logs
          D=ResearchHistory/UQCF-GEM/demos/v16.37-certified-closure
          if python "$D/test_historical_contract.py" > out/v1637/logs/historical-red.log 2>&1; then exit 1; fi
          grep -q "AssertionError: ('HISTORICAL_LABEL_LOSS', (3, 2, 3), (3, 1, 3))" out/v1637/logs/historical-red.log
          python "$D/test_gate.py" 2>&1 | tee out/v1637/logs/tests.log
      - name: Complete prospective retained science and independent verification
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.37-certified-closure/run_campaign.py out/v1637/scientific 2>&1 | tee out/v1637/logs/science.log
      - name: Full inherited foundational stack
        run: |
          set -euo pipefail
          while IFS= read -r path; do python "$path"; done < ResearchHistory/UQCF-GEM/demos/v16.37-certified-closure/inherited.txt 2>&1 | tee out/v1637/logs/inherited.log
      - name: Package exact source and evidence
        if: always()
        run: python ResearchHistory/UQCF-GEM/demos/v16.37-certified-closure/evidence.py package out/v1637
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1637-science-${{ github.sha }}
          path: out/v1637
          if-no-files-found: error
