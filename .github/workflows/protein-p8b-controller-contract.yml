name: Protein P8B Recovered Controller Contract

on:
  pull_request:
    branches:
      - research/protein-p8-patch622-624-reopen-certification
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P8B/**'
      - '.github/workflows/protein-p8b-controller-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/protein/P8B
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install numpy==1.26.4

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run frozen P8B contract tests
        run: python -m unittest -v test_p8b_contract.py
