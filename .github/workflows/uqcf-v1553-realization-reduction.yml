name: UQCF v15.53 lawful realization reduction
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.53-lawful-quantum-realization-reduction/**'
      - '.github/workflows/uqcf-v1553-realization-reduction.yml'
permissions:
  contents: read
jobs:
  v1553:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Task 1 contract tests
        run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.53-lawful-quantum-realization-reduction
          python -m unittest -v test_realization_contract
