name: UQCF v13.27 Gravity Progress Simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/**'
      - '.github/workflows/uqcf-v1327-gravity-progress.yml'

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        working-directory: .

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Verify frozen scientific telemetry
        run: python CHECKER.py

      - name: Render canonical full simulation
        run: python run_simulation.py --frames 25 --fps 6 --output-dir outputs

      - name: Probe MP4
        run: ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration -of json outputs/gravity_progress.mp4

      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uqcf-v1327-gravity-progress
          path: |
            ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/outputs/summary.json
            ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/outputs/telemetry.csv
            ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/outputs/final_frame.png
            ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/outputs/gravity_progress.gif
            ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/outputs/gravity_progress.mp4
          if-no-files-found: error
          retention-days: 30
