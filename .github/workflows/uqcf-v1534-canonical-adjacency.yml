name: UQCF v15.34 Canonical Adjacency Commutant
on:
  push:
    branches: [research/v15.34-canonical-adjacency-commutant]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.34-canonical-adjacency-commutant/**'
      - 'docs/superpowers/specs/2026-09-18-v1534-canonical-adjacency-commutant-design.md'
      - 'docs/superpowers/plans/2026-09-18-v1534-canonical-adjacency-commutant-implementation.md'
      - '.github/workflows/uqcf-v1534-canonical-adjacency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned inherited environment
        run: python -m pip install numpy==2.3.5
      - name: Verify additive scope
        run: |
          python - <<'PY'
          import subprocess
          base='04ad5d3cf24b7f051d714d61d2fe6d8da4fd8eec'
          demo='ResearchHistory/UQCF-GEM/demos/v15.34-canonical-adjacency-commutant/'
          allowed={
            'docs/superpowers/specs/2026-09-18-v1534-canonical-adjacency-commutant-design.md',
            'docs/superpowers/plans/2026-09-18-v1534-canonical-adjacency-commutant-implementation.md',
            '.github/workflows/uqcf-v1534-canonical-adjacency.yml',
          }
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          for line in subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines():
              status,name=line.split('\t',1)
              assert status=='A',line
              assert name.startswith(demo) or name in allowed,name
          PY
      - name: Run inherited frontier regressions
        run: |
          python - <<'PY'
          import re,subprocess,sys
          from pathlib import Path
          root=Path('ResearchHistory/UQCF-GEM/demos')
          suites=[
            (root/'v15.32-commutant-sector-decomposition',['test_gate.py'],6),
            (root/'v15.33-sector-weight-constraint-audit',['test_gate.py'],7),
          ]
          total=0
          for cwd,files,count in suites:
              r=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=240)
              print(r.stdout[-700:],flush=True)
              m=re.search(r'Ran (\d+) tests? in',r.stdout)
              assert r.returncode==0 and m and int(m.group(1))==count and re.search(r'^OK\s*$',r.stdout,re.M),r.stdout
              total+=count
          assert total==13
          PY
      - name: Run v15.34 exact gate
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.34-canonical-adjacency-commutant
        run: |
          python -m unittest -v test_gate.py
          python canonical_adjacency_gate.py --check docs/RESULTS.json > /tmp/v1534-results.json
          python -m compileall -q canonical_adjacency_gate.py test_gate.py
          python - <<'PY'
          import json
          r=json.load(open('docs/RESULTS.json'))
          assert r['status']=='FULL_COMMUTANT_GENERATED_BY_CANONICAL_ADJACENCY_FUNCTION_UNSELECTED'
          assert r['minimal_polynomial_degree']==10
          assert r['power_span_rank']==10
          assert r['full_commutant_generated_by_adjacency'] is True
          assert r['rational_factor_degrees']==[1,3,3,3]
          assert r['adjacency_function_selected'] is False
          assert r['gravity_observables_evaluated'] is False
          assert r['Pillar_3']=='OPEN'
          PY
