name: UQCF v15.34 Canonical Adjacency Commutant
on:
  push:
    branches: [research/v15.34-canonical-adjacency-commutant]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.34-canonical-adjacency-commutant/**'
      - 'docs/superpowers/specs/2026-09-18-v1534-canonical-adjacency-commutant-design.md'
      - 'docs/superpowers/plans/2026-09-18-v1534-canonical-adjacency-commutant-implementation.md'
      - '.github/workflows/uqcf-v1534-canonical-adjacency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned inherited environment
        run: python -m pip install numpy==2.3.5
      - name: Run v15.34 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.34-canonical-adjacency-commutant
        run: python -m unittest -v test_gate.py
