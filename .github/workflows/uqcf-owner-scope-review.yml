name: UQCF owner scope full-stack Gemini review
on:
  push:
    branches: [research/uqcf-owner-scope-review]
    paths:
      - '.github/scripts/uqcf_owner_scope_*.py'
      - '.github/workflows/uqcf-owner-scope-review.yml'
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-owner-scope-review
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Source-tampering and incomplete-review rejection controls
        run: python .github/scripts/uqcf_owner_scope_tests.py
      - name: Immutable proof and complete source integrity
        run: python .github/scripts/uqcf_owner_scope_review.py integrity
      - name: Full inherited FCV stack and independent verifier
        run: python .github/scripts/uqcf_owner_scope_stack.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-scope-integrity-${{ github.run_attempt }}
          path: owner_scope_review
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-scope-stack-${{ github.run_attempt }}
          path: owner_scope_stack
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-scope-integrity-${{ github.run_attempt }}
          path: owner_scope_review
      - name: Independent complete-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/uqcf_owner_scope_review.py review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-scope-review-${{ github.run_attempt }}
          path: owner_scope_review
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: [verification, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-scope-review-${{ github.run_attempt }}
          path: owner_scope_review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-scope-stack-${{ github.run_attempt }}
          path: owner_scope_stack
      - name: Independent exact source, prompt, raw-response and verdict audit
        run: python .github/scripts/uqcf_owner_scope_publication.py
      - name: Fresh producer and independent verifier, exact certificate byte comparison
        run: python .github/scripts/uqcf_owner_scope_stack.py replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-scope-publication-${{ github.run_attempt }}
          path: owner_scope_publication
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-scope-replay-${{ github.run_attempt }}
          path: owner_scope_replay
          if-no-files-found: error
          retention-days: 90
  durable-archive:
    needs: publication-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
      - name: Download original ZIPs, verify API digests, members and completed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_scope_archive.py
      - name: Commit raw evidence on review branch with an exact-head check
        env:
          REVIEW_BRANCH: research/uqcf-owner-scope-review
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name proteinfolding-gpt
          git config user.email proteinfolding-gpt@users.noreply.github.com
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope/evidence
          git commit -m "evidence: preserve owner-scope full-stack run $GITHUB_RUN_ID"
          git push origin "HEAD:$REVIEW_BRANCH"
