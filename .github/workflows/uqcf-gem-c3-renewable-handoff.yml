name: UQCF-GEM renewable handoff verification review and publication audit
on:
  workflow_dispatch:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/COUPLED_C3_RENEWABLE_HANDOFF_SCOPE.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/COUPLED_C3_RENEWABLE_HANDOFF_RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/renewable_handoff/*.py'
      - '.github/scripts/c3_renewable_handoff_review.py'
      - '.github/workflows/uqcf-gem-c3-renewable-handoff.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
      - name: Exact verification and inherited controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir handoff_verification
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 -m unittest discover -s "$ROOT/renewable_handoff" -p test_handoff.py -v 2>&1 | tee handoff_verification/contracts.log
          python3 "$ROOT/renewable_handoff/producer.py" > handoff_verification/certificate.json
          python3 "$ROOT/renewable_handoff/producer.py" > /tmp/repeated.json
          cmp handoff_verification/certificate.json /tmp/repeated.json
          python3 "$ROOT/renewable_handoff/independent.py" handoff_verification/certificate.json | tee handoff_verification/independent.json
          python3 -m unittest discover -s "$ROOT/core_readout" -p test_core_readout.py -v 2>&1 | tee handoff_verification/inherited_core.log
          python3 -m unittest discover -s "$ROOT/fresh_probe" -p test_probe.py -v 2>&1 | tee handoff_verification/inherited_fresh.log
          echo "scientific_sha=$(git -C research_snapshot rev-parse HEAD)" > handoff_verification/provenance.txt
          echo "workflow_sha=$GITHUB_SHA" >> handoff_verification/provenance.txt
          sha256sum handoff_verification/certificate.json > handoff_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-handoff-verification
          path: handoff_verification/
  mathematical-review:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c3-handoff-verification
          path: handoff_verification
      - name: Independent mathematical review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_renewable_handoff_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-handoff-review
          path: handoff_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c3-handoff-verification
          path: handoff_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-handoff-review
          path: handoff_review
      - name: Independent reproduction and provenance reconciliation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/renewable_handoff/producer.py" > /tmp/publication-certificate.json
          cmp /tmp/publication-certificate.json handoff_verification/certificate.json
          python3 "$ROOT/renewable_handoff/independent.py" /tmp/publication-certificate.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          m=json.loads(pathlib.Path('handoff_review/manifest.json').read_text())
          if m['research_commit']!=os.environ['GITHUB_SHA'] or m['workflow_commit']!=os.environ['GITHUB_SHA']: raise ValueError('commit provenance')
          for n,h in m['input_sha256'].items():
              p=(pathlib.Path('handoff_verification')/n[9:]) if n.startswith('EVIDENCE/') else (pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/n)
              if hashlib.sha256(p.read_bytes()).hexdigest()!=h: raise ValueError('input hash '+n)
          raw=pathlib.Path('handoff_review/review.txt').read_bytes()
          if hashlib.sha256(raw).hexdigest()!=m['response_sha256']: raise ValueError('response hash')
          provenance=pathlib.Path('handoff_verification/provenance.txt').read_text()
          if provenance!=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n": raise ValueError('execution provenance')
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(m['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':m['response_sha256']}
          pathlib.Path('handoff_gate.json').write_text(json.dumps(gate,indent=2)+'\n')
          print(json.dumps(gate))
          PY
      - name: Separate independent publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_renewable_handoff_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-handoff-publication
          path: |
            handoff_publication/
            handoff_gate.json
