name: UQCF v15.45 task3 exact spectral checks
on:
  push:
    branches:
      - research/v15.45-curvature-factorization-spectral-boundary
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary/**'
      - '.github/workflows/uqcf-v1545-task3.yml'
permissions:
  contents: read
jobs:
  task3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Exact spectral tests and archived binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary
          python - <<'PY'
          import pathlib, sys, unittest
          assert sys.version_info[:3] == (3,13,5)
          names = ('test_factorization','test_spectral','test_spectral_archives')
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          good = (result.wasSuccessful() and result.testsRun == 23
                  and not result.skipped and not result.expectedFailures
                  and not result.unexpectedSuccesses)
          print('TASK3_SUITE_COUNT',result.testsRun,'ACCEPTED',good,flush=True)
          sys.exit(0 if good else 1)
          PY
          python -m compileall -q spectral.py test_spectral.py test_spectral_archives.py
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TASK3_VERIFIED_HEAD $GITHUB_SHA"
