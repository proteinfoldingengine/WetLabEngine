name: UQCF T-273 rank refinement independent review
on:
  push:
    branches: [research/uqcf-t273-rank-refinement-review]
    paths:
      - '.github/workflows/uqcf-t273-rank-refinement-review.yml'
      - '.github/scripts/uqcf_t273_rank_refinement_review.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/constructive_candidates/t273_rank_refinement/ARGUMENT.md'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-t273-rank-refinement-review
  cancel-in-progress: false
jobs:
  gemini-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Single independent Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -B .github/scripts/uqcf_t273_rank_refinement_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t273-rank-refinement-review-${{ github.run_attempt }}
          path: t273_rank_refinement_review
          if-no-files-found: error
          retention-days: 90
