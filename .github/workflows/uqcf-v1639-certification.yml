name: UQCF v16.39 prospective certification
on:
  push:
    branches: [research/v16.39-theorem-validation]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.39-theorem-validation/**', '.github/workflows/uqcf-v1639-certification.yml']
permissions: {contents: read}
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.39-theorem-validation/test_gate.py
