name: UQCF owner correspondence integration audit
on:
  push:
    branches:
      - gpt/native-owner-calibration-boundary
      - research/uqcf-overlapping-guard-exchange
    paths:
      - '.github/scripts/uqcf_owner_integration.py'
      - '.github/workflows/uqcf-owner-integration.yml'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_joint_source_audit
            ResearchHistory/UQCF-GEM/research/physical-bridge/constructions/record_access
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Frozen sources, archived bytes, independent replay and inherited stack
        run: python .github/scripts/uqcf_owner_integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-integration-${{ github.run_attempt }}
          path: owner_integration_audit
          if-no-files-found: error
          retention-days: 90
