name: UQCF receiver_identification d21 freeze review (section 27, a leaf reads only what it holds; one record climb fixes reads up to its depth) (grokbot)

on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_d21_review/RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_d21_review/FREEZE.md'
      - '.github/scripts/uqcf_rid21_*.py'
      - '.github/workflows/uqcf-gem-rid21-review.yml'
  workflow_dispatch:
    inputs:
      review:
        description: 'Send the frozen argument to Gemini (only after Aaron confirms the API key quota)'
        required: true
        default: 'false'

permissions:
  contents: read

concurrency:
  group: uqcf-rid21-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: python -m pip install --no-cache-dir sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5
      - name: Producer (pure-Python exact Fractions, parent-array AHU enumeration, vertex-coordinate condition rows, exact sparse Gauss-Jordan with a shared PN echelon basis, cone-coordinate depth-matrix reads)
        run: mkdir -p rid21_verify && python .github/scripts/uqcf_rid21_producer.py rid21_verify/producer.json
      - name: Checker (independent leaf-attachment enumeration, canonical DFS isomorphisms, sparse mod-p ranks plus explicit rational families, common-ancestor depth-matrix reads)
        run: python .github/scripts/uqcf_rid21_checker.py rid21_verify/checker.json
      - name: Fresh producer reproduction (deterministic bytes)
        run: python .github/scripts/uqcf_rid21_producer.py rid21_verify/producer_repro.json && cmp rid21_verify/producer.json rid21_verify/producer_repro.json
      - name: Comparator and tampering controls
        run: python .github/scripts/uqcf_rid21_compare.py rid21_verify/producer.json rid21_verify/checker.json rid21_verify/compare.json
      - name: Environment record
        if: always()
        run: |
          python -c "import sys,numpy,sympy,json;json.dump({'python':sys.version,'numpy':numpy.__version__,'sympy':sympy.__version__,'sha':'${{ github.sha }}','workflow_sha':'${{ github.workflow_sha }}'},open('rid21_verify/env.json','w'))"
          sha256sum rid21_verify/* > rid21_verify/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid21-verify-${{ github.run_attempt }}
          path: rid21_verify
          if-no-files-found: error
          retention-days: 90

  argument-review:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid21-verify-${{ github.run_attempt }}
          path: rid21_verify
      - name: Fresh independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_rid21_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid21-review-${{ github.run_attempt }}
          path: rid21_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    needs: [verify, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid21-verify-${{ github.run_attempt }}
          path: rid21_verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid21-review-${{ github.run_attempt }}
          path: rid21_review
      - name: Independent immutable GitHub readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/uqcf_rid21_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid21-publication-${{ github.run_attempt }}
          path: rid21_publication
          if-no-files-found: error
          retention-days: 90
