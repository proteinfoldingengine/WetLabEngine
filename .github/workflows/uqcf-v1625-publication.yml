name: UQCF v16.25 durable publication and fresh verification
on:
  push:
    branches: [research/v16.25-pruning-refinement-closure]
    paths: ['.github/workflows/uqcf-v1625-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write, actions: read}
    env: {P: ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Recover GREEN and fresh reproduce
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$P/evidence/original"
          gh api repos/proteinfoldingengine/WetLabEngine/actions/artifacts/11053981795/zip > /tmp/green.zip
          echo '6221b2926892d2d214c9a1d1fba12bd6a37f5cab8b1d6b32dc2409d431d54985  /tmp/green.zip' | sha256sum -c -
          unzip -q /tmp/green.zip -d /tmp/green
          test "$(python -c "import json;print(json.load(open('/tmp/green/evidence/EXECUTION.json'))['GITHUB_SHA'])")" = "a0064589cb491a68b35c575899e8fc718c41becb"
          cp -a /tmp/green/evidence/. "$P/evidence/original/"
          cp /tmp/green/current-tests.log /tmp/green/producer.log /tmp/green/verifier.log "$P/evidence/original/"
          cd "$P"
          python test_gate.py > evidence/publication-tests.log 2>&1
          python engine.py > evidence/publication-producer.log 2>&1
          python verify.py > evidence/publication-verifier.log 2>&1
          cmp evidence/certificates.json.xz evidence/original/certificates.json.xz
          cmp evidence/VERIFICATION.json evidence/original/VERIFICATION.json
      - name: Inherited regressions
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          (cd ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure && python -m unittest discover -v)
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit)
      - name: Commit verified evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ['P']);v=json.loads((p/'evidence/VERIFICATION.json').read_text())
          e={'version':'16.25','scientific_run':36612979239,'scientific_job':109558811178,'scientific_attempt':1,'scientific_execution_sha':'a0064589cb491a68b35c575899e8fc718c41becb','substantive_red_run':36612453511,'substantive_red_job':109557026676,'publication_workflow_head':os.environ['GITHUB_SHA'],'publication_run':os.environ['GITHUB_RUN_ID'],'publication_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'fresh_scientific_bytes_equal':True,'artifact_id':11053981795,'artifact_sha256':'6221b2926892d2d214c9a1d1fba12bd6a37f5cab8b1d6b32dc2409d431d54985','verification':v,'review':'self-reviewed; algorithmically independent verifier; no separate reviewer'}
          (p/'PUBLICATION_EVIDENCE.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          files=sorted(x for x in p.rglob('*') if x.is_file() and x.name!='PUBLICATION_SHA256SUMS')
          (p/'PUBLICATION_SHA256SUMS').write_text(''.join(hashlib.sha256(x.read_bytes()).hexdigest()+'  '+str(x.relative_to(p))+'\n' for x in files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS"
          git commit -m 'v16.25 publish complete verified evidence [skip ci]'
          git push origin HEAD:refs/heads/research/v16.25-pruning-refinement-closure
          (cd "$P" && sha256sum -c PUBLICATION_SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1625-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/PUBLICATION_EVIDENCE.json
            ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/PUBLICATION_SHA256SUMS
            ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/evidence
