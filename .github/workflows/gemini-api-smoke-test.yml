name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    name: Test requested image model and text fallback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover models and test compatible endpoints
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              sys.exit("FAIL: GEMINI_API_KEY secret missing or empty.")

          host = "https://generativelanguage.googleapis.com/"
          headers = {"x-goog-api-key": key, "Content-Type": "application/json"}

          def request(path, payload=None):
              req = urllib.request.Request(
                  host + path,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, json.load(response), None
              except urllib.error.HTTPError as exc:
                  # Only extract fixed-schema error code/status. Never print the raw
                  # error message, headers, request URL, API key, or response text.
                  api_status = "unavailable"
                  try:
                      obj = json.loads(exc.read(32768).decode("utf-8"))
                      status = obj.get("error", {}).get("status")
                      if status in ("NOT_FOUND", "INVALID_ARGUMENT", "PERMISSION_DENIED",
                                    "UNAUTHENTICATED", "RESOURCE_EXHAUSTED",
                                    "FAILED_PRECONDITION", "UNAVAILABLE", "INTERNAL"):
                          api_status = status
                  except (ValueError, UnicodeError, AttributeError):
                      pass
                  return exc.code, None, api_status
              except Exception as exc:
                  print("FAIL: Network error type:", type(exc).__name__)
                  sys.exit(1)

          models = []
          page = None
          for _ in range(10):
              path = "v1beta/models?pageSize=100"
              if page:
                  path += "&pageToken=" + urllib.parse.quote(page, safe="")
              code, body, error = request(path)
              if code != 200:
                  print(f"FAIL: Model discovery HTTP {code}, API status {error}")
                  sys.exit(1)
              models.extend(body.get("models", []))
              page = body.get("nextPageToken")
              if not page:
                  break

          supported = [m["name"] for m in models
                       if "generateContent" in m.get("supportedGenerationMethods", [])
                       and m.get("name", "").startswith("models/gemini-")]
          print("Model discovery: PASS")
          print("Advertised generateContent Gemini models:", len(supported))
          if not supported:
              sys.exit("FAIL: No supported Gemini models returned.")

          requested = "models/gemini-2.5-flash-image"
          print("Requested model advertised:", requested in supported)

          def rank(name):
              if name == requested: return (0, name)
              if name == "models/gemini-2.5-flash": return (1, name)
              if "flash" in name and "2.5" in name: return (2, name)
              if "flash" in name and "2.0" in name: return (3, name)
              if "flash" in name: return (4, name)
              return (5, name)

          ordered = sorted(supported, key=rank)
          # Test requested image model first, then at most two advertised alternatives.
          # A single successful request ends testing to minimize API usage.
          payload = {
              "contents": [{"parts": [{"text": "Reply with exactly OK."}]}],
              "generationConfig": {"temperature": 0, "maxOutputTokens": 64},
          }
          candidates = [requested] + [name for name in ordered if name != requested][:2]
          for name in candidates:
              for version in ("v1beta", "v1"):
                  print(f"Testing {version}/{name}: ", end="", flush=True)
                  code, body, error = request(f"{version}/{name}:generateContent", payload)
                  if code == 200:
                      parts = [p for c in body.get("candidates", [])
                               for p in c.get("content", {}).get("parts", [])]
                      has_text = any(isinstance(p.get("text"), str) and p["text"].strip() for p in parts)
                      has_image = any(isinstance(p.get("inlineData"), dict) and p["inlineData"].get("data") for p in parts)
                      if has_text or has_image:
                          print("PASS")
                          print("Working endpoint:", f"{version}/{name}")
                          print("Response modalities:", "text" if has_text else "", "image" if has_image else "")
                          print("Reported model:", body.get("modelVersion", "not reported"))
                          print("Total tokens:", body.get("usageMetadata", {}).get("totalTokenCount", "not reported"))
                          print("No key or generated text printed.")
                          sys.exit(0)
                      print("HTTP 200 but no text or image generated")
                  else:
                      print(f"HTTP {code}, API status {error}")
                      if code in (401, 403, 429):
                          print("Stopping on authentication, permission, or quota error.")
                          sys.exit(1)

          print("FAIL: No tested model generated text or image.")
          print("Check Gemini API project access, restrictions and model endpoint availability.")
          sys.exit(1)
          PY
