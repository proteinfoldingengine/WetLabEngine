name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    name: Discover model and verify Gemini authentication
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Discover available Gemini models and test one
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              print("FAIL: GEMINI_API_KEY secret missing or empty.")
              sys.exit(1)

          base = "https://generativelanguage.googleapis.com/v1beta/"
          headers = {"x-goog-api-key": key, "Content-Type": "application/json"}

          def call(url, payload=None):
              req = urllib.request.Request(
                  url, data=None if payload is None else json.dumps(payload).encode("utf-8"),
                  headers=headers, method="GET" if payload is None else "POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"FAIL: Google API HTTP {exc.code} during {'model discovery' if payload is None else 'text generation'}.")
                  if exc.code in (400, 404):
                      print("Check model availability, API version, and enabled project access.")
                  elif exc.code in (401, 403):
                      print("Check API key validity, restrictions, and Gemini API access.")
                  elif exc.code == 429:
                      print("Quota or rate limit reached; check API usage and billing.")
                  # Never print response body or URL containing credentials.
                  sys.exit(1)
              except Exception as exc:
                  print(f"FAIL: Request error ({type(exc).__name__}).")
                  sys.exit(1)

          models = []
          page = None
          for _ in range(10):
              url = base + "models?pageSize=100"
              if page:
                  url += "&pageToken=" + urllib.parse.quote(page, safe="")
              _, result = call(url)
              models.extend(result.get("models", []))
              page = result.get("nextPageToken")
              if not page:
                  break

          supported = [m for m in models
                       if "generateContent" in m.get("supportedGenerationMethods", [])
                       and m.get("name", "").startswith("models/gemini-")]
          if not supported:
              print("FAIL: No generateContent-capable Gemini models returned.")
              sys.exit(1)

          def priority(m):
              name = m["name"]
              if "flash" in name and "2.5" in name: return (0, name)
              if "flash" in name and "2.0" in name: return (1, name)
              if "flash" in name: return (2, name)
              return (3, name)

          model = sorted(supported, key=priority)[0]["name"]
          print(f"PASS: Model discovery returned {len(supported)} generateContent-capable Gemini models.")
          print("Selected model:", model)
          _, result = call(base + model + ":generateContent", {
              "contents": [{"parts": [{"text": "Reply with exactly OK."}]}],
              "generationConfig": {"temperature": 0, "maxOutputTokens": 64}
          })
          text = [p.get("text", "") for c in result.get("candidates", [])
                  for p in c.get("content", {}).get("parts", [])]
          if not any(isinstance(t, str) and t.strip() for t in text):
              print("FAIL: API returned no generated text.")
              sys.exit(1)
          print("PASS: Gemini text generation succeeded.")
          print("Model version:", result.get("modelVersion", "not reported"))
          usage = result.get("usageMetadata", {})
          if "totalTokenCount" in usage:
              print("Total API tokens:", usage["totalTokenCount"])
          print("No API key or response text was printed.")
          PY
