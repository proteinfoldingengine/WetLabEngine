name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    name: Verify Gemini API authentication
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call Gemini without exposing the API key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              print("FAIL: GEMINI_API_KEY repository secret is missing or empty.")
              sys.exit(1)

          # Do not print the secret, request headers, or API response body.
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
          payload = {
              "contents": [{"parts": [{"text": "Reply with exactly OK."}]}],
              "generationConfig": {"temperature": 0, "maxOutputTokens": 32},
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              # Intentionally do not echo server response: it could contain sensitive data.
              print(f"FAIL: Gemini returned HTTP {exc.code}.")
              if exc.code in (401, 403):
                  print("Check API key validity, Gemini API access, and project restrictions.")
              elif exc.code == 429:
                  print("Quota or rate limit reached; check API billing and limits.")
              elif exc.code == 404:
                  print("Requested model or endpoint is unavailable for this API key.")
              else:
                  print("Check Google AI Studio API status and configuration.")
              sys.exit(1)
          except Exception as exc:
              print(f"FAIL: Request could not complete ({type(exc).__name__}).")
              sys.exit(1)

          candidates = data.get("candidates") or []
          has_text = any(
              isinstance(part.get("text"), str) and part["text"].strip()
              for candidate in candidates
              for part in (candidate.get("content", {}).get("parts") or [])
          )
          if status != 200 or not has_text:
              print("FAIL: API responded but no generated text was returned.")
              sys.exit(1)

          print("PASS: Gemini API authentication and text generation succeeded.")
          print("Model:", data.get("modelVersion", "not reported"))
          usage = data.get("usageMetadata", {})
          if "totalTokenCount" in usage:
              print("Total API tokens:", usage["totalTokenCount"])
          print("No API key or generated text was printed.")
          PY
