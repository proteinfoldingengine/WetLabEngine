name: UQCF v16.35 Gate E final publication
on:
  push:
    branches: [research/v16.35-fiber-barrier-closure]
    paths: ['.github/workflows/uqcf-v1635-gate-e-final.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: write, actions: read}
    env: {P: ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Fresh Gate E reproduction
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/proteinfoldingengine/WetLabEngine/actions/artifacts/11074358182/zip >/tmp/science.zip
          echo '5a7c64109bde276a11c3d3354e3f205b8239f4d8ccad087a7d401e5077eb5098  /tmp/science.zip' | sha256sum -c -
          unzip -q /tmp/science.zip -d /tmp/science
          cd "$P";python test_gate.py;python producer.py
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'));r=verifier.verify_document(d);assert r['gate_e']=='FIXED';assert all(x['compulsory_coordinates']==x['possible_coordinates'] for x in d['barriers']);print(r)
          PY
          cmp PRODUCTION.json /tmp/science/PRODUCTION.json
          cd "$GITHUB_WORKSPACE"
          python ResearchHistory/UQCF-GEM/demos/v16.34-fiber-component-invariant/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.33-consistency-quotient-kernel/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
      - name: Commit final Gate E closure
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ['P']);d=json.loads((p/'PRODUCTION.json').read_text())
          e={'version':'16.35','closure':'FINAL_A_E','scientific_run':36661135439,'scientific_sha':'3fdd8b746a2ac56a652fc42bac3a561242d8572f','artifact':11074358182,'artifact_sha256':'5a7c64109bde276a11c3d3354e3f205b8239f4d8ccad087a7d401e5077eb5098','publication_run':os.environ['GITHUB_RUN_ID'],'publication_head':os.environ['GITHUB_SHA'],'fresh_bytes_equal':True,'digest':d['digest'],'states':d['states'],'edges':d['edges'],'positive_barriers':d['positive_barriers'],'gates':{k:d[k] for k in ('gate_a','gate_b','gate_c','gate_d','gate_e')},'gate_e_method':'all-minimax feasible subgraph via coordinate avoidability/use reachability','verification':'independent full-universe reconstruction Gates A-E'}
          (p/'PUBLICATION_EVIDENCE.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          files=['producer.py','verifier.py','test_gate.py','PREREGISTRATION.md','RESULTS.md','PRODUCTION.json','PUBLICATION_EVIDENCE.json']
          (p/'PUBLICATION_SHA256SUMS').write_text(''.join(hashlib.sha256((p/f).read_bytes()).hexdigest()+'  '+f+'\n' for f in files))
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/PRODUCTION.json" "$P/PUBLICATION_EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS"
          git commit -m 'v16.35 close Gate E and publish final A-E evidence [skip ci]'
          git push origin HEAD:refs/heads/research/v16.35-fiber-barrier-closure
          (cd "$P" && sha256sum -c PUBLICATION_SHA256SUMS)
