name: v16.52 development GREEN controls
on:
  push:
    branches: [research/v16.52-recursive-ternary-composition]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/**', '.github/workflows/v16.52-red.yml']
permissions: {contents: read}
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Validate recursive behavior and rejecting controls
        run: |
          mkdir -p out/green
          python ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/test_implementation_red.py > out/green/behavior.log 2>&1
          python ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/test_gate.py > out/green/controls.log 2>&1
          python ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/test_integrity.py > out/green/integrity.log 2>&1
          python ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/test_review_red.py > out/green/review.log 2>&1
          cat out/green/*.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1652-green-${{ github.sha }}', path: out/green, if-no-files-found: error}
