name: UQCF v16.31 global component factorization
on:
  push:
    branches: [research/v16.31-global-component-factorization]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/**'
      - '.github/workflows/uqcf-v1631-global-components.yml'
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Substantive legacy missing-evidence contract RED
        run: |
          set -euo pipefail
          cd "$P"
          mkdir -p evidence
          V31_LEGACY=1 python test_contract.py 2>&1 | tee evidence/legacy-contract.log
      - name: New campaign wiring RED
        if: always()
        run: |
          set -euo pipefail
          cd "$P"
          python test_gate.py 2>&1 | tee evidence/wiring.log
      - name: Bind execution
        if: always()
        run: |
          python - <<'PY'
          import os,json,pathlib,hashlib,platform
          p=pathlib.Path(os.environ['P']);e=p/'evidence';e.mkdir(exist_ok=True)
          m={'sha':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'python':platform.python_version(),'sources':{str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}}
          (e/'EXECUTION.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1631-${{ github.sha }}
          if-no-files-found: error
          path: ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/evidence
