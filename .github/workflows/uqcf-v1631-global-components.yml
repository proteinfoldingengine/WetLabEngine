name: UQCF v16.31 global component factorization
on:
  push:
    branches: [research/v16.31-global-component-factorization]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/*.py'
      - '.github/workflows/uqcf-v1631-global-components.yml'
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Complete independent endpoint and component verification
        run: python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/run_campaign.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1631-${{ github.sha }}
          if-no-files-found: error
          path: ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/evidence
