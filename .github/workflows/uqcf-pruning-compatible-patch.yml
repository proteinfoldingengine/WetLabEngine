name: Verify pruning compatibility of the archived patch write
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-pruning-compatible-patch.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_pruning_compatible_patch.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1713_shape_rg.py
      - name: Reconstruct the exact ranks and replay the original functions
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5 sympy==1.14.0
          mkdir -p handoff
          python3 "$SCI/check_pruning_compatible_patch.py" > handoff/replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pruning-compatible-patch-replay
          path: handoff/replay.json
          if-no-files-found: error


  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_pruning_compatible_patch.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1713_shape_rg.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_pruning_compatible_patch.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pruning-compatible-patch-replay
          path: handoff
      - name: Independently adjudicate the derivation and source boundaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_pruning_compatible_patch.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pruning-compatible-patch-review
          path: review_evidence
          if-no-files-found: error


  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_pruning_compatible_patch.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.41-unit-barrier-dichotomy/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.42-overlapping-core-repair/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1713_shape_rg.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/PRUNING_COMPATIBLE_PATCH.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_pruning_compatible_patch.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pruning-compatible-patch-replay
          path: earlier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pruning-compatible-patch-review
          path: review_evidence
      - name: Reproduce the exact bytes and independently read back the review
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5 sympy==1.14.0
          mkdir -p handoff
          python3 "$SCI/check_pruning_compatible_patch.py" > handoff/replay.json
          cmp handoff/replay.json earlier/replay.json
          python3 "$SCI/review_pruning_compatible_patch.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pruning-compatible-patch-publication
          path: |
            handoff/replay.json
            review_evidence/publication_audit.json
          if-no-files-found: error
