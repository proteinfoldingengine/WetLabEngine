name: v16.55 partitioned publication recovery
on:
  push:
    branches: [research/v16.55-renewable-guard-repair]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/RECOVERY_CONTROL_REQUEST.json'
      - 'ResearchHistory/UQCF-GEM/demos/v16.55-renewable-guard-repair/RECOVERY_REQUEST.json'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: v1655-publication-recovery, cancel-in-progress: false}
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Recovery adapter controls
        run: python -m unittest discover -s .github/scripts/tests -p 'test_v1655_recovery_audit.py' -v

