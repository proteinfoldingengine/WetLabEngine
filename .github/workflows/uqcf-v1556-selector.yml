name: UQCF v15.56 response selector obstruction
on:
  push:
    branches: [research/v15.56-response-selector-obstruction]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/**'
      - '.github/workflows/uqcf-v1556-selector.yml'
permissions: {contents: read}
jobs:
  v1556:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Task 1 selector-space gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_selector_space test_selector_audit
