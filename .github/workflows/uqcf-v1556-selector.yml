name: UQCF v15.56 response selector obstruction
on:
  push:
    branches: [research/v15.56-response-selector-obstruction]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/**'
      - '.github/workflows/uqcf-v1556-selector.yml'
permissions: {contents: read}
jobs:
  v1556:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Task 1 selector-space gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python print_pruning_response.py
          python print_pruning_measure_robustness.py
          python print_fiber_local_nogo.py
          python -m unittest -v test_selector_space test_selector_audit test_bridge_type test_bridge_space test_target_functor test_retained_morphism test_ancestral_span test_genesis_base test_descent_correspondence test_lineage_schema test_augmented_lineage test_identity_correspondence test_scalar_lineage_audit test_native_scalar_carrier test_retained_incidence test_lineage_laplacian test_native_source_bridge test_source_lineage_localization test_ledger_address_equivalence test_product_identity test_source_binding test_retained_amplitude test_projective_poisson test_response_controls test_adversarial_topology test_rooted_green_invariant test_refinement_naturality test_pruning_morphism test_source_pushforward test_pruning_response test_pruning_measure_robustness test_fiber_local_nogo test_pruning_intertwining_theorem test_pruning_defect_cocycle test_intrinsic_defect_class test_obstruction_invariants test_obstruction_filtration
      - name: Exact source-space and boundary-response audit
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_pruning_consistency_audit
          python pruning_consistency_audit.py
      - name: Matched completion response and pruning-order null
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_matched_completion_response
          python matched_completion_response.py
      - name: Exact completion-to-connection response bridge
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_completion_connection_bridge
          python completion_connection_bridge.py

      - name: Holonomy-to-curvature identifiability gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_holonomy_curvature_gate
          python holonomy_curvature_gate.py

      - name: Curvature-limit dependency audit
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_curvature_dependency_audit
          python curvature_dependency_audit.py

      - name: Hidden-completion selector boundary
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_completion_selector_boundary
          python completion_selector_boundary.py

      - name: Branch reassessment
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_branch_reassessment
          python branch_reassessment.py

      - name: Operational defect response classification
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_operational_defect_response_classification
          python operational_defect_response_classification.py

      - name: Cross-domain intertwiner audit
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_cross_domain_intertwiner_audit
          python cross_domain_intertwiner_audit.py
