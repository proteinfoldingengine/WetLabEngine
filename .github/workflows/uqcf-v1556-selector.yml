name: UQCF v15.56 response selector obstruction
on:
  push:
    branches: [research/v15.56-response-selector-obstruction]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/**'
      - '.github/workflows/uqcf-v1556-selector.yml'
permissions: {contents: read}
jobs:
  v1556:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Task 1 selector-space gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python print_pruning_response.py
          python print_pruning_measure_robustness.py
          python print_fiber_local_nogo.py
          python -m unittest -v test_selector_space test_selector_audit test_bridge_type test_bridge_space test_target_functor test_retained_morphism test_ancestral_span test_genesis_base test_descent_correspondence test_lineage_schema test_augmented_lineage test_identity_correspondence test_scalar_lineage_audit test_native_scalar_carrier test_retained_incidence test_lineage_laplacian test_native_source_bridge test_source_lineage_localization test_ledger_address_equivalence test_product_identity test_source_binding test_retained_amplitude test_projective_poisson test_response_controls test_adversarial_topology test_rooted_green_invariant test_refinement_naturality test_pruning_morphism test_source_pushforward test_pruning_response test_pruning_measure_robustness test_fiber_local_nogo test_pruning_intertwining_theorem test_pruning_defect_cocycle
