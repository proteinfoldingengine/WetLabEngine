name: UQCF-GEM C3 miss-count publication audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uqcf-gem-c3-miss-reconstruction-publication-audit.yml'
      - '.github/scripts/c3_miss_reconstruction_publication_audit.py'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v4
        with:
          ref: bb991c4b87f872e9e68f0c7b00cf45455db8b960
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Reconcile original archives and independently audit publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/c3_miss_reconstruction_publication_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-miss-reconstruction-publication
          path: miss_reconstruction_publication/
          retention-days: 30
