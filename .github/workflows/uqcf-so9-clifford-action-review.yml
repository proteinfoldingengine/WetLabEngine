name: UQCF so9 Clifford graph-action whole-argument review
on:
  push:
    branches: [research/uqcf-so9-clifford-action-review]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/so9_clifford_action_review/ARGUMENT.md'
      - '.github/scripts/uqcf_so9_clifford_action_*.py'
      - '.github/workflows/uqcf-so9-clifford-action-review.yml'
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-so9-clifford-action-review
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge/so9_clifford_action_review
            .github
      - name: Freeze and hash exact argument
        run: python3 -B .github/scripts/uqcf_so9_clifford_action_review.py integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: so9-clifford-integrity-${{ github.run_attempt }}
          path: so9_clifford_integrity
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge/so9_clifford_action_review
            .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: so9-clifford-integrity-${{ github.run_attempt }}
          path: so9_clifford_integrity
      - name: Independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -B .github/scripts/uqcf_so9_clifford_action_review.py review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: so9-clifford-review-${{ github.run_attempt }}
          path: so9_clifford_review
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: [integrity, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: so9-clifford-integrity-${{ github.run_attempt }}
          path: so9_clifford_integrity
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: so9-clifford-review-${{ github.run_attempt }}
          path: so9_clifford_review
      - name: Separate immutable GitHub readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/uqcf_so9_clifford_action_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: so9-clifford-publication-${{ github.run_attempt }}
          path: so9_clifford_publication
          if-no-files-found: error
          retention-days: 90
