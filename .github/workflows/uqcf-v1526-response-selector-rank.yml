name: UQCF v15.26 Response Selector Rank and GitHub Delivery
on:
  push:
    branches: [research/v15.26-response-selector-rank]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.26-response-selector-rank/**'
      - '.github/workflows/uqcf-v1526-response-selector-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Verify additive scope and run all 490 selected tests
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          base='8ae14d5f62e3a8c006a04b611abacb567a25996b'
          root=Path('ResearchHistory/UQCF-GEM');demo=root/'demos/v15.26-response-selector-rank'
          changed=subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines()
          for line in changed:
              status,name=line.split('\t',1)
              assert status=='A' and (name.startswith(str(demo)+'/') or name=='.github/workflows/uqcf-v1526-response-selector-rank.yml'),line
          suites=[('v15/v15.11',['test_continuity.py'],20),('demos/v15.12-pretime-to-history',['test_simulation.py','test_presentation.py'],30),('demos/v15.13-independent-events',['test_model.py','test_replay.py'],27),('demos/v15.14-record-dependencies',['test_adaptive.py','test_replay.py'],30),('demos/v15.15-coherent-records',['test_coherent.py','test_replay.py'],30),('demos/v15.16-partial-pruning',['test_recoverability.py','test_replay.py'],33),('demos/v15.17-retained-motion',['test_motion.py','test_replay.py'],32),('demos/v15.18-invariant-completion',['test_completion.py','test_replay.py'],34),('demos/v15.19-linear-prediction',['test_linear.py','test_replay.py'],36),('demos/v15.20-physical-predictor',['test_channel.py','test_replay.py'],38),('demos/v15.21-record-readout',['test_record_readout.py','test_readout_presentation.py'],32),('demos/v15.22-event-sufficient-retention',['test_event_sufficiency.py','test_sufficiency_presentation.py'],32),('demos/v15.23-sufficient-channel-family',['test_family.py','test_family_view.py'],32),('demos/v15.24-composition-gate',['test_composition.py','test_composition_view.py'],30),('demos/v15.25-pretime-gravity-canary',['test_canary.py','test_replay.py'],28),('demos/v15.26-response-selector-rank',['test_selector.py','test_replay.py'],26)]
          logs=demo/'evidence/ci';logs.mkdir(parents=True);total=0
          for folder,files,count in suites:
              result=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=root/folder,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              (logs/(Path(folder).name+'.log')).write_text(result.stdout)
              print(folder,result.stdout[-250:],flush=True)
              assert result.returncode==0 and re.search(rf'Ran {count} tests? in',result.stdout) and re.search(r'^OK\s*$',result.stdout,re.M),(folder,result.stdout)
              total+=count
          assert total==490
          (logs/'SUMMARY.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'base_sha':base,'selected_tests_passed':total,'scope':'selected research regressions; no full-repository or independent scientific certification'},indent=2)+'\n')
          PY
      - name: Reproduce target-origin ledger, inspector and video
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.26-response-selector-rank
        run: |
          python selector_rank.py --out outputs > evidence/ci/model.log
          python replay.py --out outputs --video > evidence/ci/render.log
          ffmpeg -v error -i outputs/selector_rank.mp4 -f null - 2> evidence/ci/video_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json outputs/selector_rank.mp4 > evidence/ci/video_info.json
          python -m compileall -q selector_rank.py replay.py test_selector.py test_replay.py
          python - <<'PY'
          import json
          r=json.load(open('outputs/verification.json'))
          assert r['selector_verdict']=='CYCLE_RESPONSE_TARGET_NOT_DERIVED'
          assert r['rank_gate_closes_given_target'] is True and r['rank_gate_supplies_target'] is False
          assert r['full_response_rank_on_cycle_space']==r['cycle_dimension']==50
          assert r['face_response_residual_cycle_freedom']==2
          assert r['same_q_multiple_full_rank_targets'] is True and r['cycle_target_derived'] is False
          assert r['signal_of_life'] is False and r['gravity_canary_certified'] is False
          assert not any(r[k] for k in ('uses_metric_selector','uses_pruning','uses_entropy','uses_physical_time','fits_newton_or_gr','physical_gravity_derived'))
          PY
      - name: Package source, data and fresh CI evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,sys,zipfile
          source=Path('ResearchHistory/UQCF-GEM/demos/v15.26-response-selector-rank');dist=Path('delivery/assets');dist.mkdir(parents=True)
          info=json.loads((source/'evidence/ci/video_info.json').read_text())
          assert any(s.get('codec_name')=='h264' and s.get('width')==1280 and s.get('height')==720 for s in info['streams'])
          assert abs(float(info['format']['duration'])-24)<0.1
          for name in ['selector_rank.mp4','selector_rank.html','verification.json','replay_data.json']:
              shutil.copyfile(source/'outputs'/name,dist/name)
          shutil.copyfile(source/'README.md',dist/'REPORT.md')
          provenance={'source_sha':os.environ['GITHUB_SHA'],'base_sha':'8ae14d5f62e3a8c006a04b611abacb567a25996b','run_id':os.environ['GITHUB_RUN_ID'],'selected_tests_passed':490,'python':sys.version,'packages':subprocess.check_output([sys.executable,'-m','pip','freeze'],text=True).splitlines(),'scope':'Fresh CI response-rank/target-origin gate; no physical gravity certification, full-repository regression, or independent peer review.'}
          (dist/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n')
          files=[]
          for p in sorted(source.rglob('*')):
              if p.is_symlink():raise ValueError('symlink rejected')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc':files.append(p)
          members=[{'name':p.relative_to(source).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          bundle=dist/'UQCF_GEM_v15_26_bundle.zip'
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(source).as_posix())
              z.writestr('PACKAGE_MANIFEST.json',json.dumps({'files':members,'provenance':provenance},indent=2))
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              for row in members:
                  raw=z.read(row['name']);assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          (dist/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(dist.iterdir())))
          Path('delivery/RELEASE_NOTES.md').write_text('# v15.26 — Pre-time response selector rank / target origin\n\nExact source: `'+os.environ['GITHUB_SHA']+'`. All 490 selected tests passed before packaging.\n\nA metric-free topology response operator resolves all 50 cycle degrees when a target y is supplied. The same source q admits Hodge/global, exact-local, and cycle-shift responses under different full-rank targets. Therefore rank closes identifiability but does not derive the physical target: `CYCLE_RESPONSE_TARGET_NOT_DERIVED`. No gravity signal is certified.\n\nIncludes report, finished MP4/offline HTML, numerical ledger, replay data, source/fresh-CI evidence bundle, provenance and checksums. All eight assets are verified by size and SHA-256 before publication. No merge to main.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.26-verified-delivery
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v15.26-failure-evidence
          path: ResearchHistory/UQCF-GEM/demos/v15.26-response-selector-rank/evidence/ci/
          if-no-files-found: ignore
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.26-verified-delivery
          path: delivery
      - name: Upload unique draft, verify digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'proteinfoldingengine/WetLabEngine'
          TAG="uqcf-gem-v15.26-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" delivery/assets/* --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'UQCF-GEM v15.26 — response selector rank / target origin' --notes-file delivery/RELEASE_NOTES.md --draft --prerelease --latest=false
          RELEASE_ID="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > delivery/RELEASE_METADATA.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('delivery/RELEASE_METADATA.json').read_text());local=list(Path('delivery/assets').iterdir());remote={a['name']:a for a in data['assets']}
          assert len(local)==len(remote)==8
          for path in local:
              asset=remote[path.name]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          print('All eight release assets match SHA-256 and size.')
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=false > delivery/PUBLICATION_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('delivery/PUBLICATION_RECEIPT.json').read_text());assert data['draft'] is False;print(data['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.26-publication-receipt
          path: delivery/PUBLICATION_RECEIPT.json
          if-no-files-found: error
