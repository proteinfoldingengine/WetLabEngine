name: UQCF v16.26 atomic consistency increment
on:
  push:
    branches: [research/v16.26-consistency-increment-law]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Complete v16.26 campaign
        run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law
          python test_gate.py
          python engine.py
          python verify.py
      - name: Inherited v16.25 regressions
        run: |
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1626-${{ github.sha }}
          if-no-files-found: error
          path: ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/evidence
