name: UQCF v16.26 atomic consistency increment
on:
  push:
    branches: [research/v16.26-consistency-increment-law]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: cd ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/ && python test_gate.py
