name: Verify state-driven V1712 patch update
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-v1712-patch-write.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1712_patch_write.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
      - name: Compare the original caller and exact reconstruction
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_v1712_patch_write.py" > handoff/replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1712-patch-write-replay
          path: handoff/replay.json
          if-no-files-found: error

  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1712_PATCH_WRITE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1712_patch_write.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_v1712_patch_write.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
            /Tmp/TOE/Einstein 7/v1472_20_uci_candidate_package/v1472_20_uci_incident_adapter.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1712-patch-write-replay
          path: handoff
      - name: Independently review the argument and original code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_v1712_patch_write.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1712-patch-write-review
          path: review_evidence
          if-no-files-found: error

  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/V1712_PATCH_WRITE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_v1712_patch_write.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_v1712_patch_write.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/v1712_rg.py
            /Tmp/TOE/Einstein 7/v1472_20_uci_candidate_package/v1472_20_uci_incident_adapter.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1712-patch-write-replay
          path: original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v1712-patch-write-review
          path: review_evidence
      - name: Reproduce replay bytes and verify the original review
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_v1712_patch_write.py" > handoff/replay.json
          cmp handoff/replay.json original/replay.json
          python3 "$SCI/review_v1712_patch_write.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1712-patch-write-publication
          path: |
            handoff/replay.json
            review_evidence/publication_audit.json
          if-no-files-found: error
