name: UQCF v16.29 durable publication
on:
  push:
    branches: [research/v16.29-local-profile-closure]
    paths: ['.github/workflows/uqcf-v1629-publication.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure
      TARGET_BRANCH: research/v16.29-local-profile-closure
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Preserve original attempts and reproduce full scientific evidence
        run: |
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,io,json,lzma,os,platform,shutil,subprocess,sys,zipfile
          p=Path(os.environ['P']);e=p/'evidence';e.mkdir(exist_ok=True)
          def need(ok,msg):
              if not ok:raise RuntimeError(msg)
          def api(path):return subprocess.check_output(['gh','api','--allow-escape-sequences','repos/proteinfoldingengine/WetLabEngine/'+path])
          def sha(data):return hashlib.sha256(data).hexdigest()
          def write(path,obj):path.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          registry=json.loads((p/'RUN_REGISTRY.json').read_text());green=None;preserved=[]
          for item in registry['runs']:
              folder=e/'history'/str(item['run']);folder.mkdir(parents=True,exist_ok=True)
              raw=api(f"actions/runs/{item['run']}");(folder/'run.json').write_bytes(raw);run=json.loads(raw)
              need(run['head_sha']==item['sha'] and run['status']=='completed' and run['conclusion']==item['conclusion'],'original run identity/status')
              for attempt in range(1,run['run_attempt']+1):
                  ad=folder/f'attempt-{attempt}';ad.mkdir(exist_ok=True)
                  jr=api(f"actions/runs/{item['run']}/attempts/{attempt}/jobs?per_page=100");(ad/'jobs.json').write_bytes(jr);jobs=json.loads(jr)
                  need(jobs['total_count']==len(jobs['jobs']),'incomplete original jobs')
                  for j in jobs['jobs']:(ad/(str(j['id'])+'.log')).write_bytes(api(f"actions/jobs/{j['id']}/logs"))
              ar=api(f"actions/runs/{item['run']}/artifacts?per_page=100");(folder/'artifacts.json').write_bytes(ar);listing=json.loads(ar)
              need(listing['total_count']==len(listing['artifacts']),'artifact pagination')
              a=next(x for x in listing['artifacts'] if x['id']==item['artifact']);need(not a['expired'],'expired original')
              data=api(f"actions/artifacts/{item['artifact']}/zip")
              need(len(data)==item['artifact_bytes'] and sha(data)==item['artifact_sha256'],'original ZIP checksum/size')
              (folder/(str(item['artifact'])+'.zip')).write_bytes(data)
              z=zipfile.ZipFile(io.BytesIO(data));need(z.testzip() is None,'ZIP CRC')
              for name in z.namelist():
                  member=PurePosixPath(name);need(not member.is_absolute() and '..' not in member.parts,'unsafe ZIP path')
              if item['role']=='scientific-green':green=z
              preserved.append({'run':item['run'],'sha':item['sha'],'attempts':run['run_attempt'],'artifact':item['artifact'],'artifact_sha256':sha(data)})
          need(green is not None,'missing original GREEN')
          for line in green.read('SHA256SUMS').decode().splitlines():
              expected,name=line.split('  ',1);need(sha(green.read(name))==expected,'GREEN member '+name)
          original=e/'original-green';original.mkdir(exist_ok=True)
          for name in green.namelist():
              if name.endswith('/'):continue
              target=original/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(green.read(name))
          meta=json.loads(green.read('EXECUTION.json'))
          need(meta['sha']=='5d09e6c28827f70412c5f8b05fd98af75d3b7e5f' and meta['execution_status']=='COMPLETED' and meta['tests_passed']==228,'GREEN execution receipt')
          need(meta['sources'],'missing executed source inventory')
          for path,expected in meta['sources'].items():need(sha(Path(path).read_bytes())==expected,'executed source changed '+path)
          snapshot=zipfile.ZipFile(io.BytesIO(green.read('SOURCE.zip')));need(snapshot.testzip() is None,'source archive CRC')
          for path,expected in meta['sources'].items():need(sha(snapshot.read(path))==expected,'source snapshot mismatch '+path)
          with Path('/tmp/v1629-reproduction.log').open('wb') as log:r=subprocess.run([sys.executable,str(p/'run_campaign.py')],stdout=log,stderr=subprocess.STDOUT)
          shutil.copyfile('/tmp/v1629-reproduction.log',e/'publication-reproduction.log')
          if r.returncode:
              print((e/'publication-reproduction.log').read_text()[-22000:]);raise RuntimeError('fresh campaign failed')
          fresh=json.loads((e/'EXECUTION.json').read_text())
          need(fresh['execution_status']=='COMPLETED' and fresh['tests_passed']==228 and len(fresh['commands'])==16 and all(x['exit_code']==0 for x in fresh['commands']),'fresh execution coverage')
          files=['FULL_CERTIFICATES.json.xz','PRODUCTION.json','VERIFICATION.json','EXAMPLES.json','TESTS.json']
          equality={name:(e/name).read_bytes()==green.read(name) for name in files};need(all(equality.values()),'fresh scientific bytes differ')
          raw=lzma.decompress((e/'FULL_CERTIFICATES.json.xz').read_bytes());verification=json.loads((e/'VERIFICATION.json').read_text())
          need(sha(raw)==verification['raw_sha256']=='19d291e2f51286051a1e1c2840ab2d5994b9f8fe52f88f574ad2460b7ba7e69b','raw scientific identity')
          jobs=json.loads(api(f"actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100"));job=next(j for j in jobs['jobs'] if j['name']=='publish')
          receipt={'version':'16.29','scientific_run':36637296991,'scientific_job':109640956245,'scientific_attempt':1,'scientific_sha':meta['sha'],
              'scientific_artifact':11065511674,'scientific_artifact_sha256':'f7d838b76750f2dc6319955147f56c5eea7016b3deb5132a833c718f847f4f30',
              'publication_run':os.environ['GITHUB_RUN_ID'],'publication_job':job['id'],'publication_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'publication_workflow_head':os.environ['GITHUB_SHA'],
              'fresh_scientific_bytes_equal':all(equality.values()),'compared_scientific_files':files,'source_snapshot_verified':len(meta['sources']),
              'python':platform.python_version(),'dependencies':fresh['dependencies'],'tests_passed':fresh['tests_passed'],'fresh_commands':fresh['commands'],
              'preserved_original_runs':preserved,'raw_certificate_bytes':len(raw),'compressed_certificate_bytes':(e/'FULL_CERTIFICATES.json.xz').stat().st_size,
              'raw_certificate_sha256':sha(raw),'verification':verification,'numbered_report_sha256':sha(Path('ResearchHistory/UQCF-GEM/V16_29_REPORT.md').read_bytes()),
              'review':'self-review with algorithmically independent verifier, not independent authorship','scope':'actual retained local minima versus fixed scalar maximum; no physical or geometric inference'}
          write(p/'PUBLICATION_EVIDENCE.json',receipt)
          print(json.dumps({'tests':fresh['tests_passed'],'byte_equality':equality,'parent':verification['parent']['original'],'extension':verification['extension']['original']}))
          PY
      - name: Scoped non-force publication and committed-byte verification
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import os,pathlib,hashlib
          p=pathlib.Path(os.environ['P'])
          files=sorted(f for f in p.rglob('*') if f.is_file() and '__pycache__' not in f.parts and f.name not in ('PUBLICATION_SHA256SUMS','PUBLICATION_RECEIPT.json'))
          (p/'PUBLICATION_SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p))+'\n' for f in files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json" "$P/PUBLICATION_SHA256SUMS"
          python - <<'PY'
          import os,subprocess
          p=os.environ['P']+'/'
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if not names or any(not n.startswith(p) for n in names):raise RuntimeError('out-of-scope publication')
          PY
          git commit -m 'v16.29 publish complete verified local-profile evidence [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          PUBLISHED="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$PUBLISHED"
          python - <<'PY'
          import pathlib,os,hashlib,subprocess,json
          p=pathlib.Path(os.environ['P']);head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();count=0
          for line in (p/'PUBLICATION_SHA256SUMS').read_text().splitlines():
              expected,name=line.split('  ',1);data=subprocess.check_output(['git','show',head+':'+str(p/name)])
              if hashlib.sha256(data).hexdigest()!=expected:raise RuntimeError('committed checksum '+name)
              count+=1
          receipt=json.loads((p/'PUBLICATION_EVIDENCE.json').read_text())
          report=subprocess.check_output(['git','show',head+':ResearchHistory/UQCF-GEM/V16_29_REPORT.md'])
          if hashlib.sha256(report).hexdigest()!=receipt['numbered_report_sha256']:raise RuntimeError('numbered report checksum')
          out={'published_commit':head,'branch':os.environ['TARGET_BRANCH'],'committed_manifest_members_verified':count,'numbered_report_verified':True,'publication_run':os.environ['GITHUB_RUN_ID']}
          (p/'PUBLICATION_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1629-publication-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/PUBLICATION_EVIDENCE.json
            ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/PUBLICATION_SHA256SUMS
            ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/PUBLICATION_RECEIPT.json
            ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/evidence
