name: UQCF v15.16 Partial Pruning

on:
  push:
    branches:
      - main
      - research/v15.16-partial-pruning
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning/**'
      - '.github/workflows/uqcf-v1516-partial-pruning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Record exact checked head
        run: git rev-parse HEAD
      - name: Thirty-three partial-pruning and replay tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
        run: python -m unittest -v test_recoverability.py test_replay.py
      - name: Thirty preserved v15.15 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.15-coherent-records
        run: python -m unittest -v test_coherent.py test_replay.py
      - name: Thirty preserved v15.14 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.14-record-dependencies
        run: python -m unittest -v test_adaptive.py test_replay.py
      - name: Twenty-seven preserved v15.13 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.13-independent-events
        run: python -m unittest -v test_model.py test_replay.py
      - name: Thirty preserved v15.12 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.12-pretime-to-history
        run: python -m unittest -v test_simulation.py test_presentation.py
      - name: Twenty preserved v15.11 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.12-pretime-to-history/vendor
        run: python -m unittest -v test_continuity.py
      - name: Generate partial-pruning outputs and replay
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
        run: |
          python recoverability.py --out outputs
          python replay.py --out outputs
      - name: Compile extension
        run: python -m compileall -q ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning
      - name: Upload replay and numerical verification
        uses: actions/upload-artifact@v4
        with:
          name: v15.16-partial-pruning-replay
          path: ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning/outputs/
          if-no-files-found: error
