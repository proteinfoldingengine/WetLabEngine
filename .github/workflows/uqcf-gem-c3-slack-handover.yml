name: UQCF-GEM shared-root slack handover
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/slack_handover/*.py'
      - '.github/workflows/uqcf-gem-c3-slack-handover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Exact slack-family verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          mkdir slack_verification
          python3 -m unittest discover -s "$ROOT/slack_handover" -p test_slack.py -v 2>&1 | tee slack_verification/contracts.log
          python3 "$ROOT/slack_handover/producer.py" slack_verification/certificate.json | tee slack_verification/counts.json
          python3 "$ROOT/slack_handover/independent.py" slack_verification/certificate.json slack_verification/independent.json | tee slack_verification/independent.log
          for SPEC in 'handover_graph test_handover.py' 'anchored_release test_anchored.py' 'local_progress test_progress.py' 'capacity_gap test_capacity.py' 'saturated_transfer test_transfer.py' 'label_release test_release.py' 'footprint test_footprint.py' 'fixed_family test_fixed_family.py'; do
            read -r DIR PATTERN <<< "$SPEC"
            python3 -m unittest discover -s "$ROOT/$DIR" -p "$PATTERN" -v 2>&1 | tee "slack_verification/inherited_$DIR.log"
          done
          printf 'scientific_sha=%s\nworkflow_sha=%s\n' "$GITHUB_SHA" "$GITHUB_SHA" > slack_verification/provenance.txt
          cp "$ROOT/COUPLED_C3_SLACK_HANDOVER_RESULT.md" slack_verification/frozen_proof_scope.md
          cp "$ROOT/slack_handover/producer.py" "$ROOT/slack_handover/independent.py" "$ROOT/slack_handover/test_slack.py" "$ROOT/slack_handover/red.log" "$ROOT/slack_handover/full_scope_failure.log" "$ROOT/slack_handover/upper_four_red.log" slack_verification/
          sha256sum slack_verification/certificate.json > slack_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-slack-handover-verification
          path: slack_verification/
  fresh-reproduction:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@v4
        with:
          name: c3-slack-handover-verification
          path: slack_fresh
      - name: Fresh complete producer and independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/slack_handover/producer.py" /tmp/fresh.json
          cmp /tmp/fresh.json slack_fresh/certificate.json
          python3 "$ROOT/slack_handover/independent.py" /tmp/fresh.json slack_fresh/fresh_independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-slack-handover-fresh-reproduction
          path: slack_fresh/
  mathematical-review:
    needs: fresh-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-slack-handover-fresh-reproduction
          path: slack_verification
      - name: Adversarial Gemini mathematical review of exact event commit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_slack_handover_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-slack-handover-mathematical-review
          path: slack_handover_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-slack-handover-fresh-reproduction
          path: slack_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-slack-handover-mathematical-review
          path: slack_handover_review
      - name: Exact provenance and fresh independent publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/slack_handover/producer.py" /tmp/publication.json /tmp/publication_independent.json
          cmp /tmp/publication.json slack_verification/certificate.json
          python3 "$ROOT/slack_handover/independent.py" /tmp/publication.json /tmp/publication_independent.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path('slack_handover_review/manifest.json').read_text())
          assert manifest['research_commit']==manifest['workflow_commit']==os.environ['GITHUB_SHA']
          for name,digest in manifest['input_sha256'].items():
              path=pathlib.Path('slack_verification')/name[9:] if name.startswith('EVIDENCE/') else pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          raw=pathlib.Path('slack_handover_review/review.txt').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==manifest['response_sha256']
          expected=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n"
          assert pathlib.Path('slack_verification/provenance.txt').read_text()==expected
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(manifest['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':manifest['response_sha256']}
          pathlib.Path('slack_handover_gate.json').write_text(json.dumps(gate,indent=2)+'\n');print(json.dumps(gate))
          PY
      - name: Separate Gemini publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_slack_handover_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-slack-handover-publication-audit
          path: |
            slack_handover_publication/
            slack_handover_gate.json
