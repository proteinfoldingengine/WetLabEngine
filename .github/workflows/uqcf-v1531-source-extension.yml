name: UQCF v15.31 Source Extension Gate
on:
  push:
    branches: [research/v15.31-source-extension-minimality]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.31-source-extension-minimality/**'
      - 'docs/superpowers/specs/2026-09-18-v1531-source-extension-minimality-design.md'
      - '.github/workflows/uqcf-v1531-source-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        run: python -m pip install numpy==2.3.5
      - name: Run v15.31 tests
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.31-source-extension-minimality
        run: python -m unittest -v test_gate.py
