name: Fixed quantum recovery publication-only closeout
on:
  push:
    branches: [gpt/fixed-quantum-recovery-review]
    paths: ['.github/workflows/uqcf-fixed-quantum-recovery-closeout.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fixed-quantum-recovery-publication-closeout
  cancel-in-progress: false
jobs:
  preserve-original-run-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/fixed_quantum_recovery_review
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preserve original completed run and four job logs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_fixed_quantum_recovery_closeout.py
      - name: Commit and verify only additive closeout bytes
        env:
          REVIEW_BRANCH: gpt/fixed-quantum-recovery-review
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name proteinfolding-gpt
          git config user.email proteinfolding-gpt@users.noreply.github.com
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/fixed_quantum_recovery_review/evidence/run-42821167329-attempt-1/closeout
          git commit -m "Preserve all four original fixed quantum recovery job logs and closeout receipt"
          git push origin "HEAD:$REVIEW_BRANCH"
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python .github/scripts/uqcf_fixed_quantum_recovery_closeout.py readback FETCH_HEAD
