name: UQCF v15.67 high precision identity audit
on:
  push:
    branches: [research/v15.67-highprecision-identity-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 mpmath==1.3.0
      - run: git rev-parse HEAD | tee execution_head.txt
      - name: RED/audit
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/highprecision-identity-audit
          OPENBLAS_NUM_THREADS=1 python -m unittest -v test_gate 2>&1 | tee test.log
          OPENBLAS_NUM_THREADS=1 python gate.py 2>&1 | tee result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highprecision-identity-audit-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/highprecision-identity-audit/PREREGISTRATION.md
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/highprecision-identity-audit/test.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/highprecision-identity-audit/result.json
