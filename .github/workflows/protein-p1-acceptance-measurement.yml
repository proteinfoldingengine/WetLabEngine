# P1 authoritative measurement retry after output-serialization-only repair; scientific contract unchanged.\nname: Protein P1 Acceptance Measurement

on:
  push:
    branches:
      - research/protein-p1-v9-regularizer-reduction
    paths:
      - '.github/workflows/protein-p1-acceptance-measurement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/protein/P1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install numpy==1.26.4

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Re-certify frozen P1 contract
        run: python -m unittest -v test_p1_contract.py test_p1_measurement_contract.py

      - name: Run authoritative P1 measurement
        run: python p1_measurement.py

      - name: Hash measurement outputs
        run: sha256sum measurement_output/* | tee measurement_output/SHA256SUMS.txt

      - name: Upload authoritative P1 packet
        uses: actions/upload-artifact@v4
        with:
          name: protein-p1-authoritative-measurement
          path: ResearchHistory/UQCF-GEM/protein/P1/measurement_output/
          if-no-files-found: error
          retention-days: 90
