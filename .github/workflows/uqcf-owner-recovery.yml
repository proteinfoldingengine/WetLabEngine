name: UQCF owner scope original review publication recovery
on:
  push:
    branches: [research/uqcf-owner-scope-review]
    paths: ['.github/scripts/uqcf_owner_recovery_*.py', '.github/workflows/uqcf-owner-recovery.yml']
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  publication-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-scope-review-1
          path: owner_scope_review
          run-id: 41322904153
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-scope-stack-1
          path: owner_scope_stack
          run-id: 41322904153
          github-token: ${{ github.token }}
      - name: Reproduce original format rejection and verify repair rejection controls
        run: python .github/scripts/uqcf_owner_recovery_tests.py
      - name: Audit unchanged sources and original raw Gemini response
        run: python .github/scripts/uqcf_owner_recovery_audit.py
      - name: Fresh inherited producer, independent verifier and exact byte replay
        run: python .github/scripts/uqcf_owner_scope_stack.py replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-recovery-publication
          path: owner_scope_publication
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-recovery-replay
          path: owner_scope_replay
          if-no-files-found: error
  durable-archive:
    needs: publication-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope
      - name: Archive original artifacts and failures with lossless chunking
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_owner_recovery_archive.py
      - name: Commit evidence with exact-head check
        env:
          REVIEW_BRANCH: research/uqcf-owner-scope-review
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name proteinfolding-gpt
          git config user.email proteinfolding-gpt@users.noreply.github.com
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_owner_scope/evidence
          git commit -m "evidence: preserve original Gemini review and recovery $GITHUB_RUN_ID"
          git push origin "HEAD:$REVIEW_BRANCH"
