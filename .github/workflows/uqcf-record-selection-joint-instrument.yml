name: Retained record and P1 joint instrument audit
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-record-selection-joint-instrument.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  TRACE_DIR: ResearchHistory/UQCF-GEM/research/physical-bridge/record_selection_binding
concurrency:
  group: uqcf-record-selection-joint-instrument
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/record_selection_binding/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/measurement_first_review/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/ontology_continuity_audit.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/REPORT.md
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify the complete two-outcome instrument contract
        run: |
          python -m pip install 'numpy==2.3.5'
          python "$TRACE_DIR/verify_joint.py" > replay.json
          diff -u "$TRACE_DIR/joint_verification.json" replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-selection-joint-source-replay
          path: replay.json
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/record_selection_binding/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/measurement_first_review/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/ontology_continuity_audit.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/REPORT.md
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - name: Independent whole-argument challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$TRACE_DIR/review_joint.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: record-selection-joint-whole-argument-review
          path: review_evidence
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/record_selection_binding/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/measurement_first_review/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_location_resolution/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/ontology_continuity_audit.py
            /ResearchHistory/UQCF-GEM/v15/v15.11/REPORT.md
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: record-selection-joint-whole-argument-review
          path: review_evidence
      - name: Verify raw review and frozen source identities
        run: |
          python -m pip install 'numpy==2.3.5'
          python "$TRACE_DIR/verify_joint.py" > publication_replay.json
          diff -u "$TRACE_DIR/joint_verification.json" publication_replay.json
          python3 "$TRACE_DIR/review_joint.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-selection-joint-publication-readback
          path: review_evidence/publication_audit.json
          if-no-files-found: error
          retention-days: 90
