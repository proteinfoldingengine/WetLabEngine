name: UQCF observation_preservation whole-argument review

on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review/RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review/FREEZE.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review/source_packet.json'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review/source_lock.json'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review/sources/**' 
      - '.github/scripts/uqcf_observation_preservation_*.py'
      - '.github/workflows/uqcf-gem-observation_preservation-review.yml'

permissions:
  contents: read
  actions: read

env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}

concurrency:
  group: uqcf-observation_preservation-review
  cancel-in-progress: false

# Official actions v4 tag commits verified before this workflow was prepared.
jobs:
  integrity:
    name: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review
            .github
      - name: Offline plumbing regression tests, no science execution
        run: python3 .github/scripts/uqcf_observation_preservation_tests.py
      - name: Validate exact documents, locked sources and copied archive bytes
        run: python3 .github/scripts/uqcf_observation_preservation_integrity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: observation_preservation-integrity-${{ github.run_attempt }}
          path: observation_preservation_integrity
          if-no-files-found: error
          retention-days: 90

  argument-review:
    name: argument-review
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review
            .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: observation_preservation-integrity-${{ github.run_attempt }}
          path: observation_preservation_integrity
      - name: Fresh independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_observation_preservation_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: observation_preservation-review-${{ github.run_attempt }}
          path: observation_preservation_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    name: publication-audit
    needs: [integrity, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge/observation_preservation_review
            .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: observation_preservation-integrity-${{ github.run_attempt }}
          path: observation_preservation_integrity
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: observation_preservation-review-${{ github.run_attempt }}
          path: observation_preservation_review
      - name: Independent immutable GitHub source and review readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/uqcf_observation_preservation_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: observation_preservation-publication-${{ github.run_attempt }}
          path: observation_preservation_publication
          if-no-files-found: error
          retention-days: 90
