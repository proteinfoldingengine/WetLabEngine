name: UQCF v15.61 source derivative classification
on:
  push:
    branches: [research/v15.61-source-derivative-classification]
  workflow_dispatch:
jobs:
  theorem-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: git rev-parse HEAD | tee execution_head.txt
      - name: Verify algebraic factorization
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-derivative-classification
          OPENBLAS_NUM_THREADS=1 python verify_factorization.py | tee verification.log
      - uses: actions/upload-artifact@v4
        with:
          name: source-derivative-classification-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-derivative-classification/DERIVATION.md
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-derivative-classification/verification.log
