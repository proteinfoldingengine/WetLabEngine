name: UQCF-GEM C3 miss-count reconstruction review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uqcf-gem-c3-miss-reconstruction-review.yml'
      - '.github/scripts/c3_miss_reconstruction_review.py'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ffcdb3c418bb83ae48c51d86567c32120816d35
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Exact independent reconstruction and rejecting controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p miss_reconstruction_verification
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 -m unittest discover -s "$ROOT/miss_reconstruction" -p test_reconstruction.py -v 2>&1 | tee miss_reconstruction_verification/contracts.log
          python3 "$ROOT/miss_reconstruction/producer.py" > miss_reconstruction_verification/certificate.json
          python3 "$ROOT/miss_reconstruction/producer.py" > /tmp/repeated-certificate.json
          cmp miss_reconstruction_verification/certificate.json /tmp/repeated-certificate.json
          python3 "$ROOT/miss_reconstruction/independent.py" miss_reconstruction_verification/certificate.json | tee miss_reconstruction_verification/independent.json
          python3 -m unittest discover -s "$ROOT/core_readout" -p test_core_readout.py -v 2>&1 | tee miss_reconstruction_verification/inherited_core_readout.log
          echo "scientific_sha=$(git -C research_snapshot rev-parse HEAD)" > miss_reconstruction_verification/provenance.txt
          echo "workflow_sha=$GITHUB_SHA" >> miss_reconstruction_verification/provenance.txt
          sha256sum miss_reconstruction_verification/certificate.json > miss_reconstruction_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-miss-reconstruction-verification
          path: miss_reconstruction_verification/
          retention-days: 30
  adversarial-review:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6ffcdb3c418bb83ae48c51d86567c32120816d35
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@v4
        with:
          name: c3-miss-reconstruction-verification
          path: miss_reconstruction_verification
      - name: Independent mathematical review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/c3_miss_reconstruction_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-miss-reconstruction-review
          path: miss_reconstruction_review/
          retention-days: 30
