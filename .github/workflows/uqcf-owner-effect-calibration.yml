name: Fixed owner effect calibration and hidden realization audit
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-owner-effect-calibration.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  TRACE_DIR: ResearchHistory/UQCF-GEM/research/physical-bridge/owner_effect_calibration
concurrency:
  group: uqcf-owner-effect-calibration
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/owner_effect_calibration/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/CORRECTION_T249.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/REALIZATION_INVARIANT_OWNER_EFFECT_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/support_sector_correspondence/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/OWNER_HELD_EFFECT_ACTION_DIRECTIVE_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce every frozen finite control
        run: |
          python -m pip install 'sympy==1.14.0'
          python "$TRACE_DIR/verify.py" > replay.json
          diff -u "$TRACE_DIR/verification.json" replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-calibration-source-replay
          path: replay.json
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/owner_effect_calibration/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/CORRECTION_T249.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/REALIZATION_INVARIANT_OWNER_EFFECT_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/support_sector_correspondence/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/OWNER_HELD_EFFECT_ACTION_DIRECTIVE_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - name: Independent whole-argument challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$TRACE_DIR/review.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-calibration-whole-argument-review
          path: review_evidence
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/owner_effect_calibration/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_delivery_boundary/CORRECTION_T249.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/REALIZATION_INVARIANT_OWNER_EFFECT_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/support_sector_correspondence/RESULT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/OWNER_HELD_EFFECT_ACTION_DIRECTIVE_2026_11_07.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-calibration-whole-argument-review
          path: review_evidence
      - name: Verify raw reviewer output and frozen source identities
        run: |
          python3 -m pip install 'sympy==1.14.0'
          python3 "$TRACE_DIR/verify.py" > publication_replay.json
          diff -u "$TRACE_DIR/verification.json" publication_replay.json
          python3 "$TRACE_DIR/review.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-calibration-publication-readback
          path: review_evidence/publication_audit.json
          if-no-files-found: error
          retention-days: 90
