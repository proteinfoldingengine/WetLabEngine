name: UQCF-GEM C3 core-readout publication audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uqcf-gem-c3-core-readout-publication-audit.yml'
      - '.github/scripts/c3_core_readout_publication_audit.py'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v4
        with:
          ref: a2b5c92e067834595240897437227bb9d0a99358
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Validate full evidence and independently audit publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/c3_core_readout_publication_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-core-readout-publication-audit
          path: core_readout_publication_audit/
          retention-days: 30
