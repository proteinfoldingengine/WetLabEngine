name: Saved AUC final immutable readback
on:
  push:
    branches: [gpt/saved-auc-audit-20261114]
    paths: ['.github/workflows/uqcf-saved-auc-final-readback.yml']
permissions:
  contents: read
concurrency:
  group: uqcf-saved-auc-final-readback
  cancel-in-progress: false
jobs:
  immutable_full_readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/saved_auc_audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read every added immutable file including unchanged binary ZIP bytes
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          mkdir -p final_readback
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          root=Path.cwd()
          sha=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          manifest_path='ResearchHistory/UQCF-GEM/research/physical-bridge/saved_auc_audit/FINAL_READBACK_MANIFEST.json'
          raw=(root/manifest_path).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='e9db290148cf80633efa67c4b5e9f9d73506b644c4d7cc1a15bd63ea92d62b14'
          manifest=json.loads(raw)
          assert manifest['repository']==os.environ['GITHUB_REPOSITORY']=='proteinfoldingengine/WetLabEngine'
          records=manifest['records']
          assert len({r['path'] for r in records})==len(records)==54
          def hashes(b):
              return {'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()}
          for path in (manifest_path,'.github/workflows/uqcf-saved-auc-final-readback.yml'):
              records.append(dict(path=path,**hashes((root/path).read_bytes())))
          verified=[]
          for record in records:
              path=record['path']
              assert not Path(path).is_absolute() and '..' not in Path(path).parts
              local=(root/path).read_bytes()
              assert all(hashes(local)[k]==record[k] for k in ('bytes','sha256','git_blob'))
              url='https://api.github.com/repos/proteinfoldingengine/WetLabEngine/contents/'+urllib.parse.quote(path,safe='/')+'?ref='+sha
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              assert data['encoding']=='base64' and data['sha']==record['git_blob']
              remote=base64.b64decode(data['content'])
              assert remote==local and hashes(remote)==hashes(local)
              verified.append(record)
          receipt={'status':'PASS','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'review_run_id':'43583237420','checkout_sha':sha,'files':len(verified),'records':verified,'model_calls':0,'scientific_generator_calls':0,'native_bridge':'NOT_DERIVED'}
          Path('final_readback/receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('Full immutable byte readback PASS:',len(verified),'files; includes all three original ZIPs. No model or scientific generator calls.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-auc-final-readback-${{ github.run_attempt }}
          path: final_readback
          if-no-files-found: error
          retention-days: 90
