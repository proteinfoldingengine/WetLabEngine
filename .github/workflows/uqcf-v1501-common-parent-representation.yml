name: UQCF v15.01 Common-Parent Representation Audit

on:
  push:
    branches:
      - main
      - research/v15.01-common-parent-representation
    paths:
      - 'ResearchHistory/UQCF-GEM/v15/v15.01/**'
      - 'Tmp/TOE/UQCF_Quantum_Compatibility_Lab/uqcf_quantum_lab.py'
      - 'ResearchHistory/UQCF-GEM/v14/v14.03/source_ray_audit.py'
      - 'ResearchHistory/UQCF-GEM/v14/v14.04/SUMMARY.json'
      - 'Tmp/TOE/Einstein 6/v1172_full_stack_package/v1172_6d_gpu_full_stack_genesis_provenance_engine.py'
      - 'ResearchHistory/UQCF-GEM/v13/v13.26/REPORT.md'
      - 'ResearchHistory/UQCF-GEM/v13/v13.08/REPORT.md'
      - 'ResearchHistory/UQCF-GEM/v13/v13.11/REPORT.md'
      - 'ResearchHistory/UQCF-GEM/demos/v13.27-gravity-progress/uqcf_demo/quantum.py'
      - 'ResearchHistory/UQCF-GEM/README.md'
      - 'ResearchHistory/UQCF-GEM/STATUS.md'
      - 'docs/superpowers/specs/2026-09-13-v1501-common-parent-representation-design.md'
      - 'docs/superpowers/plans/2026-09-13-v1501-common-parent-representation.md'
      - '.github/workflows/uqcf-v1501-common-parent-representation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Run v15.01 checker
        run: python CHECKER.py
