name: UQCF v15.01 Common-Parent Representation Audit RED Proof

on:
  push:
    branches:
      - research/v15.01-red-proof
    paths:
      - 'ResearchHistory/UQCF-GEM/v15/v15.01/**'
      - '.github/workflows/uqcf-v1501-common-parent-representation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Run v15.01 checker
        run: python CHECKER.py
