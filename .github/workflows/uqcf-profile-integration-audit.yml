name: UQCF profile integration audit
on:
  push:
    branches:
      - gpt/profile-receiver-signal
      - research/uqcf-overlapping-guard-exchange
    paths:
      - '.github/scripts/uqcf_profile_integration_*.py'
      - '.github/workflows/uqcf-profile-integration-audit.yml'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/profile_receiver_signal
      - name: Fetch immutable accepted, source and baseline commits
        run: |
          git fetch --filter=blob:none --depth=1 origin 3053f2a37c806372c4d0237893a6add0e03327b9 3ceb814258f43774b4af1352379ffcd0bd079599 433b3c2e9ffb34e08e34b425d5c56dc1b8a851cf 1905a492669c777c1b4df5a53ecccd254b0f7de5 a84d4f358c39d4e36aa747b4f7fc16b905bae07a
      - name: Reject corrupted and incomplete evidence
        run: python3 .github/scripts/uqcf_profile_integration_tests.py
      - name: Recheck inherited 18-source integrity without model call
        run: python3 .github/scripts/uqcf_profile_signal_review.py integrity
      - name: Verify unchanged accepted bytes and complete integration scope
        run: python3 .github/scripts/uqcf_profile_integration_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-integration-audit-${{ github.run_attempt }}
          path: |
            profile_integration_audit
            profile_signal_review
          if-no-files-found: error
          retention-days: 90
