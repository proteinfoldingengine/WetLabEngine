name: UQCF v15.06 Recoverability Multiplicativity Boundary

on:
  push:
    branches:
      - research/v15.06-recoverability-multiplicativity-boundary
      - main
    paths:
      - 'ResearchHistory/UQCF-GEM/v15/v15.06/**'
      - 'ResearchHistory/UQCF-GEM/v15/v15.05/**'
      - 'ResearchHistory/UQCF-GEM/v13/v13.16/**'
      - 'ResearchHistory/UQCF-GEM/v13/v13.22/**'
      - 'Tmp/TOE/Einstein Phase 1/V822_peer_review_packet/V818_THEOREM_SHAPE_ACCESSIBILITY_LAW.md'
      - 'Tmp/TOE/Einstein Phase 1/V824_accessibility_curvature_paper_python_proof/accessibility_curvature_proof.py'
      - 'ResearchHistory/UQCF-GEM/README.md'
      - 'ResearchHistory/UQCF-GEM/STATUS.md'
      - '.github/workflows/uqcf-v1506-recoverability-multiplicativity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/v15/v15.06
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Run v15.06 checker
        run: python CHECKER.py
