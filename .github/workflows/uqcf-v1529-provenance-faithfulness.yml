name: UQCF v15.29 Provenance Faithfulness and GitHub Delivery
on:
  push:
    branches: [research/v15.29-provenance-faithfulness]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.29-provenance-faithfulness/**'
      - 'docs/superpowers/specs/2026-09-14-v1529-provenance-faithfulness-source-extension-design.md'
      - 'docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension.md'
      - 'docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension-review.md'
      - '.github/workflows/uqcf-v1529-provenance-faithfulness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Verify additive scope and run 574 selected tests
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          scientific='42244310b065f473c8bd459a6f065a61afbd2292'
          delivery='192421c6744d3e322eaaca068e6a368cd1340aaa'
          v1528_tag='uqcf-gem-v15.28-34892900423-a1'
          root=Path('ResearchHistory/UQCF-GEM')
          demo=root/'demos/v15.29-provenance-faithfulness'
          allowed_docs={
            'docs/superpowers/specs/2026-09-14-v1529-provenance-faithfulness-source-extension-design.md',
            'docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension.md',
            'docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension-review.md',
            '.github/workflows/uqcf-v1529-provenance-faithfulness.yml',
          }
          subprocess.run(['git','merge-base','--is-ancestor',delivery,'HEAD'],check=True)
          assert subprocess.check_output(['git','rev-parse',v1528_tag+'^{commit}'],text=True).strip()==delivery
          scientific_pins={
            'ResearchHistory/UQCF-GEM/demos/v15.28-coupling-space/README.md':'1ea6c653dd45b2c01da1bb5a09f629bd2d12e67d',
            'ResearchHistory/UQCF-GEM/demos/v15.28-coupling-space/docs/RESULTS.json':'6d1ed9766d89c2f66d072978a8fa4b60bedccb39',
            'ResearchHistory/UQCF-GEM/demos/v15.28-coupling-space/exact_linear.py':'05cc1b8cfec70d501408377b5e44190b259a4514',
            'ResearchHistory/UQCF-GEM/demos/v15.28-coupling-space/representation_actions.py':'7260147cd6ca47ec21634172b44b98de726904af',
          }
          for path,blob in scientific_pins.items():
              assert subprocess.check_output(['git','rev-parse',f'{scientific}:{path}'],text=True).strip()==blob,(path,blob)
          for line in subprocess.check_output(['git','diff','--name-status',delivery,'HEAD'],text=True).splitlines():
              status,name=line.split('\t',1)
              assert status=='A',line
              assert name.startswith(str(demo)+'/') or name in allowed_docs,name
          logs=demo/'evidence/ci';logs.mkdir(parents=True,exist_ok=True)
          suites=[
            ('v15/v15.11',['test_continuity.py'],20),
            ('demos/v15.12-pretime-to-history',['test_simulation.py','test_presentation.py'],30),
            ('demos/v15.13-independent-events',['test_model.py','test_replay.py'],27),
            ('demos/v15.14-record-dependencies',['test_adaptive.py','test_replay.py'],30),
            ('demos/v15.15-coherent-records',['test_coherent.py','test_replay.py'],30),
            ('demos/v15.16-partial-pruning',['test_recoverability.py','test_replay.py'],33),
            ('demos/v15.17-retained-motion',['test_motion.py','test_replay.py'],32),
            ('demos/v15.18-invariant-completion',['test_completion.py','test_replay.py'],34),
            ('demos/v15.19-linear-prediction',['test_linear.py','test_replay.py'],36),
            ('demos/v15.20-physical-predictor',['test_channel.py','test_replay.py'],38),
            ('demos/v15.21-record-readout',['test_record_readout.py','test_readout_presentation.py'],32),
            ('demos/v15.22-event-sufficient-retention',['test_event_sufficiency.py','test_sufficiency_presentation.py'],32),
            ('demos/v15.23-sufficient-channel-family',['test_family.py','test_family_view.py'],32),
            ('demos/v15.24-composition-gate',['test_composition.py','test_composition_view.py'],30),
            ('demos/v15.25-pretime-gravity-canary',['test_canary.py','test_replay.py'],28),
            ('demos/v15.26-response-selector-rank',['test_selector.py','test_replay.py'],26),
            ('demos/v15.27-target-origin',['test_origin.py','test_replay.py'],27),
          ]
          prior=0
          for folder,files,count in suites:
              r=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=root/folder,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              (logs/(Path(folder).name+'.log')).write_text(r.stdout)
              print(folder,r.stdout[-220:],flush=True)
              assert r.returncode==0 and re.search(rf'Ran {count} tests? in',r.stdout) and re.search(r'^OK\s*$',r.stdout,re.M),(folder,r.stdout)
              prior+=count
          assert prior==517
          v1528=root/'demos/v15.28-coupling-space'
          old_files=['test_inventory.py','test_exact_linear.py','test_actions.py','test_solver.py','test_gate.py','test_replay.py']
          r=subprocess.run([sys.executable,'-m','unittest','-v',*old_files],cwd=v1528,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
          (logs/'v15.28-coupling-space.log').write_text(r.stdout)
          match=re.search(r'Ran (\d+) tests? in',r.stdout)
          assert r.returncode==0 and match and int(match.group(1))==35 and re.search(r'^OK\s*$',r.stdout,re.M),r.stdout
          inherited=prior+35
          assert inherited==552
          new_files=['test_inventory.py','test_fiber_model.py','test_equivalence.py','test_countermodels.py','test_action_audit.py','test_gate.py','test_replay.py']
          r=subprocess.run([sys.executable,'-m','unittest','-v',*new_files],cwd=demo,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
          (logs/'v15.29-provenance-faithfulness.log').write_text(r.stdout)
          match=re.search(r'Ran (\d+) tests? in',r.stdout)
          assert r.returncode==0 and match and int(match.group(1))==22 and re.search(r'^OK\s*$',r.stdout,re.M),r.stdout
          total=inherited+22
          assert total==574
          main_sha=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          summary={
            'source_sha':os.environ['GITHUB_SHA'],
            'scientific_source_sha':scientific,
            'delivery_base_sha':delivery,
            'main_sha_at_verify':main_sha,
            'v15_11_to_v15_27_tests_passed':prior,
            'v15_28_tests_passed':35,
            'inherited_selected_tests_passed':inherited,
            'v15_29_tests_passed':22,
            'selected_tests_passed':total,
            'scope':'Selected v15.11-v15.29 research regressions and exact v15.29 provenance gate; no coupling solver or gravity canary is executed by v15.29.'
          }
          (logs/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2),flush=True)
          PY
      - name: Reproduce provenance audit, inspector and movie
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.29-provenance-faithfulness
        run: |
          rm -rf outputs evidence/ci/model.log evidence/ci/render.log evidence/ci/video_decode.log evidence/ci/video_info.json
          python provenance_inventory.py --out /tmp/PROVENANCE_EVIDENCE.json
          cmp docs/PROVENANCE_EVIDENCE.json /tmp/PROVENANCE_EVIDENCE.json
          python source_extension_gate.py --out outputs > evidence/ci/model.log
          cmp docs/RESULTS.json outputs/verification.json
          python replay.py --out outputs --video > evidence/ci/render.log
          ffmpeg -v error -i outputs/provenance_faithfulness.mp4 -f null - 2> evidence/ci/video_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json outputs/provenance_faithfulness.mp4 > evidence/ci/video_info.json
          python -m compileall -q provenance_inventory.py fiber_model.py provenance_equivalence.py countermodels.py action_audit.py source_extension_gate.py replay.py test_*.py
          python - <<'PY'
          import json
          r=json.load(open('outputs/verification.json'))
          assert r['status']=='PROVENANCE_RELATION_TO_Q_FIBERS_NOT_ENTAILED'
          assert r['countermodels_survive'] is True
          assert r['extension_kernel_status']=='NOT_CERTIFIED'
          assert r['projection_to_q_certified'] is False
          assert r['natural_action_certified'] is False
          assert r['representation_ready'] is False
          assert r['coupling_solver_reopened'] is False
          assert r['new_source_semantics_axiom_added'] is False
          assert r['scientific_breakthrough'] is False
          assert r['signal_of_life'] is False
          assert r['gravity_canary_certified'] is False
          assert r['physical_gravity_derived'] is False
          assert r['next_required_object']=='INDEPENDENTLY_MOTIVATED_PROVENANCE_FIBER_RELATION'
          assert not any(r[k] for k in ('gravity_observables_evaluated','uses_holonomy_selector','uses_newton_or_gr','uses_metric_selector','uses_pruning','uses_entropy','uses_physical_time'))
          d=json.load(open('outputs/replay_data.json'))
          assert len(d['fibers'])==3 and all(x['same_q_as_root'] for x in d['fibers'])
          info=json.load(open('evidence/ci/video_info.json'))
          assert any(s.get('codec_name')=='h264' and s.get('width')==1280 and s.get('height')==720 for s in info['streams'])
          assert abs(float(info['format']['duration'])-24.0)<0.1
          PY
      - name: Package exact source data and fresh CI evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,sys,zipfile
          source=Path('ResearchHistory/UQCF-GEM/demos/v15.29-provenance-faithfulness')
          dist=Path('delivery/assets');dist.mkdir(parents=True,exist_ok=True)
          for name in ['provenance_faithfulness.mp4','provenance_faithfulness.html','verification.json','replay_data.json']:
              shutil.copyfile(source/'outputs'/name,dist/name)
          shutil.copyfile(source/'README.md',dist/'REPORT.md')
          summary=json.loads((source/'evidence/ci/SUMMARY.json').read_text())
          verification=json.loads((source/'outputs/verification.json').read_text())
          provenance={
            'source_sha':os.environ['GITHUB_SHA'],
            'scientific_source_sha':summary['scientific_source_sha'],
            'delivery_base_sha':summary['delivery_base_sha'],
            'main_sha_at_verify':summary['main_sha_at_verify'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'inherited_selected_tests_passed':summary['inherited_selected_tests_passed'],
            'v15_29_tests_passed':summary['v15_29_tests_passed'],
            'selected_tests_passed':summary['selected_tests_passed'],
            'status':verification['status'],
            'inventory_hash':verification['inventory_hash'],
            'python':sys.version,
            'packages':subprocess.check_output([sys.executable,'-m','pip','freeze'],text=True).splitlines(),
            'scope':'Fresh CI provenance-faithfulness classification. v15.29 does not reopen the coupling solver and evaluates no gravity canary or gravity observable.'
          }
          (dist/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n')
          files=[]
          for p in sorted(source.rglob('*')):
              if p.is_symlink(): raise ValueError('symlink rejected')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc': files.append(p)
          extra=[
            Path('docs/superpowers/specs/2026-09-14-v1529-provenance-faithfulness-source-extension-design.md'),
            Path('docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension.md'),
            Path('docs/superpowers/plans/2026-09-14-v1529-provenance-faithfulness-source-extension-review.md'),
            Path('.github/workflows/uqcf-v1529-provenance-faithfulness.yml'),
          ]
          archive=[]
          entries=[]
          for p in files:
              arc=p.relative_to(source).as_posix(); archive.append((p,arc))
              entries.append({'archive':arc,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          for p in extra:
              arc=p.as_posix(); archive.append((p,arc))
              entries.append({'archive':arc,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len({e['archive'] for e in entries})==len(entries)
          manifest={'files':entries,'provenance':provenance}
          bundle=dist/'UQCF_GEM_v15_29_bundle.zip'
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p,arc in archive: z.write(p,arc)
              z.writestr('PACKAGE_MANIFEST.json',json.dumps(manifest,indent=2,sort_keys=True))
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              assert json.loads(z.read('PACKAGE_MANIFEST.json'))==manifest
              for e in entries:
                  raw=z.read(e['archive'])
                  assert len(raw)==e['bytes']
                  assert hashlib.sha256(raw).hexdigest()==e['sha256']
          sums=''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(dist.iterdir()))
          (dist/'SHA256SUMS.txt').write_text(sums)
          expected={'provenance_faithfulness.mp4','provenance_faithfulness.html','verification.json','replay_data.json','REPORT.md','PROVENANCE.json','UQCF_GEM_v15_29_bundle.zip','SHA256SUMS.txt'}
          assert {p.name for p in dist.iterdir()}==expected
          notes=(
            '# v15.29 — Pre-time provenance faithfulness / source-extension gate\n\n'
            f"Exact source: `{os.environ['GITHUB_SHA']}`. All {summary['selected_tests_passed']} selected tests passed before packaging.\n\n"
            'Verdict: PROVENANCE_RELATION_TO_Q_FIBERS_NOT_ENTAILED. Exact q-fibers exist, but the frozen provenance ontology does not select a unique provenance relation inside those fibers; collapsed and distinguishing countermodels survive over the same frozen reduct.\n\n'
            'No source-extension kernel, natural provenance action, or representation-ready carrier is certified. The v15.28 coupling solver was not reopened, no coupling member was selected, and no gravity canary or gravity observable was evaluated. The next required object is an independently motivated provenance-fiber relation.\n\n'
            'Includes report, MP4/offline HTML, exact ledger, replay data, source/fresh-CI evidence bundle, provenance and checksums. All eight release assets are verified by size and SHA-256 before publication. No merge to main.\n'
          )
          Path('delivery/RELEASE_NOTES.md').write_text(notes)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.29-verified-delivery
          path: delivery/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-verified-delivery
          path: delivery
      - name: Upload unique draft verify digests then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'proteinfoldingengine/WetLabEngine'
          TAG="uqcf-gem-v15.29-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" delivery/assets/* --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'UQCF-GEM v15.29 — provenance faithfulness gate' --notes-file delivery/RELEASE_NOTES.md --draft --prerelease --latest=false
          RELEASE_ID="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > delivery/RELEASE_METADATA.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('delivery/RELEASE_METADATA.json').read_text())
          local=list(Path('delivery/assets').iterdir());remote={a['name']:a for a in data['assets']}
          assert len(local)==len(remote)==8
          for path in local:
              asset=remote[path.name]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=false > delivery/PUBLICATION_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('delivery/PUBLICATION_RECEIPT.json').read_text())
          assert data['draft'] is False and len(data['assets'])==8
          print(data['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.29-publication-receipt
          path: delivery/PUBLICATION_RECEIPT.json
          if-no-files-found: error
  post-publication-verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-verified-delivery
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-publication-receipt
          path: receipt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install browser verifier
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          command -v google-chrome >/dev/null || command -v chromium >/dev/null
      - name: Exercise offline inspector and fully decode published bytes
        run: |
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from playwright.sync_api import sync_playwright
          assets=Path('delivery/assets')
          for line in (assets/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((assets/name).read_bytes()).hexdigest()==digest
          browser_path=shutil.which('google-chrome') or shutil.which('chromium')
          assert browser_path
          uri=(assets/'provenance_faithfulness.html').resolve().as_uri()
          page_errors=[];console_errors=[];external=[];results={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=browser_path)
              page=browser.new_page()
              page.on('pageerror',lambda exc: page_errors.append(str(exc)))
              page.on('console',lambda msg: console_errors.append(msg.text) if msg.type=='error' else None)
              page.on('request',lambda req: external.append(req.url) if req.url.startswith(('http://','https://')) else None)
              for width in (1280,820,390):
                  page.set_viewport_size({'width':width,'height':900})
                  page.goto(uri,wait_until='load')
                  fibers=page.evaluate('window.__demo.data.fibers.map(x=>x.key)')
                  exercised=[]
                  for fiber in fibers:
                      page.evaluate('(k)=>window.__demo.chooseFiber(k)',fiber)
                      for view in ('fiber','action','gate'):
                          page.evaluate('(k)=>window.__demo.chooseView(k)',view)
                          assert page.locator('#status').inner_text().strip()
                          exercised.append([fiber,view])
                  overflow=page.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth')
                  assert not overflow
                  results[str(width)]={'fibers':fibers,'exercised':exercised,'horizontal_overflow':overflow}
              browser.close()
          assert not page_errors,page_errors
          assert not console_errors,console_errors
          assert not external,external
          receipt=json.loads(Path('receipt/PUBLICATION_RECEIPT.json').read_text())
          assert receipt['draft'] is False and len(receipt['assets'])==8
          out={'passed':True,'widths':[1280,820,390],'results':results,'page_errors':page_errors,'console_errors':console_errors,'external_requests':external,'native_ipad_safari_tested':False,'release_url':receipt['html_url']}
          Path('evidence/browser_evidence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          ffmpeg -v error -i delivery/assets/provenance_faithfulness.mp4 -f null - 2> evidence/video_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json delivery/assets/provenance_faithfulness.mp4 > evidence/video_info.json
          python - <<'PY'
          import json
          info=json.load(open('evidence/video_info.json'))
          assert any(s.get('codec_name')=='h264' and s.get('width')==1280 and s.get('height')==720 for s in info['streams'])
          assert abs(float(info['format']['duration'])-24.0)<0.1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.29-browser-video-evidence
          path: evidence/
          if-no-files-found: error
  final-receipt:
    needs: post-publication-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-verified-delivery
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-publication-receipt
          path: receipt
      - uses: actions/download-artifact@v4
        with:
          name: v15.29-browser-video-evidence
          path: evidence
      - name: Verify PR and main boundary then record receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'proteinfoldingengine/WetLabEngine'
          gh api "repos/$GH_REPO/pulls/25" > delivery/PR_STATE.json
          gh api "repos/$GH_REPO/branches/main" > delivery/MAIN_STATE.json
          python - <<'PY'
          from pathlib import Path
          import json,os
          provenance=json.loads(Path('delivery/assets/PROVENANCE.json').read_text())
          pr=json.loads(Path('delivery/PR_STATE.json').read_text())
          main=json.loads(Path('delivery/MAIN_STATE.json').read_text())
          pub=json.loads(Path('receipt/PUBLICATION_RECEIPT.json').read_text())
          browser=json.loads(Path('evidence/browser_evidence.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged_at'] is None
          assert pr['head']['sha']==os.environ['GITHUB_SHA']
          assert pr['base']['sha']==provenance['delivery_base_sha']
          assert main['commit']['sha']==provenance['main_sha_at_verify']
          assert pub['draft'] is False and len(pub['assets'])==8
          assert browser['passed'] is True and browser['external_requests']==[] and browser['native_ipad_safari_tested'] is False
