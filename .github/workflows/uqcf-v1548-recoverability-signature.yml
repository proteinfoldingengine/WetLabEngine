name: UQCF v15.48 recoverability signature
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.48-recoverability-signature-completeness/**'
      - '.github/workflows/uqcf-v1548-recoverability-signature.yml'
permissions: {contents: read}
jobs:
  signature:
    runs-on: ubuntu-24.04
    env: {PYTHONHASHSEED: '0'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Complete v15.48 suite and inherited regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ResearchHistory/UQCF-GEM/demos/v15.48-recoverability-signature-completeness
          python -m unittest -v test_signature_contract test_verify_type_obstruction test_gate
          cd ../v15.47-cross-domain-representation-functoriality
          python -m unittest -q test_functor_contract test_functor_candidates test_functor_classes test_verify_functoriality test_gate
          cd ../v15.46-primitive-joint-source-admissibility
          export PYTHONPATH="$PWD/exploratory"
          python -m unittest -q test_evidence_preflight test_native_record_trace test_native_record_search test_stage_c_contract test_stage_c_representations test_stage_c_nonuniqueness test_stage_c_verify test_stage_c_gate test_typing_probe
      - name: Replay v15.48 result
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.48-recoverability-signature-completeness').resolve()
          sys.path.insert(0,str(d))
          import signature_contract as sc, verify_type_obstruction as vt, gate
          root=d.parents[3]; c=sc.load_contract(root); v=vt.verify(root,c); r=gate.adjudicate(c,v)
          assert gate.canonical_bytes(r)==(d/'docs/RESULTS.json').read_bytes()
          print('V1548_RESULT_REPLAY_PASS')
          PY
          python -m compileall -q ResearchHistory/UQCF-GEM/demos/v15.48-recoverability-signature-completeness
      - name: Exact-head preservation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.44-intrinsic-curvature-interpretation)" = d37f88b98d38aad864e22146ad7dcd2d00f89cd4
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary)" = 775e5549303c1276d3458ec34b553a604436bf0f
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "V1548_VERIFIED_HEAD $GITHUB_SHA"
