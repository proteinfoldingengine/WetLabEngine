name: v16.48 prospective recursive contract RED
on:
  push:
    branches: [research/v16.48-recursive-chain-repair]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/test_*red*.py', '.github/workflows/v16.48-red.yml']
permissions: {contents: read}
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Observe both expected assertions before implementation
        run: |
          mkdir -p out
          set +e
          python ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/test_red_contract.py > out/coverage.log 2>&1
          coverage_rc=$?
          python ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/test_recursive_red.py > out/recursive.log 2>&1
          recursive_rc=$?
          set -e
          test "$coverage_rc" = 1
          test "$recursive_rc" = 1
          grep -q 'AssertionError: ValueError not raised' out/coverage.log
          grep -q "AssertionError: None is not an instance of <class 'list'>" out/recursive.log
          git rev-parse HEAD > out/HEAD
          sha256sum ResearchHistory/UQCF-GEM/demos/v16.48-recursive-chain-repair/PREREGISTRATION.md > out/PROTOCOL.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1648-prospective-red', path: out, if-no-files-found: error}
