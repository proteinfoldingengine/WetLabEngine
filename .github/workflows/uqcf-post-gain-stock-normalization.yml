name: Verify matched post-gain stock normalization
on:
  push:
    branches: [gpt/post-gain-stock-normalization-review]
    paths:
      - ".github/workflows/uqcf-post-gain-stock-normalization.yml"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization/RESULT.md"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization/replay.py"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization/review.py"
      - "ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization/expected.json"
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization
  DEMOS: ResearchHistory/UQCF-GEM/demos
jobs:
  replay-review-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/post_gain_stock_normalization/
            /ResearchHistory/UQCF-GEM/demos/v16.50-recursive-binary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.51-ternary-interface/evidence/reproduction/scientific/CERTIFICATE.json.gz
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay unchanged stock producers and controls
        run: |
          set -euo pipefail
          mkdir evidence
          PYTHONHASHSEED=91 python -B "$SCI/replay.py" "$DEMOS" > evidence/replay.json
          cmp "$SCI/expected.json" evidence/replay.json
          PYTHONHASHSEED=17 python -B "$SCI/replay.py" "$DEMOS" | cmp - evidence/replay.json
      - name: Obtain independent review of complete scoped argument
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -B "$SCI/review.py" review evidence
      - name: Audit request, original response and reproducibility
        run: |
          set -euo pipefail
          python -B "$SCI/review.py" audit evidence | tee evidence/audit.log
          cp "$SCI"/{RESULT.md,expected.json,replay.py,review.py} evidence/
          (cd evidence && sha256sum *.md *.py *.json *.txt *.log > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post-gain-stock-normalization-review
          path: evidence
          if-no-files-found: error
