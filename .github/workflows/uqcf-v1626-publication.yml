name: UQCF v16.26 durable publication
on:
  push:
    branches: [research/v16.26-consistency-increment-law]
    paths: ['.github/workflows/uqcf-v1626-publication.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    env: {P: ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Fresh reproduce and bind GREEN
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/proteinfoldingengine/WetLabEngine/actions/artifacts/11053828764/zip > /tmp/g.zip
          echo '31db1e259968eaf8c4ea0e0a57ce753a0f8df4d08b59e2a65fb84f3eb9f29615  /tmp/g.zip' | sha256sum -c -
          unzip -q /tmp/g.zip -d /tmp/g
          cd "$P"; python test_gate.py; python engine.py; python verify.py
          cmp evidence/PRODUCTION.json "$GITHUB_WORKSPACE"/tmpdoesnotexist 2>/dev/null || true
          cmp evidence/PRODUCTION.json /tmp/g/PRODUCTION.json
          cmp evidence/VERIFICATION.json /tmp/g/VERIFICATION.json
          cd "$GITHUB_WORKSPACE"
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
      - name: Commit publication evidence
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ['P']);v=json.loads((p/'evidence/VERIFICATION.json').read_text())
          e={'version':'16.26','scientific_run':36614522299,'scientific_job':109564014351,'scientific_sha':'28bbd88f6b3c5da48540d400c45485ccda3d4452','publication_run':os.environ['GITHUB_RUN_ID'],'publication_head':os.environ['GITHUB_SHA'],'fresh_bytes_equal':True,'artifact_id':11053828764,'artifact_sha256':'31db1e259968eaf8c4ea0e0a57ce753a0f8df4d08b59e2a65fb84f3eb9f29615','verification':v,'review':'self-reviewed; independent verifier; no separate reviewer'}
          (p/'PUBLICATION_EVIDENCE.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P/evidence" "$P/PUBLICATION_EVIDENCE.json"
          git commit -m 'v16.26 publish verified evidence [skip ci]'
          git push origin HEAD:refs/heads/research/v16.26-consistency-increment-law
