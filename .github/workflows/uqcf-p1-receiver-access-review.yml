name: UQCF P1 receiver-access whole-argument review

on:
  pull_request:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - '.github/scripts/uqcf_p1_receiver_access_*.py'
      - '.github/workflows/uqcf-p1-receiver-access-review.yml'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/p1_receiver_access_review/**'

permissions:
  contents: read

env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}

concurrency:
  group: uqcf-p1-receiver-access-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Verify exact corrected argument and immutable source readback
        run: python3 .github/scripts/uqcf_p1_receiver_access_review.py integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-receiver-access-integrity-${{ github.run_attempt }}
          path: p1_receiver_access_review
          if-no-files-found: error
          retention-days: 90

  argument-review:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p1-receiver-access-integrity-${{ github.run_attempt }}
          path: p1_receiver_access_review
      - name: Independent whole-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_p1_receiver_access_review.py review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-receiver-access-review-${{ github.run_attempt }}
          path: p1_receiver_access_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    needs: [integrity, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p1-receiver-access-review-${{ github.run_attempt }}
          path: p1_receiver_access_review
      - name: Separate raw-response publication audit
        run: python3 .github/scripts/uqcf_p1_receiver_access_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-receiver-access-publication-${{ github.run_attempt }}
          path: p1_receiver_access_publication
          if-no-files-found: error
          retention-days: 90
