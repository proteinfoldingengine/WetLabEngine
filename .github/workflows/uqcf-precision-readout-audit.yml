name: UQCF v16.00 precision readout audit
on:
  push:
    branches: [research/v16.00-precision-readout-audit]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/precision-readout-audit/**'
      - '.github/workflows/uqcf-precision-readout-audit.yml'
  workflow_dispatch:
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - run: git rev-parse HEAD | tee execution_head.txt
      - name: Frozen tests and measurement
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/precision-readout-audit
          set +e
          python -m unittest -v test_gate 2>&1 | tee test.log
          test_status=$?
          if [ ! -f gate.py ]; then exit "$test_status"; fi
          python gate.py > result.json
          gate_status=$?
          set -e
          python -c 'import json; r=json.load(open("result.json")); print(json.dumps({k:r[k] for k in ["version","all_valid","verdict","recovery_predicate"]},indent=2))'
          sha256sum PREREGISTRATION.md DERIVATION.md test_gate.py gate.py result.json | tee SHA256SUMS
          test "$test_status" -eq 0
          test "$gate_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-readout-audit-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/precision-readout-audit/
