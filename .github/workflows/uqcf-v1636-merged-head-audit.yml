name: UQCF v16.36 merged-head final audit
on:
  push:
    branches: [research/v16.34-fiber-component-invariant]
    paths: ['.github/workflows/uqcf-v1636-merged-head-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce4f0c0396fc4a763e5fac1826c180df599d9a00
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Audit actual merged commit
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          EXPECTED='ce4f0c0396fc4a763e5fac1826c180df599d9a00'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert head==EXPECTED,(head,EXPECTED)
          p=pathlib.Path('ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure')
          for f in ['PROOFS.md','PUBLICATION_EVIDENCE.json','PROOF_CLOSURE_EVIDENCE.json','PAIR_COMPLETENESS_EVIDENCE.json','PRODUCTION.json','verifier.py','test_gate.py']:assert (p/f).exists(),f
          d=json.loads((p/'PRODUCTION.json').read_text());assert d['gate_d']=='UNRESOLVED';assert d['gate_e']['tested_cases']==27 and d['gate_e']['excluded']==[] and d['gate_e']['ultrametric_violations']==0
          pc=json.loads((p/'PAIR_COMPLETENESS_EVIDENCE.json').read_text());assert pc['full_inherited_stack'] is True
          sys.path.insert(0,str(p.resolve()));import producer,verifier
          fresh=producer.produce(4);r=verifier.verify_document(fresh);assert r['execution_status']=='COMPLETED';assert len(fresh['pairs'])==18
          print({'merged_head':head,'canonical_pairs':18,'gate_d':fresh['gate_d'],'gate_e':fresh['gate_e'],'audit':'PASS'})
          PY
      - name: Full inherited foundational stack on merge
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.34-fiber-component-invariant/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.33-consistency-quotient-kernel/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
