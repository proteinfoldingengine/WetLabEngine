name: UQCF fixed-operand role-transfer consumer review
on:
  push:
    branches: [gpt/two-feature-receiver-signal]
    paths:
      - '.github/scripts/uqcf_role_transfer_*.py'
      - '.github/workflows/uqcf-role-transfer-review.yml'
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
concurrency:
  group: uqcf-role-transfer-review
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/role_transfer_consumer
      - name: Verify frozen proof, full source identities and exact excerpts
        run: python3 .github/scripts/uqcf_role_transfer_review.py integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: role-transfer-integrity-${{ github.run_attempt }}
          path: role_transfer_review
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/research/physical-bridge/role_transfer_consumer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: role-transfer-integrity-${{ github.run_attempt }}
          path: role_transfer_review
      - name: Independent full-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_role_transfer_review.py review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: role-transfer-review-${{ github.run_attempt }}
          path: role_transfer_review
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: [integrity, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: role-transfer-review-${{ github.run_attempt }}
          path: role_transfer_review
      - name: Separate immutable source and raw-response audit
        run: python3 .github/scripts/uqcf_role_transfer_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: role-transfer-publication-${{ github.run_attempt }}
          path: role_transfer_publication
          if-no-files-found: error
          retention-days: 90


