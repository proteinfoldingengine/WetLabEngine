name: v16.49 fork-of-chains interface theorem
on:
  push:
    branches: [research/v16.49-fork-chain-interface, research/v16.34-fiber-component-invariant]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/**', '.github/workflows/v16.49-fork-chain-interface.yml']
permissions: {contents: read}
concurrency:
  group: v1649-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py preflight out/preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1649-preflight-${{ github.sha }}', path: out/preflight, if-no-files-found: error}
  science:
    needs: preflight
    if: github.ref_name == 'research/v16.49-fork-chain-interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py phase out/science
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py package out/science science
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1649-science-${{ github.sha }}', path: out/science, if-no-files-found: error}
  publication:
    needs: preflight
    if: github.ref_name == 'research/v16.49-fork-chain-interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py phase out/reproduction
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py package out/reproduction publication
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1649-publication-${{ github.sha }}', path: out/reproduction, if-no-files-found: error}
  publish_evidence:
    needs: [science, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py download "$GITHUB_RUN_ID" out/download science
        env: {GH_TOKEN: '${{ github.token }}'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py download "$GITHUB_RUN_ID" out/fresh publication
        env: {GH_TOKEN: '${{ github.token }}'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py stage_reproduction
      - name: Publish verified evidence
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface
          git commit -m 'publish v16.49 independently reproduced fork-of-chains campaign'
          git push origin HEAD:research/v16.49-fork-chain-interface
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/research/v16.49-fork-chain-interface | cut -f1)"
          python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with: {name: 'v1649-publication-failure-${{ github.sha }}', path: out, if-no-files-found: warn}
  post_merge:
    needs: preflight
    if: github.ref_name == 'research/v16.34-fiber-component-invariant'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py verify
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py phase out/merge
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/run.py package out/merge post_merge
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1649-post_merge-${{ github.sha }}', path: out/merge, if-no-files-found: error}
  receipt:
    needs: post_merge
    if: github.ref_name == 'research/v16.34-fiber-component-invariant'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, actions: read, pull-requests: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 64}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python ResearchHistory/UQCF-GEM/demos/v16.49-fork-chain-interface/publish.py receipt "$GITHUB_RUN_ID" out/receipt 97
        env: {GH_TOKEN: '${{ github.token }}'}
      - name: Commit verified receipt on separate branch
        run: |
          set -euo pipefail
          git switch -c research/v16.49-audit-receipt
          mkdir -p ResearchHistory/UQCF-GEM/audits/v16.49
          cp -a out/receipt ResearchHistory/UQCF-GEM/audits/v16.49/"$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ResearchHistory/UQCF-GEM/audits/v16.49
          git commit -m 'record v16.49 verified actual-merge closure receipt'
          git push origin HEAD:research/v16.49-audit-receipt
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/research/v16.49-audit-receipt | cut -f1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1649-receipt-${{ github.sha }}', path: out/receipt, if-no-files-found: error}
