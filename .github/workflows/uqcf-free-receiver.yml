name: Verify unrestricted receiver histories, chart 12 thresholds and the single-state caller
on:
  push:
    branches: [gpt/geometry-depth-two-proof]
    paths:
      - '.github/workflows/uqcf-free-receiver.yml'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/*free_receiver*.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/FREE_RECEIVER.md'
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths
  HIST: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  P: ResearchHistory/UQCF-GEM/foundational-closure-verification
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &science_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/*.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/FREE_RECEIVER*.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/geometry_recovery_paths/free_receiver*.json*
      - &history_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          path: review_sources
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/demos/v16.*-*/*.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_geometry_repair.py
      - &setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reconstruct full languages, both root spectra, historical dispatch and minimum words
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          mkdir replay
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > replay/install.log
          python "$SCI/check_free_receiver_words.py" review_sources replay | tee replay/check_words.log
          python "$SCI/verify_free_receiver_words.py" replay | tee replay/verify_words.log
          python "$SCI/check_free_receiver_chart12.py" review_sources replay | tee replay/check_chart12.log
          python "$SCI/verify_free_receiver_chart12.py" review_sources replay | tee replay/verify_chart12.log
          python "$SCI/check_free_receiver_caller.py" review_sources replay | tee replay/check_caller.log
          python "$SCI/verify_free_receiver_caller.py" review_sources replay | tee replay/verify_caller.log
          python "$SCI/check_free_receiver_threshold.py" review_sources replay | tee replay/check_threshold.log
          python "$SCI/verify_free_receiver_threshold.py" review_sources replay | tee replay/verify_threshold.log
          for output in "$SCI"/free_receiver_*.json*; do
            cmp "$output" replay/"${output##*/}"
          done
          cp "$SCI"/{FREE_RECEIVER*.md,*free_receiver*.py} replay/
          git rev-parse HEAD > replay/science-head.txt
          git -C review_sources rev-parse HEAD > replay/historical-head.txt
          (cd replay && sha256sum *.py *.md *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-receiver-replay
          path: replay
          if-no-files-found: error
  argument-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *science_checkout
      - *history_checkout
      - name: Independently challenge the frozen argument
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_free_receiver.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-receiver-review
          path: review_evidence
          if-no-files-found: error
  foundational-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e61d5b0e827f7b412824ad46021e2ad6cc6f7875
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/
            /ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/
            /ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce the inherited foundational tests and complete certificate family
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIST"
          mkdir -p foundation
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > foundation/install.log
          git rev-parse HEAD > foundation/inherited-head.txt
          echo "$GITHUB_SHA" > foundation/workflow-head.txt
          python --version > foundation/python-version.txt
          (cd "$P" && python tests/test_fcv.py) 2>&1 | tee foundation/tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction && python -m unittest -v test_pruning_consistency_audit) 2>&1 | tee foundation/parent-tests.log
          (cd ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent && python -m unittest -v && python gate.py) 2>&1 | tee foundation/historical.log
          cp ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent/result.json "$P/evidence/REPRODUCED_1615F.json"
          (cd "$P" && python produce_certificates.py) 2>&1 | tee foundation/producer.log
          (cd "$P" && python verify_certificates.py) 2>&1 | tee foundation/verifier.log
          cp "$P"/evidence/{PRODUCTION,VERIFICATION,TEST_RECEIPT,REPRODUCED_1615F}.json "$P/evidence/certificates.json.xz" foundation/
          test "$(xz -dc foundation/certificates.json.xz | sha256sum | cut -d' ' -f1)" = 21357bdc79429f9d4214024b125e75693609a2538a08a57037978b191ab432c6
          (cd foundation && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-receiver-foundation
          path: foundation
          if-no-files-found: error
  publication:
    needs: [replay, argument-review, foundational-regression]
    if: ${{ always() && needs.replay.result == 'success' && needs.foundational-regression.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *science_checkout
      - *history_checkout
      - *setup_python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: free-receiver-replay
          path: replay
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: free-receiver-foundation
          path: foundation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: free-receiver-review
          path: review_evidence
      - name: Reproduce scientific bytes and read back the exact external review status
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          test "$(git -C review_sources rev-parse HEAD)" = "$HIST"
          (cd replay && sha256sum -c SHA256SUMS)
          (cd foundation && sha256sum -c SHA256SUMS)
          mkdir publication
          python -m pip install sympy==1.13.3 mpmath==1.3.0 > publication/install.log
          python "$SCI/check_free_receiver_words.py" review_sources publication | tee publication/check_words.log
          python "$SCI/verify_free_receiver_words.py" publication | tee publication/verify_words.log
          python "$SCI/check_free_receiver_chart12.py" review_sources publication | tee publication/check_chart12.log
          python "$SCI/verify_free_receiver_chart12.py" review_sources publication | tee publication/verify_chart12.log
          python "$SCI/check_free_receiver_caller.py" review_sources publication | tee publication/check_caller.log
          python "$SCI/verify_free_receiver_caller.py" review_sources publication | tee publication/verify_caller.log
          python "$SCI/check_free_receiver_threshold.py" review_sources publication | tee publication/check_threshold.log
          python "$SCI/verify_free_receiver_threshold.py" review_sources publication | tee publication/verify_threshold.log
          for output in replay/free_receiver_*.json*; do
            cmp "$output" publication/"${output##*/}"
          done
          python "$SCI/review_free_receiver.py" audit review_evidence
          cp review_evidence/publication_audit.json foundation/VERIFICATION.json publication/
          echo "$UQCF_WORKFLOW_SHA" > publication/workflow-head.txt
          (cd publication && sha256sum *.json *.xz *.log *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-receiver-publication
          path: publication
          if-no-files-found: error
