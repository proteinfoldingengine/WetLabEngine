name: Verify P1 leaf removal in the archived order curvature reader
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-p1-order-curvature.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_p1_order_curvature.py
            /Tmp/TOE/package17_bundle/spatial_graph_curvature_verifier.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
      - name: Replay the typed event and rebuild the complete spatial slice
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_p1_order_curvature.py" handoff > handoff/replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-order-curvature-replay
          path: handoff
          if-no-files-found: error


  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_p1_order_curvature.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/P1_ORDER_CURVATURE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_p1_order_curvature.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p1-order-curvature-replay
          path: handoff
      - name: Independently adjudicate the mathematical and software claims
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_p1_order_curvature.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-order-curvature-review
          path: review_evidence
          if-no-files-found: error


  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/check_p1_order_curvature.py
            /Tmp/TOE/package17_bundle/spatial_graph_curvature_verifier.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/P1_ORDER_CURVATURE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_p1_order_curvature.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/review_common_field.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p1-order-curvature-replay
          path: earlier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p1-order-curvature-review
          path: review_evidence
      - name: Verify the exact replay bytes and read back the independent review
        run: |
          test "$(git rev-parse HEAD)" = "$UQCF_WORKFLOW_SHA"
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_p1_order_curvature.py" handoff > handoff/replay.json
          diff -r earlier handoff
          python3 "$SCI/review_p1_order_curvature.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-order-curvature-publication
          path: |
            handoff/replay.json
            review_evidence/publication_audit.json
          if-no-files-found: error
