name: UQCF-GEM C3 fresh-probe publication audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uqcf-gem-c3-fresh-probe-publication-audit.yml'
      - '.github/scripts/c3_fresh_probe_publication_audit.py'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v4
        with:
          ref: 22d00388f2e64d24ebafe123e513627b10b8446e
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Reconcile original archives and independently audit publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/c3_fresh_probe_publication_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-fresh-probe-publication
          path: fresh_probe_publication/
          retention-days: 30
