name: UQCF v15.21 Record Readout and GitHub Delivery
on:
  push:
    branches: [research/v15.21-record-readout]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.21-record-readout/**'
      - '.github/workflows/uqcf-v1521-record-readout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Verify source scope and all 342 selected tests
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          base='7b6459f18b0add90a2f88cf9b0a152e2aa5c7647'
          root=Path('ResearchHistory/UQCF-GEM');demo=root/'demos/v15.21-record-readout'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--',str(root)],text=True).splitlines()
          assert all(x.startswith(str(demo)+'/') or x==str(root/'GITHUB_DELIVERY_POLICY.md') for x in changed),changed
          suites=[('v15/v15.11',['test_continuity.py'],20),('demos/v15.12-pretime-to-history',['test_simulation.py','test_presentation.py'],30),('demos/v15.13-independent-events',['test_model.py','test_replay.py'],27),('demos/v15.14-record-dependencies',['test_adaptive.py','test_replay.py'],30),('demos/v15.15-coherent-records',['test_coherent.py','test_replay.py'],30),('demos/v15.16-partial-pruning',['test_recoverability.py','test_replay.py'],33),('demos/v15.17-retained-motion',['test_motion.py','test_replay.py'],32),('demos/v15.18-invariant-completion',['test_completion.py','test_replay.py'],34),('demos/v15.19-linear-prediction',['test_linear.py','test_replay.py'],36),('demos/v15.20-physical-predictor',['test_channel.py','test_replay.py'],38),('demos/v15.21-record-readout',['test_record_readout.py','test_readout_presentation.py'],32)]
          logs=demo/'evidence/ci';logs.mkdir(parents=True);total=0
          for folder,files,count in suites:
              r=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=root/folder,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=120)
              (logs/(Path(folder).name+'.log')).write_text(r.stdout)
              print(folder,r.stdout[-250:],flush=True)
              assert r.returncode==0,(folder,r.stdout)
              assert re.search(rf'Ran {count} tests? in',r.stdout),folder
              total+=count
          assert total==342
          (logs/'SUMMARY.json').write_text(json.dumps({'selected_tests_passed':total,'source_sha':os.environ['GITHUB_SHA'],'scope':'selected research regressions, not the full repository suite'},indent=2))
          PY
      - name: Reproduce full numerical ledger and viewing assets
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.21-record-readout
        run: |
          python record_readout.py --out outputs > evidence/ci/model.log
          python replay.py --out outputs --video > evidence/ci/render.log
          ffmpeg -v error -i outputs/record_readout.mp4 -f null - 2> evidence/ci/video_decode.log
          python -m compileall -q record_readout.py replay.py test_record_readout.py test_readout_presentation.py
      - name: Package unchanged source, computed data, and actual CI logs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,sys,zipfile
          source=Path('ResearchHistory/UQCF-GEM/demos/v15.21-record-readout');dist=Path('delivery/assets');dist.mkdir(parents=True)
          for name in ['record_readout.mp4','record_readout.html','verification.json','replay_data.json']:
              shutil.copyfile(source/'outputs'/name,dist/name)
          shutil.copyfile(source/'README.md',dist/'REPORT.md')
          provenance={'source_sha':os.environ['GITHUB_SHA'],'base_research_sha':'7b6459f18b0add90a2f88cf9b0a152e2aa5c7647','run_id':os.environ['GITHUB_RUN_ID'],'selected_tests_passed':342,'python':sys.version,'packages':subprocess.check_output([sys.executable,'-m','pip','freeze'],text=True).splitlines(),'scope':'Fresh CI outputs, not byte-identical claims for earlier local files. No scientific model changes or main-branch merge.'}
          (dist/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n')
          files=[]
          for p in sorted(source.rglob('*')):
              if not p.is_file() or '__pycache__' in p.parts or p.suffix=='.pyc':continue
              if p.is_symlink():raise ValueError('symlinks not accepted')
              files.append(p)
          members=[{'name':p.relative_to(source).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          bundle=dist/'UQCF_GEM_v15_21_bundle.zip'
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(source).as_posix())
              z.writestr('PACKAGE_MANIFEST.json',json.dumps({'files':members,'provenance':provenance},indent=2))
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              for row in members:assert hashlib.sha256(z.read(row['name'])).hexdigest()==row['sha256']
          (dist/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(dist.iterdir())))
          Path('delivery/RELEASE_NOTES.md').write_text('# v15.21 — Ensemble readout versus single-copy record events\n\nExact source: `'+os.environ['GITHUB_SHA']+'`.\n\nAll 342 selected tests passed before release packaging. Includes the computed movie, offline HTML, numerical ledger, report and source/CI-evidence bundle. Every release asset is size/SHA-256 verified before publication. No live website or merge to main is performed.\n\nThe frozen predictor supports signed ensemble reconstruction but not an exact all-input single-copy record instrument. Joint masses must be decoded before conditioning. No actual outcome, entropy-production law, physical time or new pruning mechanism is derived.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.21-verified-delivery
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v15.21-failure-evidence
          path: ResearchHistory/UQCF-GEM/demos/v15.21-record-readout/evidence/ci/
          if-no-files-found: ignore
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.21-verified-delivery
          path: delivery
      - name: Create unique draft and verify every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'proteinfoldingengine/WetLabEngine'
          TAG="uqcf-gem-v15.21-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" delivery/assets/* --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'UQCF-GEM v15.21 — record-readout comparison' --notes-file delivery/RELEASE_NOTES.md --draft --prerelease --latest=false
          gh api "repos/$GH_REPO/releases/tags/$TAG" > delivery/RELEASE_METADATA.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('delivery/RELEASE_METADATA.json').read_text())
          local=list(Path('delivery/assets').iterdir());remote={a['name']:a for a in r['assets']}
          assert len(local)==len(remote)==8,(len(local),len(remote))
          for p in local:
              a=remote[p.name]
              assert a['state']=='uploaded' and a['size']==p.stat().st_size
              assert a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('All 8 release assets passed size and SHA-256 checks.')
          PY
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest=false
          gh api "repos/$GH_REPO/releases/tags/$TAG" > delivery/PUBLICATION_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('delivery/PUBLICATION_RECEIPT.json').read_text());assert r['draft'] is False
          print(r['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.21-publication-receipt
          path: delivery/PUBLICATION_RECEIPT.json
          if-no-files-found: error
