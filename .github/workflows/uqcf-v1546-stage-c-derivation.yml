name: UQCF v15.46 Stage C derivation
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility/**'
      - 'docs/superpowers/specs/2026-09-23-v1546-stage-c-primitive-joint-record-derivation.md'
      - 'docs/superpowers/plans/2026-09-23-v1546-stage-c-primitive-joint-record-derivation.md'
      - '.github/workflows/uqcf-v1546-stage-c-derivation.yml'
permissions:
  contents: read
jobs:
  stage-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python -m unittest -v test_stage_c_contract test_stage_c_representations test_stage_c_nonuniqueness
