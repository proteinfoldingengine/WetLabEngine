name: UQCF v15.46 Stage C derivation
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility/**'
      - 'docs/superpowers/specs/2026-09-23-v1546-stage-c-primitive-joint-record-derivation.md'
      - 'docs/superpowers/plans/2026-09-23-v1546-stage-c-primitive-joint-record-derivation.md'
      - '.github/workflows/uqcf-v1546-stage-c-derivation.yml'
permissions:
  contents: read
jobs:
  stage-c:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Complete v15.46 exact-head suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          D=ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python - <<'PY'
          from pathlib import Path
          import sys,unittest
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility').resolve()
          sys.path[:0]=[str(d),str(d/'exploratory')]
          names=[
            'test_evidence_preflight','test_native_record_trace','test_native_record_search',
            'test_stage_c_contract','test_stage_c_representations','test_stage_c_nonuniqueness',
            'test_stage_c_verify','test_stage_c_gate','test_typing_probe'
          ]
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          count=suite.countTestCases()
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          if count<=0 or r.testsRun!=count or not r.wasSuccessful() or r.skipped or r.expectedFailures or r.unexpectedSuccesses:
              raise SystemExit('v1546_complete_suite_failure_or_incomplete')
          print('V1546_COMPLETE_TEST_COUNT',r.testsRun)
          PY
      - name: Replay frozen results and prior controls
        run: |
          set -euo pipefail
          D=ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility
          python - <<'PY'
          from pathlib import Path
          import gzip,json,runpy,sys
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.46-primitive-joint-source-admissibility').resolve()
          sys.path[:0]=[str(d),str(d/'exploratory')]
          import stage_c_contract as sc, stage_c_nonuniqueness as sn, stage_c_verify as sv, stage_c_gate as sg
          root=d.parents[3]
          c=sc.load_contract(root); w=sn.find_witness(c); v=sv.verify_witness(c,w); r=sg.adjudicate(c,w,v)
          assert sg.canonical_bytes(r)==(d/'docs/STAGE_C_RESULTS.json').read_bytes()
          module=runpy.run_path(str(d/'exploratory/proof_checks.py')); old=module['run']()
          assert old['checks_passed']==195
          assert (json.dumps(old,sort_keys=True,indent=2)+'\n').encode('ascii')==gzip.decompress((d/'exploratory/EXPLORATORY_CHECKS.json.gz').read_bytes())
          module=runpy.run_path(str(d/'exploratory/typing_probe.py'))
          assert (json.dumps(module['run'](),sort_keys=True,indent=2)+'\n').encode('ascii')==(d/'exploratory/TYPING_PROBE_RESULTS.json').read_bytes()
          print('V1546_STAGE_C_AND_PRIOR_REPLAYS_PASS')
          PY
          python -m compileall -q "$D"
      - name: Preserve predecessors and exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.44-intrinsic-curvature-interpretation)" = d37f88b98d38aad864e22146ad7dcd2d00f89cd4
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary)" = 775e5549303c1276d3458ec34b553a604436bf0f
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "V1546_STAGE_C_VERIFIED_HEAD $GITHUB_SHA"
