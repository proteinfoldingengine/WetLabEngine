name: UQCF v15.50 common ancestor
on:
  push:
    branches: [research/v15.46-primitive-joint-source-admissibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.50-common-ancestor-universal-object/**'
      - '.github/workflows/uqcf-v1550-common-ancestor.yml'
permissions: {contents: read}
jobs:
  common:
    runs-on: ubuntu-24.04
    env: {PYTHONHASHSEED: '0'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Complete v15.50 and inherited regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ResearchHistory/UQCF-GEM/demos/v15.50-common-ancestor-universal-object
          python -m unittest -v test_common_contract test_common_candidates test_common_factorizations test_verify_common_ancestor test_gate
          cd ../v15.49-cross-domain-recoverability-bridge-classification
          python -m unittest -q test_bridge_contract test_verify_bridge_typing test_gate
          cd ../v15.48-recoverability-signature-completeness
          python -m unittest -q test_signature_contract test_verify_type_obstruction test_gate
          cd ../v15.47-cross-domain-representation-functoriality
          python -m unittest -q test_functor_contract test_functor_candidates test_functor_classes test_verify_functoriality test_gate
          cd ../v15.46-primitive-joint-source-admissibility
          export PYTHONPATH="$PWD/exploratory"
          python -m unittest -q test_evidence_preflight test_native_record_trace test_native_record_search test_stage_c_contract test_stage_c_representations test_stage_c_nonuniqueness test_stage_c_verify test_stage_c_gate test_typing_probe
      - name: Replay v15.50 result
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          d=Path('ResearchHistory/UQCF-GEM/demos/v15.50-common-ancestor-universal-object').resolve()
          sys.path.insert(0,str(d))
          import common_contract as cc,common_candidates as ca,common_factorizations as cf,verify_common_ancestor as vc,gate
          root=d.parents[3]; c=cc.load_contract(root); u=ca.enumerate_candidates(c)[0]
          fr=cf.derive_retained_leg(c,u); fq=cf.derive_quantum_legs(c,u); v=vc.verify(c,u,fr,fq); r=gate.adjudicate(c,v)
          assert gate.canonical_bytes(r)==(d/'docs/RESULTS.json').read_bytes()
          print('V1550_RESULT_REPLAY_PASS')
          PY
          python -m compileall -q ResearchHistory/UQCF-GEM/demos/v15.50-common-ancestor-universal-object
      - name: Exact-head preservation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.44-intrinsic-curvature-interpretation)" = d37f88b98d38aad864e22146ad7dcd2d00f89cd4
          test "$(git rev-parse HEAD:ResearchHistory/UQCF-GEM/demos/v15.45-curvature-factorization-spectral-boundary)" = 775e5549303c1276d3458ec34b553a604436bf0f
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "V1550_VERIFIED_HEAD $GITHUB_SHA"
