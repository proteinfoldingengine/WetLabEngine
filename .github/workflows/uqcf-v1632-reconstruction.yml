name: UQCF v16.32 retained-state reconstruction
on:
  push:
    branches: [research/v16.32-retained-state-reconstruction]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: v16.32 search and witness verification
        run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/
          python test_gate.py
          python producer.py | tee producer.log
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'))
          print(verifier.verify_document(d))
          if d['verdict']=='NONINJECTIVE':
              verifier.verify_collision(d['collisions'][0])
          PY
      - name: inherited closure regressions
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1632-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/PRODUCTION.json
            ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/producer.log
