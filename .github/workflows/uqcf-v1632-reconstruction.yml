name: UQCF v16.32 retained-state reconstruction
on:
  push:
    branches: [research/v16.32-retained-state-reconstruction]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Preregistered RED
        run: cd ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/ && python test_gate.py
