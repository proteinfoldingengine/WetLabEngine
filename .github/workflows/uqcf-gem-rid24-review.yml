name: UQCF receiver_identification d24 freeze review (sections 28-30, positive holdings plus one blind climb; where the forks must be) (grokbot)

on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_d24_review/RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_identification_d24_review/FREEZE.md'
      - '.github/scripts/uqcf_rid24_*.py'
      - '.github/workflows/uqcf-gem-rid24-review.yml'
  workflow_dispatch:
    inputs:
      review:
        description: 'Send the frozen argument to Gemini (only after Aaron confirms the API key quota)'
        required: true
        default: 'false'

permissions:
  contents: read

concurrency:
  group: uqcf-rid24-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: python -m pip install --no-cache-dir numpy==2.3.5 scipy==1.16.3
      - name: Producer (nu variables, parent-array AHU enumeration, HiGHS LP ends with exact rational primal and dual certification)
        run: mkdir -p rid24_verify && python .github/scripts/uqcf_rid24_producer.py rid24_verify/producer.json
      - name: Checker (A variables, independent leaf-attachment enumeration, proof multiplier certificates on named carriers, exact attaining tables)
        run: python .github/scripts/uqcf_rid24_checker.py rid24_verify/checker.json
      - name: Fresh producer reproduction (deterministic bytes)
        run: python .github/scripts/uqcf_rid24_producer.py rid24_verify/producer_repro.json && cmp rid24_verify/producer.json rid24_verify/producer_repro.json
      - name: Comparator and tampering controls
        run: python .github/scripts/uqcf_rid24_compare.py rid24_verify/producer.json rid24_verify/checker.json rid24_verify/compare.json
      - name: Environment record
        if: always()
        run: |
          python -c "import sys,numpy,scipy,json;json.dump({'python':sys.version,'numpy':numpy.__version__,'scipy':scipy.__version__,'sha':'${{ github.sha }}','workflow_sha':'${{ github.workflow_sha }}'},open('rid24_verify/env.json','w'))"
          sha256sum rid24_verify/* > rid24_verify/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid24-verify-${{ github.run_attempt }}
          path: rid24_verify
          if-no-files-found: error
          retention-days: 90

  argument-review:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid24-verify-${{ github.run_attempt }}
          path: rid24_verify
      - name: Fresh independent Gemini whole-argument review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/uqcf_rid24_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid24-review-${{ github.run_attempt }}
          path: rid24_review
          if-no-files-found: error
          retention-days: 90

  publication-audit:
    needs: [verify, argument-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid24-verify-${{ github.run_attempt }}
          path: rid24_verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rid24-review-${{ github.run_attempt }}
          path: rid24_review
      - name: Independent immutable GitHub readback audit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/uqcf_rid24_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rid24-publication-${{ github.run_attempt }}
          path: rid24_publication
          if-no-files-found: error
          retention-days: 90
