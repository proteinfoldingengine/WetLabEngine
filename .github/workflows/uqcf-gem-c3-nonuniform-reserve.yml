name: UQCF-GEM nonuniform reserve classification
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/nonuniform_reserve/producer.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/nonuniform_reserve/independent.py'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/nonuniform_reserve/test_nonuniform.py'
      - '.github/scripts/c3_nonuniform_reserve_review.py'
      - '.github/workflows/uqcf-gem-c3-nonuniform-reserve.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Exact nonuniform reserve classification verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          mkdir nonuniform_verification
          python3 -m unittest discover -s "$ROOT/nonuniform_reserve" -p test_nonuniform.py -v 2>&1 | tee nonuniform_verification/contracts.log
          python3 "$ROOT/nonuniform_reserve/producer.py" nonuniform_verification/certificate.json | tee nonuniform_verification/counts.json
          python3 "$ROOT/nonuniform_reserve/independent.py" nonuniform_verification/certificate.json nonuniform_verification/independent.json | tee nonuniform_verification/independent.log
          for SPEC in 'weak_trace test_weak.py' 'fingerprint_lock test_fingerprint.py' 'private_cover test_private.py' 'moving_cover test_moving.py' 'saturated_handover test_saturated.py' 'slack_handover test_slack.py' 'handover_graph test_handover.py' 'anchored_release test_anchored.py' 'local_progress test_progress.py' 'capacity_gap test_capacity.py' 'saturated_transfer test_transfer.py' 'label_release test_release.py' 'footprint test_footprint.py' 'fixed_family test_fixed_family.py'; do
            read -r DIR PATTERN <<< "$SPEC"
            python3 -m unittest discover -s "$ROOT/$DIR" -p "$PATTERN" -v 2>&1 | tee "nonuniform_verification/inherited_$DIR.log"
          done
          printf 'scientific_sha=%s\nworkflow_sha=%s\n' "$GITHUB_SHA" "$GITHUB_SHA" > nonuniform_verification/provenance.txt
          cp "$ROOT/COUPLED_C3_NONUNIFORM_RESERVE_RESULT.md" nonuniform_verification/frozen_proof_scope.md
          sha256sum nonuniform_verification/certificate.json.identities.jsonl.gz > nonuniform_verification/identities.sha256
          cp "$ROOT/nonuniform_reserve/producer.py" "$ROOT/nonuniform_reserve/independent.py" "$ROOT/nonuniform_reserve/test_nonuniform.py" "$ROOT/nonuniform_reserve/red.log" nonuniform_verification/
          sha256sum nonuniform_verification/certificate.json > nonuniform_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nonuniform-reserve-verification
          path: nonuniform_verification/
  fresh-reproduction:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@v4
        with:
          name: c3-nonuniform-reserve-verification
          path: nonuniform_fresh
      - name: Fresh complete producer and independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/nonuniform_reserve/producer.py" /tmp/fresh.json
          cmp /tmp/fresh.json nonuniform_fresh/certificate.json
          cmp /tmp/fresh.json.identities.jsonl.gz nonuniform_fresh/certificate.json.identities.jsonl.gz
          python3 "$ROOT/nonuniform_reserve/independent.py" /tmp/fresh.json nonuniform_fresh/fresh_independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nonuniform-reserve-fresh-reproduction
          path: nonuniform_fresh/
  mathematical-review:
    needs: fresh-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-nonuniform-reserve-fresh-reproduction
          path: nonuniform_verification
      - name: Adversarial Gemini mathematical review of exact event commit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_nonuniform_reserve_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nonuniform-reserve-mathematical-review
          path: nonuniform_reserve_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-nonuniform-reserve-fresh-reproduction
          path: nonuniform_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-nonuniform-reserve-mathematical-review
          path: nonuniform_reserve_review
      - name: Exact provenance and fresh independent publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/nonuniform_reserve/producer.py" /tmp/publication.json
          cmp /tmp/publication.json nonuniform_verification/certificate.json
          cmp /tmp/publication.json.identities.jsonl.gz nonuniform_verification/certificate.json.identities.jsonl.gz
          python3 "$ROOT/nonuniform_reserve/independent.py" /tmp/publication.json /tmp/publication_independent.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path('nonuniform_reserve_review/manifest.json').read_text())
          assert manifest['research_commit']==manifest['workflow_commit']==os.environ['GITHUB_SHA']
          for name,digest in manifest['input_sha256'].items():
              path=pathlib.Path('nonuniform_verification')/name[9:] if name.startswith('EVIDENCE/') else pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          raw=pathlib.Path('nonuniform_reserve_review/review.txt').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==manifest['response_sha256']
          expected=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n"
          assert pathlib.Path('nonuniform_verification/provenance.txt').read_text()==expected
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(manifest['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':manifest['response_sha256']}
          pathlib.Path('nonuniform_reserve_gate.json').write_text(json.dumps(gate,indent=2)+'\n');print(json.dumps(gate))
          PY
      - name: Separate Gemini publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_nonuniform_reserve_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nonuniform-reserve-publication-audit
          path: |
            nonuniform_reserve_publication/
            nonuniform_reserve_gate.json
