name: UQCF-GEM static capacity and native reachability gap verification review and publication audit
on:
  workflow_dispatch:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/COUPLED_C3_CAPACITY_GAP_SCOPE.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/COUPLED_C3_CAPACITY_GAP_RESULT.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/capacity_gap/*.py'
      - '.github/scripts/c3_capacity_gap_review.py'
      - '.github/workflows/uqcf-gem-c3-capacity_gap.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - name: Exact verification and inherited controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir capacity_gap_verification
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 -m unittest discover -s "$ROOT/capacity_gap" -p test_capacity.py -v 2>&1 | tee capacity_gap_verification/contracts.log
          python3 "$ROOT/capacity_gap/producer.py" capacity_gap_verification/certificate.json | tee capacity_gap_verification/counts.json
          python3 "$ROOT/capacity_gap/producer.py" /tmp/repeated.json
          cmp capacity_gap_verification/certificate.json /tmp/repeated.json
          python3 "$ROOT/capacity_gap/independent.py" capacity_gap_verification/certificate.json | tee capacity_gap_verification/independent.json
          python3 -m unittest discover -s "$ROOT/saturated_transfer" -p test_transfer.py -v 2>&1 | tee capacity_gap_verification/inherited_saturated_transfer.log
          python3 -m unittest discover -s "$ROOT/label_release" -p test_release.py -v 2>&1 | tee capacity_gap_verification/inherited_label_release.log
          python3 -m unittest discover -s "$ROOT/footprint" -p test_footprint.py -v 2>&1 | tee capacity_gap_verification/inherited_footprint.log
          python3 -m unittest discover -s "$ROOT/fixed_family" -p test_fixed_family.py -v 2>&1 | tee capacity_gap_verification/inherited_fixed_family.log
          echo "scientific_sha=$(git -C research_snapshot rev-parse HEAD)" > capacity_gap_verification/provenance.txt
          echo "workflow_sha=$GITHUB_SHA" >> capacity_gap_verification/provenance.txt
          sha256sum capacity_gap_verification/certificate.json > capacity_gap_verification/certificate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-capacity_gap-verification
          path: capacity_gap_verification/
  mathematical-review:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-capacity_gap-verification
          path: capacity_gap_verification
      - name: Independent mathematical review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_capacity_gap_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-capacity_gap-review
          path: capacity_gap_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-capacity_gap-verification
          path: capacity_gap_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-capacity_gap-review
          path: capacity_gap_review
      - name: Independent reproduction and provenance reconciliation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/capacity_gap/producer.py" /tmp/publication-certificate.json
          cmp /tmp/publication-certificate.json capacity_gap_verification/certificate.json
          python3 "$ROOT/capacity_gap/independent.py" /tmp/publication-certificate.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          m=json.loads(pathlib.Path('capacity_gap_review/manifest.json').read_text())
          if m['research_commit']!=os.environ['GITHUB_SHA'] or m['workflow_commit']!=os.environ['GITHUB_SHA']: raise ValueError('commit provenance')
          for n,h in m['input_sha256'].items():
              p=(pathlib.Path('capacity_gap_verification')/n[9:]) if n.startswith('EVIDENCE/') else (pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/n)
              if hashlib.sha256(p.read_bytes()).hexdigest()!=h: raise ValueError('input hash '+n)
          raw=pathlib.Path('capacity_gap_review/review.txt').read_bytes()
          if hashlib.sha256(raw).hexdigest()!=m['response_sha256']: raise ValueError('response hash')
          provenance=pathlib.Path('capacity_gap_verification/provenance.txt').read_text()
          if provenance!=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n": raise ValueError('execution provenance')
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(m['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':m['response_sha256']}
          pathlib.Path('capacity_gap_gate.json').write_text(json.dumps(gate,indent=2)+'\n')
          print(json.dumps(gate))
          PY
      - name: Separate independent publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_capacity_gap_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-capacity_gap-publication
          path: |
            capacity_gap_publication/
            capacity_gap_gate.json

