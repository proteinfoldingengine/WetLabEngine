name: v16.53 development controls
on:
  push:
    branches: [research/v16.53-four-child-boundary]
    paths: ['ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/**', '.github/workflows/v16.53-red.yml']
permissions: {contents: read}
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - run: python ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/development.py out/development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v1653-development-${{ github.sha }}', path: out/development, if-no-files-found: error}
