name: UQCF v16.23 overlap descent
on:
  push:
    branches: [research/v16.23-overlap-descent]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/**'
      - '.github/workflows/uqcf-v1623-overlap-descent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      P: ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Controls, inherited regressions and exact campaign
        run: |
          python - <<'PY'
          import os,json,pathlib,subprocess,sys,platform
          p=pathlib.Path(os.environ['P']).resolve();e=p/'evidence';e.mkdir(exist_ok=True)
          root=pathlib.Path.cwd();records=[]
          commands=[('tests',p,['python','test_gate.py']),('schema',p,['python','test_schema.py']),('v1622',p.parent/'v16.22-response-selection-closure',['python','-m','unittest','discover','-v']),('v1621',root/'ResearchHistory/UQCF-GEM/foundational-closure-verification',['python','tests/test_fcv.py']),('parent',p.parent/'v15.56-response-selector-obstruction',['python','-m','unittest','-v','test_pruning_consistency_audit']),('producer',p,['python','engine.py']),('verifier',p,['python','verify.py'])]
          for name,cwd,cmd in commands:
              with (e/(name+'.log')).open('w') as log:r=subprocess.run(cmd,cwd=cwd,stdout=log,stderr=subprocess.STDOUT)
              records.append({'name':name,'command':cmd,'exit_code':r.returncode});print(name,r.returncode,flush=True)
              (e/'COMMANDS.json').write_text(json.dumps(records,indent=2)+'\n')
              if r.returncode: print((e/(name+'.log')).read_text()[-16000:]);sys.exit(r.returncode)
          PY
      - name: Archive source and actual attempt metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$P/evidence"
          git archive --format=zip HEAD "$P" .github/workflows/uqcf-v1623-overlap-descent.yml > "$P/evidence/source.zip"
          python -m pip freeze > "$P/evidence/dependencies.txt"
          python - <<'PY'
          import hashlib,json,os,pathlib,platform
          p=pathlib.Path(os.environ['P']);e=p/'evidence'
          (e/'EXECUTION.json').write_text(json.dumps({'execution_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'job_name':os.environ['GITHUB_JOB'],'python':platform.python_version(),'review':'self-reviewed; no separate reviewer'},indent=2)+'\n')
          (e/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(e.iterdir()) if f.is_file() and f.name!='SHA256SUMS'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1623-${{ github.sha }}
          path: ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/evidence
          if-no-files-found: error
