name: UQCF v16.02 full ensemble precision
on:
  push:
    branches: [research/v16.02-full-ensemble-precision]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/full-ensemble-precision/**'
      - '.github/workflows/uqcf-full-ensemble-precision.yml'
  workflow_dispatch:
concurrency:
  group: uqcf-v1602-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - run: git rev-parse HEAD | tee execution_head.txt
      - name: Frozen tests and measurement
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/full-ensemble-precision
          set +e
          python -m unittest -v test_gate 2>&1 | tee test.log
          test_status=$?
          set -e
          if [ -f result.json ]; then
            python -c 'import json; r=json.load(open("result.json")); print(json.dumps({k:r[k] for k in ["version","all_valid","verdict","erasure_verdict"]},indent=2))'
            sha256sum PREREGISTRATION.md SOURCE_MANIFEST.json test_gate.py gate.py result.json legacy-result.json.gz | tee SHA256SUMS
          fi
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ensemble-precision-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/full-ensemble-precision/
