name: UQCF polar Sylvester rank3 origin
on:
  push:
    branches: [research/v15.56-response-selector-obstruction]
  workflow_dispatch:
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Polar Sylvester origin RED gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
          python -m unittest -v test_polar_sylvester_rank3_origin
