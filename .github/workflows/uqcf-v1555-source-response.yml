name: UQCF v15.55 source compatibility response
on:
  push:
    branches: [research/v15.55-source-compatibility-response]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.55-source-compatibility-response/**'
      - '.github/workflows/uqcf-v1555-source-response.yml'
permissions: {contents: read}
jobs:
  v1555:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Task 1 contract gate
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.55-source-compatibility-response
          python -m unittest -v test_contract test_defect_datum test_response_space test_response_naturality test_response_controls test_verify_response
      - name: Freeze/replay result
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v15.55-source-compatibility-response
          python - <<'PY'
          import json, verify_response as v
          c=json.load(open("contract.json"))
          a=v.verify(c); b=v.verify(c)
          assert a==b
          frozen=json.load(open("RESULTS.json"))
          assert a["primary_verdict"]==frozen["primary_verdict"]
          assert a["solution_dimension"]==frozen["refined_solution_dimension"]
          assert a["constraint_rank"]==frozen["branch_swap_constraint_rank"]
          PY
