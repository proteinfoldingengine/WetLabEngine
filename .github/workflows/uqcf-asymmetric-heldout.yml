name: UQCF v15.58 asymmetric heldout ensemble
on:
  push:
    branches: [research/v15.58-asymmetric-heldout-ensemble]
  workflow_dispatch:
jobs:
  asymmetric:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Record exact head
        run: git rev-parse HEAD | tee execution_head.txt
      - name: Tests
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest -v test_gate 2>&1 | tee test.log
      - name: Full held-out measurement and verification
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python gate.py --output github_output 2>&1 | tee measurement.log
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python gate.py --verify github_output 2>&1 | tee verification.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asymmetric-heldout-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble/PREREGISTRATION.md
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble/test.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble/measurement.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble/verification.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/asymmetric-heldout-ensemble/github_output
