name: UQCF v16.17-v16.18 dependency gates
on:
  push:
    branches: [research/v16.16-information-exhaust]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/information-exhaust/16.17-PREREGISTRATION.md'
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/information-exhaust/16.18-PREREGISTRATION.md'
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/information-exhaust/test_dependency_gates.py'
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/information-exhaust/dependency_gates.py'
      - '.github/workflows/uqcf-information-exhaust-dependencies.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/information-exhaust && python -m unittest -v test_dependency_gates
