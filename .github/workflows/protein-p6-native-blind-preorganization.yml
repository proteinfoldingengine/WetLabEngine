name: Protein P6 Native-Blind Preorganization Contract

on:
  push:
    branches:
      - research/protein-p6-native-blind-preorganization
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P6/**'
      - '.github/workflows/protein-p6-native-blind-preorganization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ResearchHistory/UQCF-GEM/protein/P6/**'
      - '.github/workflows/protein-p6-native-blind-preorganization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: ResearchHistory/UQCF-GEM/protein/P6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install numpy==1.26.4

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run frozen P6 contract tests
        run: python -m unittest -v test_p6_contract.py
