name: UQCF v16.36 barrier law closure
on:
  push:
    branches: [research/v16.36-barrier-law-closure]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Current rejecting controls
        run: cd ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/ && python test_gate.py
      - name: Complete science
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/;python producer.py
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'));print(verifier.verify_document(d));print(d['gate_d'],d['gate_e'])
          PY
      - name: Full inherited foundational stack
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.34-fiber-component-invariant/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.33-consistency-quotient-kernel/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
      - name: Bind evidence
        if: always()
        run: |
          cd ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/
          printf '{"sha":"%s","run":"%s","attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > EXECUTION.json
          sha256sum producer.py verifier.py test_gate.py PRODUCTION.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1636-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/PRODUCTION.json
            ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/EXECUTION.json
            ResearchHistory/UQCF-GEM/demos/v16.36-barrier-law-closure/SHA256SUMS
