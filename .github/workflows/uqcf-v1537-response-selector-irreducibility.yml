name: UQCF v15.37 Response Selector Irreducibility
on:
  push:
    branches: [research/v15.37-response-selector-irreducibility]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.37-response-selector-irreducibility/**'
      - 'docs/superpowers/specs/2026-09-19-v1537-response-selector-irreducibility-design.md'
      - 'docs/superpowers/plans/2026-09-19-v1537-response-selector-irreducibility-implementation.md'
      - '.github/workflows/uqcf-v1537-response-selector-irreducibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install inherited environment
        run: python -m pip install numpy==2.3.5
      - name: Verify additive scope
        run: |
          python - <<'PY'
          import subprocess
          base='e495157b969a73dcc453a71d9f0710797ec26a28'
          demo='ResearchHistory/UQCF-GEM/demos/v15.37-response-selector-irreducibility/'
          allowed={
            'docs/superpowers/specs/2026-09-19-v1537-response-selector-irreducibility-design.md',
            'docs/superpowers/plans/2026-09-19-v1537-response-selector-irreducibility-implementation.md',
            '.github/workflows/uqcf-v1537-response-selector-irreducibility.yml',
          }
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          for line in subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines():
              status,name=line.split('\t',1)
              assert status=='A',line
              assert name.startswith(demo) or name in allowed,name
          PY
      - name: Run inherited frontier regressions
        run: |
          python - <<'PY'
          import re,subprocess,sys
          from pathlib import Path
          root=Path('ResearchHistory/UQCF-GEM/demos')
          suites=[
            (root/'v15.35-support-radius-locality',['test_gate.py'],7),
            (root/'v15.36-order-semigroup-constraint',['test_gate.py'],6),
          ]
          total=0
          for cwd,files,count in suites:
              r=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
              print(r.stdout[-700:],flush=True)
              m=re.search(r'Ran (\d+) tests? in',r.stdout)
              assert r.returncode==0 and m and int(m.group(1))==count and re.search(r'^OK\s*$',r.stdout,re.M),r.stdout
              total+=count
          assert total==13
          PY
      - name: Run v15.37 exact gate
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.37-response-selector-irreducibility
        run: |
          python -m unittest -v test_gate.py
          python response_selector_irreducibility_gate.py --check docs/RESULTS.json > /tmp/v1537-results.json
          python -m compileall -q response_selector_irreducibility_gate.py test_gate.py
          python - <<'PY'
          import json
          r=json.load(open('docs/RESULTS.json'))
          assert r['status']=='RESPONSE_FUNCTION_IRREDUCIBLE_RELATIVE_TO_AUDITED_FROZEN_ONTOLOGY'
          assert r['candidate_class_count']==14
          assert r['resolved_candidate_class_count']==14
          assert r['unresolved_candidate_count']==0
          assert r['combined_frozen_selector_rank']==0
          assert r['surviving_projective_function_dimension']==9
          assert r['synthetic_control_projective_dimension']==0
          assert r['branch_stop_relative_to_audited_frozen_ontology'] is True
          assert r['response_function_selected'] is False
          assert r['gravity_observables_evaluated'] is False
          assert r['Pillar_3']=='OPEN'
          PY
