name: UQCF v16.19 response information kernel
on:
  push:
    branches: [research/v16.19-response-information-kernel]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/response-information-kernel/**'
      - '.github/workflows/uqcf-response-information-kernel.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3
      - run: cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/response-information-kernel && python -m unittest -v && if test -f gate.py; then python gate.py; fi
