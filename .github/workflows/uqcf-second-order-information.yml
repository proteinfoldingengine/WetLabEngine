name: UQCF v16.20 second-order information
on:
  push:
    branches: [research/v16.20-second-order-information]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/second-order-information/**'
      - '.github/workflows/uqcf-second-order-information.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 sympy==1.13.3 mpmath==1.3.0
      - run: cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/second-order-information && python -m unittest -v && if test -f gate.py; then python gate.py; fi
