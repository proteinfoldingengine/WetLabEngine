name: UQCF v15.72 operational mixture affinity
on:
  push:
    branches: [research/v15.72-operational-mixture-affinity]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/operational-mixture-affinity/**'
      - '.github/workflows/uqcf-operational-mixture-affinity.yml'
  workflow_dispatch:
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: git rev-parse HEAD | tee execution_head.txt
      - name: Frozen tests and measurement
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/operational-mixture-affinity
          python -m unittest -v test_gate 2>&1 | tee test.log
          python gate.py | tee result.json
          sha256sum PREREGISTRATION.md DERIVATION.md test_gate.py gate.py result.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-mixture-affinity-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/operational-mixture-affinity/
