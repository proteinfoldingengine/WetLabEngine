name: Original root trigger after forced parent deletion
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-forced-parent-deletion.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  TRACE_DIR: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
concurrency:
  group: uqcf-forced-parent-deletion
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/TYPE_AND_PROOF.md
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/evidence/PRODUCTION.json
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/NATIVE_ADMISSIBILITY.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/pruning_record_bridge/ACCEPTED_DRAFT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/view_local_pruning/REVIEWED_DRAFT.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce every frozen finite control
        run: |
          python "$TRACE_DIR/replay_original_atomic.py" > original_replay.json
          diff -u "$TRACE_DIR/original_atomic_replay.json" original_replay.json
          python "$TRACE_DIR/replay_root_trigger.py" > replay.json
          diff -u "$TRACE_DIR/root_trigger_replay.json" replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-trigger-source-replay
          path: replay.json
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/TYPE_AND_PROOF.md
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/evidence/PRODUCTION.json
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/NATIVE_ADMISSIBILITY.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/pruning_record_bridge/ACCEPTED_DRAFT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/view_local_pruning/REVIEWED_DRAFT.md
      - name: Independent whole-argument challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$TRACE_DIR/review_root_trigger.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: root-trigger-whole-argument-review
          path: review_evidence
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/TYPE_AND_PROOF.md
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/evidence/PRODUCTION.json
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/NATIVE_ADMISSIBILITY.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/pruning_record_bridge/ACCEPTED_DRAFT.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/view_local_pruning/REVIEWED_DRAFT.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: root-trigger-whole-argument-review
          path: review_evidence
      - name: Verify raw reviewer output and frozen source identities
        run: |
          python3 "$TRACE_DIR/replay_original_atomic.py" > original_replay.json
          diff -u "$TRACE_DIR/original_atomic_replay.json" original_replay.json
          python3 "$TRACE_DIR/replay_root_trigger.py" > publication_replay.json
          diff -u "$TRACE_DIR/root_trigger_replay.json" publication_replay.json
          python3 "$TRACE_DIR/review_root_trigger.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-trigger-publication-readback
          path: review_evidence/publication_audit.json
          if-no-files-found: error
          retention-days: 90
