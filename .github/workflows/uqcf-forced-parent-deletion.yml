name: Retained field component of two pruning events
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-forced-parent-deletion.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  TRACE_DIR: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
concurrency:
  group: uqcf-forced-parent-deletion
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/produce_certificates.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/verify_certificates.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/INTERFACE_LEMMA.md
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/feasibility.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/FOUR_CHILD_INTERFACE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_move_interface/RESULT.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce every frozen finite control
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python "$TRACE_DIR/check_common_field.py" > replay.json
          diff -u "$TRACE_DIR/common_field_results.json" replay.json
          python "$TRACE_DIR/check_attached_contraction.py" > contraction.json
          diff -u "$TRACE_DIR/attached_contraction_results.json" contraction.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common-field-source-replay
          path: |
            replay.json
            contraction.json
          if-no-files-found: error
          retention-days: 90
  argument-review:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/produce_certificates.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/verify_certificates.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/INTERFACE_LEMMA.md
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/feasibility.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/FOUR_CHILD_INTERFACE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_move_interface/RESULT.md
      - name: Independent whole-argument challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$TRACE_DIR/review_common_field.py" review review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: common-field-whole-argument-review
          path: review_evidence
          if-no-files-found: error
          retention-days: 90
  publication-audit:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /.github/scripts/uqcf_preparability_integrity.py
            /.github/scripts/uqcf_preparability_review.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/lineage.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/produce_certificates.py
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/verify_certificates.py
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.22-response-selection-closure/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/engine.py
            /ResearchHistory/UQCF-GEM/demos/v16.26-consistency-increment-law/verify.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/verifier.py
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/INTERFACE_LEMMA.md
            /ResearchHistory/UQCF-GEM/demos/v16.52-recursive-ternary-composition/coverage.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/producer.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/feasibility.py
            /ResearchHistory/UQCF-GEM/demos/v16.53-four-child-boundary/FOUR_CHILD_INTERFACE.md
            /ResearchHistory/UQCF-GEM/research/physical-bridge/receiver_move_interface/RESULT.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: common-field-whole-argument-review
          path: review_evidence
      - name: Verify raw reviewer output and frozen source identities
        run: |
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 "$TRACE_DIR/check_common_field.py" > publication_replay.json
          diff -u "$TRACE_DIR/common_field_results.json" publication_replay.json
          python3 "$TRACE_DIR/check_attached_contraction.py" > publication_contraction.json
          diff -u "$TRACE_DIR/attached_contraction_results.json" publication_contraction.json
          python3 "$TRACE_DIR/review_common_field.py" audit review_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common-field-publication-readback
          path: review_evidence/publication_audit.json
          if-no-files-found: error
          retention-days: 90
