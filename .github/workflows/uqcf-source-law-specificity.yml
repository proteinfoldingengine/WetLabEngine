name: UQCF v15.57 source-law specificity
on:
  push:
    branches: [research/v15.57-source-law-specificity]
  workflow_dispatch:
jobs:
  specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Record exact head
        run: git rev-parse HEAD | tee execution_head.txt
      - name: Source-law specificity tests
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest -v test_gate 2>&1 | tee test.log
      - name: Measure and verify
        run: |
          set -o pipefail
          cd ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python gate.py --output github_output 2>&1 | tee measurement.log
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python gate.py --verify github_output 2>&1 | tee verification.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-law-specificity-${{ github.sha }}
          path: |
            execution_head.txt
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity/PREREGISTRATION.md
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity/test.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity/measurement.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity/verification.log
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction/source-law-specificity/github_output
