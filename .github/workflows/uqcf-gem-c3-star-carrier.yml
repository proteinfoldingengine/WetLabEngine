name: UQCF-GEM C3 nested-star carrier gate
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/star_carrier/**'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/COUPLED_C3_STAR_CARRIER_REPORT.md'
      - '.github/scripts/c3_star_carrier_review.py'
      - '.github/workflows/uqcf-gem-c3-star-carrier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - name: Complete star-carrier verification and inherited replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          mkdir star_carrier_verification
          python3 -m unittest discover -s "$ROOT/star_carrier" -p test_star.py -v 2>&1 | tee star_carrier_verification/contracts.log
          python3 "$ROOT/star_carrier/producer.py" star_carrier_verification/certificate.json | tee star_carrier_verification/counts.json
          python3 "$ROOT/star_carrier/independent.py" star_carrier_verification/certificate.json star_carrier_verification/independent.json | tee star_carrier_verification/independent.log
          for SPEC in 'reserve_activation test_activation.py' 'source_escape test_escape.py' 'cover_static test_cover_static.py' 'nonuniform_reserve test_nonuniform.py' 'weak_trace test_weak.py' 'fingerprint_lock test_fingerprint.py' 'private_cover test_private.py' 'moving_cover test_moving.py' 'saturated_handover test_saturated.py' 'slack_handover test_slack.py' 'handover_graph test_handover.py' 'anchored_release test_anchored.py' 'local_progress test_progress.py' 'capacity_gap test_capacity.py' 'saturated_transfer test_transfer.py' 'label_release test_release.py' 'footprint test_footprint.py' 'fixed_family test_fixed_family.py'; do
            read -r DIR PATTERN <<< "$SPEC"
            python3 -m unittest discover -s "$ROOT/$DIR" -p "$PATTERN" -v 2>&1 | tee "star_carrier_verification/inherited_$DIR.log"
          done
          printf 'scientific_sha=%s\nworkflow_sha=%s\n' "$GITHUB_SHA" "$GITHUB_SHA" > star_carrier_verification/provenance.txt
          cp "$ROOT/COUPLED_C3_STAR_CARRIER_SCOPE.md" "$ROOT/COUPLED_C3_STAR_CARRIER_RESULT.md" "$ROOT/COUPLED_C3_STAR_CARRIER_REPORT.md" star_carrier_verification/
          cp "$ROOT/star_carrier/producer.py" "$ROOT/star_carrier/independent.py" "$ROOT/star_carrier/test_star.py" "$ROOT/star_carrier/PLAN.md" star_carrier_verification/
          sha256sum star_carrier_verification/certificate.json star_carrier_verification/certificate.json.identities.jsonl.gz > star_carrier_verification/evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-star-carrier-verification
          path: star_carrier_verification/
  fresh-reproduction:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: ResearchHistory/UQCF-GEM/research/physical-bridge
      - uses: actions/download-artifact@v4
        with:
          name: c3-star-carrier-verification
          path: star_carrier_verification
      - name: Fresh byte-identical full reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/star_carrier/producer.py" /tmp/fresh.json
          cmp /tmp/fresh.json star_carrier_verification/certificate.json
          cmp /tmp/fresh.json.identities.jsonl.gz star_carrier_verification/certificate.json.identities.jsonl.gz
          python3 "$ROOT/star_carrier/independent.py" /tmp/fresh.json star_carrier_verification/fresh_independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-star-carrier-fresh-reproduction
          path: star_carrier_verification/
  mathematical-review:
    needs: fresh-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-star-carrier-fresh-reproduction
          path: star_carrier_verification
      - name: Gemini 3.1 Pro adversarial mathematical review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 research_snapshot/.github/scripts/c3_star_carrier_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-star-carrier-mathematical-review
          path: star_carrier_review/
  publication-audit:
    needs: mathematical-review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research_snapshot
          persist-credentials: false
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: c3-star-carrier-fresh-reproduction
          path: star_carrier_verification
      - uses: actions/download-artifact@v4
        with:
          name: c3-star-carrier-mathematical-review
          path: star_carrier_review
      - name: Exact provenance and publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research_snapshot rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT=research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge
          python3 "$ROOT/star_carrier/producer.py" /tmp/publication.json
          cmp /tmp/publication.json star_carrier_verification/certificate.json
          cmp /tmp/publication.json.identities.jsonl.gz star_carrier_verification/certificate.json.identities.jsonl.gz
          python3 "$ROOT/star_carrier/independent.py" /tmp/publication.json /tmp/publication_independent.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path('star_carrier_review/manifest.json').read_text())
          assert manifest['research_commit']==manifest['workflow_commit']==os.environ['GITHUB_SHA']
          for name,digest in manifest['input_sha256'].items():
              path=pathlib.Path('star_carrier_verification')/name[9:] if name.startswith('EVIDENCE/') else pathlib.Path('research_snapshot/ResearchHistory/UQCF-GEM/research/physical-bridge')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          raw=pathlib.Path('star_carrier_review/review.txt').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==manifest['response_sha256']
          expected=f"scientific_sha={os.environ['GITHUB_SHA']}\nworkflow_sha={os.environ['GITHUB_SHA']}\n"
          assert pathlib.Path('star_carrier_verification/provenance.txt').read_text()==expected
          gate={'status':'PASS','scientific_commit':os.environ['GITHUB_SHA'],'verified_review_inputs':len(manifest['input_sha256']),'certificate_reproduced_byte_exact':True,'independent_full_reconstruction':True,'response_sha256':manifest['response_sha256']}
          pathlib.Path('star_carrier_gate.json').write_text(json.dumps(gate,indent=2)+'\n');print(json.dumps(gate))
          PY
      - name: Separate Gemini 3.1 Pro publication audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_PHASE: publication
        run: python3 research_snapshot/.github/scripts/c3_star_carrier_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-star-carrier-publication-audit
          path: |
            star_carrier_publication/
            star_carrier_gate.json
