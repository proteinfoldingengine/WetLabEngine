name: Verify the original caller binding
on:
  push:
    branches: [gpt/v1686-recombination-audit-20261118]
    paths: ['.github/workflows/uqcf-caller-binding.yml']
permissions:
  contents: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OPENBLAS_NUM_THREADS: '1'
  SCI: ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/exponential_operation_bridge/RESULT.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v15.14-record-dependencies/adaptive.py
            /ResearchHistory/UQCF-GEM/demos/v15.15-coherent-records/coherent_records.py
            /ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning/recoverability.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/History/H4_rock_test/v1687_16.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - name: Replay all ordered mergers and native scope controls
        run: |
          python3 -m pip install --disable-pip-version-check sympy==1.14.0 numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_caller_binding.py" > handoff/result.json
          cmp handoff/result.json "$SCI/evidence/caller_binding/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caller-binding-replay
          path: handoff
          if-no-files-found: error
  argument-review:
    needs: exact-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/exponential_operation_bridge/RESULT.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v15.14-record-dependencies/adaptive.py
            /ResearchHistory/UQCF-GEM/demos/v15.15-coherent-records/coherent_records.py
            /ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning/recoverability.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/History/H4_rock_test/v1687_16.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - name: Independently check the proof with explicit review field types
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 "$SCI/review_caller_binding.py" review handoff_review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: caller-binding-review
          path: handoff_review
          if-no-files-found: error
  replay-publication:
    needs: argument-review
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ResearchHistory/UQCF-GEM/research/physical-bridge/forced_parent_deletion/
            /ResearchHistory/UQCF-GEM/research/physical-bridge/v1686_recombination_trace/review.py
            /ResearchHistory/UQCF-GEM/research/physical-bridge/exponential_operation_bridge/RESULT.md
            /ResearchHistory/UQCF-GEM/foundational-closure-verification/PROOFS.md
            /ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/engine.py
            /ResearchHistory/UQCF-GEM/demos/v15.14-record-dependencies/adaptive.py
            /ResearchHistory/UQCF-GEM/demos/v15.15-coherent-records/coherent_records.py
            /ResearchHistory/UQCF-GEM/demos/v15.16-partial-pruning/recoverability.py
            /Tmp/TOE/Einstein_13_V1720 retained_bridge_core/History/H4_rock_test/v1687_16.py
            /.github/scripts/uqcf_preparability_review.py
            /.github/scripts/uqcf_preparability_integrity.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: caller-binding-replay
          path: earlier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: caller-binding-review
          path: handoff_review
      - name: Reproduce deterministic bytes and inspect the returned review
        run: |
          python3 -m pip install --disable-pip-version-check sympy==1.14.0 numpy==2.3.5
          mkdir -p handoff
          python3 "$SCI/check_caller_binding.py" > handoff/result.json
          cmp handoff/result.json "$SCI/evidence/caller_binding/result.json"
          diff -r earlier handoff
          python3 "$SCI/review_caller_binding.py" audit handoff_review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caller-binding-publication
          path: handoff_review/publication_audit.json
          if-no-files-found: error
