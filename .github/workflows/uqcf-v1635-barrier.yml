name: UQCF v16.35 fiber barrier closure
on:
  push:
    branches: [research/v16.35-fiber-barrier-closure]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Complete repaired v16.35
        run: |
          set -euo pipefail
          cd ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/
          python test_gate.py
          python producer.py
          python - <<'PY'
          import json,verifier
          d=json.load(open('PRODUCTION.json'));print(verifier.verify_document(d))
          PY
      - name: Full inherited foundational stack
        run: |
          set -euo pipefail
          python ResearchHistory/UQCF-GEM/demos/v16.34-fiber-component-invariant/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.33-consistency-quotient-kernel/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.32-retained-state-reconstruction/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.31-global-component-factorization/test_contract.py
          python ResearchHistory/UQCF-GEM/demos/v16.30-interaction-component-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.29-local-profile-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.28-diamond-attribution-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.25-pruning-refinement-closure/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.24-consistency-order/test_validation.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_gate.py
          python ResearchHistory/UQCF-GEM/demos/v16.23-overlap-descent/test_schema.py
          python ResearchHistory/UQCF-GEM/foundational-closure-verification/tests/test_fcv.py
      - name: Bind evidence
        if: always()
        run: |
          P=ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/
          printf '{"sha":"%s","run":"%s","attempt":"%s","python":"3.11"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$P/EXECUTION.json"
          sha256sum "$P/producer.py" "$P/verifier.py" "$P/test_gate.py" "$P/PRODUCTION.json" > "$P/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1635-repaired-${{ github.sha }}
          if-no-files-found: error
          path: |
            ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/PRODUCTION.json
            ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/EXECUTION.json
            ResearchHistory/UQCF-GEM/demos/v16.35-fiber-barrier-closure/SHA256SUMS
