name: A12 self-contained bounded verification
on:
  push:
    branches: [research/uqcf-overlapping-guard-exchange]
    paths:
      - '.github/workflows/uqcf-a12-self-contained.yml'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/verification/**'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/publication/**'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/A12_CONSOLIDATED_PROOF_AND_AUDIT.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: a12-self-contained-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      A12: ResearchHistory/UQCF-GEM/research/physical-bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            ResearchHistory/UQCF-GEM/research/physical-bridge
            .github/workflows
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Capture immutable source and environment
        run: |
          mkdir -p "$RUNNER_TEMP/a12-output"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          root = pathlib.Path(os.environ['A12'])
          names = [p for p in root.rglob('*') if p.is_file() and 'evidence' not in p.parts and '__pycache__' not in p.parts]
          names.append(pathlib.Path('.github/workflows/uqcf-a12-self-contained.yml'))
          data = {'implementation_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                  'python': sys.version, 'platform': platform.platform(),
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'job_key': os.environ['GITHUB_JOB'], 'repository': os.environ['GITHUB_REPOSITORY'],
                  'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(names)}}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'a12-output', 'context.json').write_text(json.dumps(data, sort_keys=True, indent=2)+'\n')
          print(json.dumps({k:v for k,v in data.items() if k != 'source_sha256'}, sort_keys=True))
          PY
      - name: Reject a failed command hidden by tee
        run: |
          set +e
          (exit 23) | tee "$RUNNER_TEMP/a12-output/pipeline_control.log"
          result=$?
          set -e
          test "$result" -eq 23
          printf '{"observed_exit":23,"expected_exit":23,"status":"REJECTED_MASKED_FAILURE"}\n' > "$RUNNER_TEMP/a12-output/pipeline_control.json"
      - name: Publication safety contracts
        run: |
          python -m unittest discover -s "$A12/publication" -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/a12-output/publication_contracts.log"
      - name: Contract tests (RED until implementation and source repair)
        run: |
          python -m unittest discover -s "$A12/verification" -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/a12-output/contracts.log"
      - name: Rejecting controls before full campaign
        run: |
          timeout 600 python "$A12/verification/verify.py" --controls-only --output "$RUNNER_TEMP/a12-output/controls.json" 2>&1 | tee "$RUNNER_TEMP/a12-output/controls.log"
      - name: Complete bounded primary execution
        run: |
          timeout 600 python "$A12/verification/verify.py" --output "$RUNNER_TEMP/a12-output/primary.json" 2>&1 | tee "$RUNNER_TEMP/a12-output/primary.log"
      - name: Fresh-process deterministic reproduction
        env:
          PYTHONHASHSEED: '1'
        run: |
          timeout 600 python "$A12/verification/verify.py" --output "$RUNNER_TEMP/a12-output/reproduction.json" 2>&1 | tee "$RUNNER_TEMP/a12-output/reproduction.log"
      - name: Compare complete scientific outputs and budget
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'], 'a12-output')
          a=(root/'primary.json').read_bytes(); b=(root/'reproduction.json').read_bytes()
          assert a == b, 'Scientific reproduction differs'
          assert json.loads(a)['status'] == 'BOUNDED_PASS'
          assert sum(p.stat().st_size for p in root.iterdir() if p.is_file()) <= 2*1024*1024, 'Evidence budget exceeded'
          record={'status':'BOUNDED_PASS','byte_exact_reproduction':True,'scientific_sha256':hashlib.sha256(a).hexdigest(),
                  'overall_A12_gate':'OPEN_PENDING_REPORTING_AUDIT'}
          (root/'reproduction_comparison.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print(json.dumps(record,sort_keys=True))
          PY
      - name: Capture actual job metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/a12-output"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs"
          req=urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response: data=json.load(response)
          pathlib.Path(os.environ['RUNNER_TEMP'],'a12-output','jobs_snapshot.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          print('Actual numeric job IDs:', [j['id'] for j in data['jobs']])
          PY
      - name: Recover historical archives and publish verified evidence-only commits
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$A12/publication/evidence_publisher.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a12-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a12-output
          if-no-files-found: error
          retention-days: 30
