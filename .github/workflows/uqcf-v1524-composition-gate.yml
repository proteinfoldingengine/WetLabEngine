name: UQCF v15.24 Composition Gate and GitHub Delivery
on:
  push:
    branches: [research/v15.24-composition-gate]
    paths:
      - 'ResearchHistory/UQCF-GEM/demos/v15.24-composition-gate/**'
      - '.github/workflows/uqcf-v1524-composition-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Verify additive scope, replay absence controls, run 436 selected tests
        run: |
          python - <<'PY'
          import json,os,re,shutil,subprocess,sys,tempfile
          from pathlib import Path
          base='94315bbe90d437cfc109429ec8f83fa121e5e32a'
          root=Path('ResearchHistory/UQCF-GEM');demo=root/'demos/v15.24-composition-gate'
          changed=subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines()
          for line in changed:
              status,name=line.split('\t',1)
              assert status=='A' and (name.startswith(str(demo)+'/') or name=='.github/workflows/uqcf-v1524-composition-gate.yml'),line
          logs=(demo/'evidence/ci').resolve();logs.mkdir(parents=True)
          red=[]
          for kind,test,count in [('model','test_composition.py',24),('view','test_composition_view.py',6)]:
              with tempfile.TemporaryDirectory() as temp:
                  work=Path(temp)
                  if kind=='model':
                      raw=subprocess.check_output(['git','show','bca53f756507f0d33ac7eae353fe0b1391144e02:'+str(demo/test)])
                      (work/test).write_bytes(raw)
                  else:
                      shutil.copytree(demo,work,dirs_exist_ok=True,ignore=shutil.ignore_patterns('evidence','outputs','__pycache__','*.pyc'))
                      (work/'replay.py').unlink()
                  env=dict(os.environ);env.pop('PYTHONPATH',None)
                  result=subprocess.run([sys.executable,'-m','unittest','-v',test],cwd=work,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
                  (logs/('RECONSTRUCTED_ABSENCE_'+kind+'.log')).write_text(result.stdout)
                  assert result.returncode!=0 and re.search(rf'Ran {count} tests? in',result.stdout),result.stdout
                  assert re.search(rf'FAILED \(failures={count}\)',result.stdout),result.stdout
                  red.append({'layer':kind,'expected_failures':count,'meaning':'Fresh missing-implementation replay, NOT original historical RED evidence'})
          suites=[('v15/v15.11',['test_continuity.py'],20),('demos/v15.12-pretime-to-history',['test_simulation.py','test_presentation.py'],30),('demos/v15.13-independent-events',['test_model.py','test_replay.py'],27),('demos/v15.14-record-dependencies',['test_adaptive.py','test_replay.py'],30),('demos/v15.15-coherent-records',['test_coherent.py','test_replay.py'],30),('demos/v15.16-partial-pruning',['test_recoverability.py','test_replay.py'],33),('demos/v15.17-retained-motion',['test_motion.py','test_replay.py'],32),('demos/v15.18-invariant-completion',['test_completion.py','test_replay.py'],34),('demos/v15.19-linear-prediction',['test_linear.py','test_replay.py'],36),('demos/v15.20-physical-predictor',['test_channel.py','test_replay.py'],38),('demos/v15.21-record-readout',['test_record_readout.py','test_readout_presentation.py'],32),('demos/v15.22-event-sufficient-retention',['test_event_sufficiency.py','test_sufficiency_presentation.py'],32),('demos/v15.23-sufficient-channel-family',['test_family.py','test_family_view.py'],32),('demos/v15.24-composition-gate',['test_composition.py','test_composition_view.py'],30)]
          total=0
          for folder,files,count in suites:
              result=subprocess.run([sys.executable,'-m','unittest','-v',*files],cwd=root/folder,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              (logs/(Path(folder).name+'.log')).write_text(result.stdout)
              print(folder,result.stdout[-300:],flush=True)
              assert result.returncode==0 and re.search(rf'Ran {count} tests? in',result.stdout) and re.search(r'^OK\s*$',result.stdout,re.M),(folder,result.stdout)
              total+=count
          assert total==436
          (logs/'SUMMARY.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'base_sha':base,'selected_tests_passed':total,'suites':[{'folder':f,'count':n} for f,_,n in suites],'absence_replays':red,'scope':'Fresh selected research regression, not full-repository coverage, historical RED evidence, or independent scientific review'},indent=2)+'\n')
          PY
      - name: Reproduce numerical ledger, inspector and video
        working-directory: ResearchHistory/UQCF-GEM/demos/v15.24-composition-gate
        run: |
          python composition_gate.py --out outputs > evidence/ci/model.log
          python replay.py --out outputs --video > evidence/ci/render.log
          ffmpeg -v error -i outputs/composition_gate.mp4 -f null - 2> evidence/ci/video_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json outputs/composition_gate.mp4 > evidence/ci/video_info.json
          python -m compileall -q composition_gate.py replay.py test_composition.py test_composition_view.py
      - name: Package source, output bytes and fresh evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,sys,zipfile
          source=Path('ResearchHistory/UQCF-GEM/demos/v15.24-composition-gate');dist=Path('delivery/assets');dist.mkdir(parents=True)
          info=json.loads((source/'evidence/ci/video_info.json').read_text())
          assert any(s.get('codec_name')=='h264' and s.get('width')==1280 and s.get('height')==720 for s in info['streams'])
          assert abs(float(info['format']['duration'])-24)<0.1
          for name in ['composition_gate.mp4','composition_gate.html','verification.json','replay_data.json']:
              shutil.copyfile(source/'outputs'/name,dist/name)
          shutil.copyfile(source/'README.md',dist/'REPORT.md')
          provenance={'source_sha':os.environ['GITHUB_SHA'],'base_sha':'94315bbe90d437cfc109429ec8f83fa121e5e32a','run_id':os.environ['GITHUB_RUN_ID'],'selected_tests_passed':436,'python':sys.version,'packages':subprocess.check_output([sys.executable,'-m','pip','freeze'],text=True).splitlines(),'scope':'Fresh CI reproduction. Absence controls replay missing modules; they are not original local TDD logs. Browser and visual inspection are separate, not inferred from successful video decode.'}
          (dist/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n')
          files=[]
          for p in sorted(source.rglob('*')):
              if p.is_symlink():raise ValueError('Symlink rejected')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc':files.append(p)
          members=[{'name':p.relative_to(source).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          bundle=dist/'UQCF_GEM_v15_24_bundle.zip'
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(source).as_posix())
              z.writestr('PACKAGE_MANIFEST.json',json.dumps({'files':members,'provenance':provenance},indent=2))
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              for row in members:
                  raw=z.read(row['name']);assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          (dist/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(dist.iterdir())))
          Path('delivery/RELEASE_NOTES.md').write_text('# v15.24 — Composition gate\n\nExact source: `'+os.environ['GITHUB_SHA']+'`. All 436 selected tests passed before packaging.\n\nOf the 15 inherited idempotent batch-retention maps, seven are non-signalling and four are independent product channels. The three additional non-signalling maps have explicit correlated local-phase implementations. These are conditional requirements on supplied tensor factors, not derived physical locality, clocks or outcome selection.\n\nThe release contains a completed MP4/offline HTML, report, numerical ledger, replay data, source/fresh-CI-evidence bundle, provenance and checksums. Publication requires size/SHA-256 verification of all eight assets. No live website, changed older research file, or merge to main. Historical local-log claims are not substituted for the fresh CI evidence.\n')
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()==''
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.24-verified-delivery
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v15.24-failure-evidence
          path: ResearchHistory/UQCF-GEM/demos/v15.24-composition-gate/evidence/ci/
          if-no-files-found: ignore
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v15.24-verified-delivery
          path: delivery
      - name: Upload unique draft and verify every digest before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'proteinfoldingengine/WetLabEngine'
          TAG="uqcf-gem-v15.24-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" delivery/assets/* --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'UQCF-GEM v15.24 — composition gate' --notes-file delivery/RELEASE_NOTES.md --draft --prerelease --latest=false
          RELEASE_ID="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > delivery/RELEASE_METADATA.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('delivery/RELEASE_METADATA.json').read_text())
          local=list(Path('delivery/assets').iterdir());remote={a['name']:a for a in data['assets']}
          assert len(local)==len(remote)==8
          for path in local:
              asset=remote[path.name]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          print('All eight release assets match SHA-256 and size.')
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=false > delivery/PUBLICATION_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('delivery/PUBLICATION_RECEIPT.json').read_text())
          assert data['draft'] is False
          print(data['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15.24-publication-receipt
          path: delivery/PUBLICATION_RECEIPT.json
          if-no-files-found: error
