name: Weight-polar-lift whole-argument independent review
on:
  push:
    branches: [gpt/weight-polar-lift-review]
    paths:
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review/DERIVATION.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review/REVIEW_PLAN.md'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review/*.json'
      - 'ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review/sources/**'
      - '.github/scripts/uqcf_weight_polar_lift*.py'
      - '.github/workflows/uqcf-weight-polar-lift.yml'
permissions:
  contents: read
  actions: read
env:
  UQCF_WORKFLOW_SHA: ${{ github.sha }}
concurrency:
  group: weight-polar-lift-review
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/pair_role_source_trace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - name: Frozen proof integrity and full inherited regression stack
        run: python .github/scripts/uqcf_weight_polar_lift.py verify evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: weight-polar-lift-verification-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  review:
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/pair_role_source_trace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weight-polar-lift-verification-${{ github.run_attempt }}
          path: previous
      - name: Independent whole-argument Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/uqcf_weight_polar_lift.py review reviewed previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: weight-polar-lift-review-${{ github.run_attempt }}
          path: reviewed
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  publication:
    needs: [verification, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/pair_role_source_trace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3 mpmath==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weight-polar-lift-verification-${{ github.run_attempt }}
          path: previous
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weight-polar-lift-review-${{ github.run_attempt }}
          path: reviewed
      - name: Fresh reproduction, raw review parsing and immutable source readback
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_weight_polar_lift.py publication published previous reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: weight-polar-lift-publication-${{ github.run_attempt }}
          path: published
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  archive:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            .github
            ResearchHistory/UQCF-GEM/foundational-closure-verification
            ResearchHistory/UQCF-GEM/demos/v15.56-response-selector-obstruction
            ResearchHistory/UQCF-GEM/demos/v16.15F-graded-obstruction-descent
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_owner_correspondence
            ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review
            ResearchHistory/UQCF-GEM/research/physical-bridge/native_record_followup/pair_role_source_trace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download and validate original ZIPs and completed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/uqcf_weight_polar_lift_archive.py
      - name: Preserve evidence on isolated branch only
        env:
          REVIEW_BRANCH: gpt/weight-polar-lift-review
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name proteinfolding-gpt
          git config user.email proteinfolding-gpt@users.noreply.github.com
          git add ResearchHistory/UQCF-GEM/research/physical-bridge/weight_polar_lift_review/evidence
          git commit -m "Archive weight-polar-lift review run $GITHUB_RUN_ID"
          git push origin "HEAD:$REVIEW_BRANCH"
          git fetch origin "$REVIEW_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python .github/scripts/uqcf_weight_polar_lift_archive.py readback FETCH_HEAD


